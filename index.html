<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LET = "ABCDEFGH";
const store = {
  get(k, d) { try { const v = localStorage.getItem("c2:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("c2:" + k, JSON.stringify(v)); } catch {} }
};

/* ---------- stats ---------- */
let stats = store.get("stats", { items: {}, exams: [] });
function record(key, d, o, ok, kind) {
  const it = stats.items[key] || (stats.items[key] = { d, o, k: kind, r: 0, w: 0 });
  ok ? it.r++ : it.w++;
  store.set("stats", stats);
  if (!key.startsWith("p:")) missUpdate(key, d, o, ok);
  hypeEvent(key, d, ok);
  achSoon();
}

/* ---------- domains ---------- */
let active = new Set(store.get("domains", [1, 2, 3, 4]));
const inDom = x => active.has(x.d);
function tagHTML(x) { return `<span class="tag"><span class="dd d${x.d}">${x.d}.0 ${esc(DOMAINS[x.d].short)}</span>Obj ${esc(x.o)}</span>`; }
function buildDomainBar() {
  const bar = $("#domainbar");
  bar.querySelectorAll(".chip").forEach(c => c.remove());
  for (const d of [1, 2, 3, 4]) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.id = "dom-" + d;
    b.setAttribute("aria-pressed", active.has(d));
    b.innerHTML = `<i style="background:var(--d${d})"></i>${d}.0 <span class="fn">${esc(DOMAINS[d].name)}</span><span class="sn">${esc(DOMAINS[d].short)}</span>`;
    b.onclick = () => {
      if (active.has(d) && active.size === 1) return;
      active.has(d) ? active.delete(d) : active.add(d);
      store.set("domains", [...active]);
      buildDomainBar(); resetViews(); render();
    };
    bar.appendChild(b);
  }
}

/* ---------- AI (sample capability) ---------- */
let sampleFn = null, aiState = "checking";
(async () => {
  try { if (window.claude && typeof window.claude.use === "function") sampleFn = await window.claude.use("sample"); } catch { sampleFn = null; }
  aiState = sampleFn ? "ready" : "off";
  document.querySelectorAll("[data-ai]").forEach(paintAi);
})();
function paintAi(el) {
  el.className = "aistate" + (aiState === "ready" ? " on" : "");
  el.textContent = aiState === "ready" ? "AI grading ready" : aiState === "checking" ? "Checking for AI grading…" : "AI grading unavailable: keyword grading";
}

/* ---------- tabs ---------- */
const TABS = ["today", "cards", "code", "pbq", "scen", "exam", "missed", "stats", "arcade"];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("tab", "today");
if (!TABS.includes(tab)) tab = "today";
function setTab(t) {
  tab = t; store.set("tab", t);
  if (t === "arcade" && !hype.on) t = tab = "today";
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t || (t === "scen" && b.dataset.tab === "pbq")));
  TABS.forEach(x => { $("#view-" + x).hidden = x !== t; });
  $("#domainbar").hidden = t === "missed" || t === "today" || t === "arcade";
  $("#labsw").hidden = !(t === "pbq" || t === "scen"); $("#labsw-pbq").setAttribute("aria-pressed", t === "pbq"); $("#labsw-scen").setAttribute("aria-pressed", t === "scen");
  render();
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { rv.on = false; setTab(b.dataset.tab); });

/* ================= FLASHCARDS ================= */
const fc = { mode: store.get("fcmode", "mc"), deck: [], i: 0, r: 0, n: 0, answered: false, match: null };
function fcDeck() { const pr = c => { const r = srs["c:" + c.t]; return !r ? 1 : r.due < endOfToday() ? 0 : 2; }; fc.deck = shuffle(CARDS.filter(inDom)).sort((x, y) => pr(x) - pr(y)); fc.i = 0; fc.r = 0; fc.n = 0; fc.answered = false; fc.match = null; }
const normT = s => String(s).toLowerCase().replace(/[‘’“”]/g, "'").replace(/[\s._\-–—()'"/\\]+/g, "").replace(/^(the|an?)(?=\w)/, "");
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function termMatches(card, input) {
  const g = normT(input); if (!g) return false;
  return [card.t, ...(card.alt || [])].some(x => { const t = normT(x); return t === g || (t.length >= 7 && lev(t, g) <= 1); });
}
function renderCards() {
  const v = $("#view-cards");
  if (!fc.deck.length) fcDeck();
  const modeBtn = (m, l) => `<button type="button" id="fcm-${m}" aria-pressed="${fc.mode === m}" data-m="${m}">${l}</button>`;
  v.innerHTML = `<div class="bar"><span class="lbl">Mode</span><span class="seg">${modeBtn("mc", "Multiple choice")}${modeBtn("type", "Type it")}${modeBtn("match", "Match")}${modeBtn("acro", "Acronyms")}</span>
    <span class="score" id="fcscore"></span></div><div class="panel" id="fcpanel" style="margin-top:12px"></div>`;
  v.querySelectorAll(".seg button").forEach(b => b.onclick = () => { fc.mode = b.dataset.m; store.set("fcmode", fc.mode); ab.phase = "start"; clearInterval(ab.tick); fcDeck(); renderCards(); });
  if (fc.mode === "match") return renderMatch();
  if (fc.mode === "acro") return renderAcro();
  if (fc.i >= fc.deck.length) {
    $("#fcpanel").innerHTML = `<div class="empty"><h2>Deck done: ${fc.r}/${fc.n}</h2><p>${fc.n ? Math.round(100 * fc.r / fc.n) : 0}% this round.</p><button class="btn" id="fcagain">Shuffle again</button></div>`;
    $("#fcagain").onclick = () => { fcDeck(); renderCards(); };
    return;
  }
  $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`;
  fc.mode === "mc" ? renderMC() : renderType();
}
function nextCard() { fc.i++; fc.answered = false; renderCards(); }
function renderMC() {
  const c = fc.deck[fc.i], p = $("#fcpanel");
  let pool = CARDS.filter(x => x.t !== c.t && x.d === c.d && x.def !== c.def);
  if (pool.length < 3) pool = CARDS.filter(x => x.t !== c.t);
  const opts = shuffle([c, ...shuffle(pool).slice(0, 3)]);
  p.innerHTML = `${tagHTML(c)}<div class="prompt term">${esc(c.t)}</div><p class="note" style="margin:-8px 0 12px">Pick the matching definition (keys 1–4).</p>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}" type="button"><span class="bub">${LET[i]}</span><span>${esc(o.def)}</span></button>`).join("")}</div><div id="fcfb"></div>`;
  const btns = [...p.querySelectorAll(".opt")];
  const pick = i => {
    if (fc.answered) return; fc.answered = true;
    const ok = opts[i] === c; fc.n++; if (ok) fc.r++;
    record("c:" + c.t, c.d, c.o, ok, "card");
    btns.forEach((b, j) => { b.disabled = true; if (opts[j] === c) b.classList.add("ok"); else if (j === i) b.classList.add("no"); });
    $("#fcfb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b class="v">${ok ? "Correct" : "Not this one"}</b>${ok ? "" : `You picked the definition of <span class="mono">${esc(opts[i].t)}</span>.`}</div><div class="row"><button class="btn" id="fcnext">Next card →</button></div>`;
    $("#fcnext").onclick = nextCard; $("#fcnext").focus();
    $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`;
  };
  btns.forEach((b, i) => b.onclick = () => pick(i));
  fc.keyHandler = e => { if (tab === "cards" && fc.mode === "mc" && !fc.answered && /^[1-4]$/.test(e.key) && !e.target.matches("input,textarea")) pick(+e.key - 1); };
}
function renderType() {
  const c = fc.deck[fc.i], p = $("#fcpanel");
  p.innerHTML = `${tagHTML(c)}<div class="prompt">${esc(c.def)}</div>
    <label class="lbl" for="fcin">Type the term, tool or command</label>
    <input class="txt mono" id="fcin" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:6px">
    <div class="row"><button class="btn" id="fccheck">Check</button><button class="btn ghost" id="fcskip">I don't know</button></div><div id="fcfb"></div>`;
  const inp = $("#fcin"); inp.focus();
  const grade = give => {
    if (fc.answered) return; fc.answered = true;
    const ok = !give && termMatches(c, inp.value); fc.n++; if (ok) fc.r++;
    record("c:" + c.t, c.d, c.o, ok, "card");
    inp.disabled = true; $("#fccheck").disabled = true; $("#fcskip").disabled = true;
    const alts = (c.alt || []).length ? ` <span class="note">(also accepted: ${c.alt.map(esc).join(", ")})</span>` : "";
    $("#fcfb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b class="v">${ok ? "Correct" : "Answer"}</b><span class="mono">${esc(c.t)}</span>${alts}</div>
      <div class="row"><button class="btn" id="fcnext">Next card →</button>${!ok && !give && inp.value.trim() ? `<button class="btn ghost" id="fcover">I was right, count it</button>` : ""}</div>`;
    $("#fcnext").onclick = nextCard; $("#fcnext").focus();
    const ov = $("#fcover");
    if (ov) ov.onclick = () => { missRevertLast("c:" + c.t); hypeRevert(); fc.r++; const it = stats.items["c:" + c.t]; it.w--; it.r++; store.set("stats", stats); ov.remove(); $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`; };
    $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`;
  };
  $("#fccheck").onclick = () => grade(false);
  $("#fcskip").onclick = () => grade(true);
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); grade(false); } };
}
function newMatchSet() {
  const pool = CARDS.filter(inDom), pick = [], defs = new Set();
  for (const c of shuffle(pool)) { if (!defs.has(c.def) && !pick.some(p => p.t === c.t)) { pick.push(c); defs.add(c.def); } if (pick.length === 5) break; }
  fc.match = { set: pick, terms: shuffle(pick), defs: shuffle(pick), done: new Set(), sel: null, miss: 0 };
}
function renderMatch() {
  if (!fc.match) newMatchSet();
  const m = fc.match, p = $("#fcpanel");

/* ================= SPACED REPETITION (Leitner) ================= */
const DAY = 864e5, IV = [0, 1, 3, 7, 14, 30]; // box -> days until next review
const nowMs = () => Date.now() + (window.__timeShift || 0);
const sod = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const endOfToday = () => sod(nowMs()) + DAY;
let srs = store.get("srs", null);
if (!srs) { // migrate earlier misses / history into the scheduler (due today)
  srs = {};
  const old = store.get("misses", null) || {};
  const src = Object.keys(old).length ? Object.entries(old).map(([k, m]) => [k, m.d, m.o, m.n || 1])
    : Object.entries(stats.items).filter(([k, it]) => it.w > 0 && !k.startsWith("p:")).map(([k, it]) => [k, it.d, it.o, it.w]);
  src.forEach(([k, d, o, n]) => { srs[k] = { d, o, box: 1, due: nowMs(), miss: true, n, last: 0 }; });
  store.set("srs", srs);
}
let srsUndo = null;
function srsUpdate(key, d, o, ok, opt = {}) {
  const r = srs[key], t = nowMs();
  srsUndo = { key, prev: r ? { ...r } : null };
  if (!r && ok && !key.startsWith("c:")) return; // only flashcards enter the schedule on a correct first answer
  if (!ok) {
    const x = r || (srs[key] = { d, o, box: 1, due: 0, miss: false, n: 0, last: 0 });
    x.box = 1; x.due = sod(t) + IV[1] * DAY; x.last = t;
    if (!opt.learn) { x.miss = true; x.n++; }
  } else if (!r) { srs[key] = { d, o, box: 2, due: sod(t) + IV[2] * DAY, miss: false, n: 0, last: t }; }
  else if (r.due < endOfToday()) { // only a review that was due advances the box
    r.box = Math.min(5, r.box + 1); r.due = sod(t) + IV[r.box] * DAY; r.last = t;
    if (r.miss && r.box >= 5) { r.miss = false; store.set("cleared", (store.get("cleared", 0) || 0) + 1); }
  } else r.last = t;
  store.set("srs", srs); paintBadges();
}
function srsRevert(key) { if (!srsUndo || srsUndo.key !== key) return; if (srsUndo.prev) srs[key] = srsUndo.prev; else delete srs[key]; store.set("srs", srs); paintBadges(); }
// compatibility with existing call sites
const missUpdate = (k, d, o, ok) => srsUpdate(k, d, o, ok);
const missRevertLast = k => srsRevert(k);
const dueKeys = () => Object.entries(srs).filter(([k, r]) => r.due < endOfToday() && missCard(k)).sort((a, b) => (b[1].miss - a[1].miss) || (a[1].due - b[1].due)).map(([k]) => k);
const missKeys = dom => Object.entries(srs).filter(([k, r]) => r.miss && (!dom || r.d === dom) && missCard(k)).map(([k]) => k);
function paintBadges() {
  const m = $("#misscount"), t = $("#duecount");
  if (m) { const n = missKeys().length; m.textContent = n; m.hidden = !n; }
  if (t) { const n = dueKeys().length; t.textContent = n; t.hidden = !n; }
}
const paintMissBadge = paintBadges;
const whenTxt = due => { const days = Math.round((sod(due) - sod(nowMs())) / DAY); return days <= 0 ? "due today" : days === 1 ? "due tomorrow" : `in ${days} days`; };
const boxDots = r => `${"●".repeat(Math.min(4, r.box - 1))}${"○".repeat(Math.max(0, 4 - (r.box - 1)))}`;

/* turn any key into a reviewable card */
function missCard(key) {
  const [p, ...rest] = key.split(":"); const id = rest.join(":");
  if (p === "c") { const c = CARDS.find(x => x.t === id); return c && { src: "Flashcard", d: c.d, o: c.o, front: `<div class="prompt term">${esc(c.t)}</div><p class="note">What is it? Say it, then flip.</p>`, back: esc(c.def), short: c.t }; }
  if (p === "k") { const c = CMDS[+id]; return c && { src: "Command", d: c.d, o: c.o, front: `<div class="prompt">${esc(c.task)}</div><p class="note">Say or type the command, then flip.</p>`, back: `<span class="mono big-ans">${esc(c.ans)}</span><br>${esc(c.why)}`, short: c.task }; }
  if (p === "s") { const c = SCRIPTS[+id]; return c && { src: "Script", d: c.d, o: c.o, front: `<div class="term"><pre>${esc(c.code)}</pre></div><div class="prompt" style="font-size:1.05rem">${esc(c.q)}</div>`, back: `<b>${esc(c.c[c.a])}</b><br>${esc(c.why)}`, short: c.q + " (" + c.lang + ")" }; }
  if (p === "e") { const q = EXAM[+id]; return q && { src: "Exam", d: q.d, o: q.o, front: `<div class="prompt" style="font-size:1.1rem">${esc(q.q)}</div>`, back: `<b>${esc(keyText(q))}</b><br>${esc(q.why)}`, short: q.q }; }
  if (p === "t") { const s = SCENS.find(x => x.id === id); return s && { src: "Ticket", d: s.d, o: s.o, front: `<div class="ticket" style="margin:0"><span class="lbl">Ticket</span><p>${esc(s.ticket)}</p></div><p class="note">Root cause and fix?</p>`, back: `<b>Cause:</b> ${esc(s.diag.c[s.diag.a])}<br><b>Fix:</b> ${esc(s.fix.c[s.fix.a])}`, short: s.title }; }
  if (p === "pf") { const [qid, fid] = id.split(":"); const q = PBQS.find(x => x.id === qid), f = q && q.fields.find(x => x.id === fid); if (!f) return null;
    const ans = f.type === "grid" ? `<b>${esc(fieldAnsText(f))}</b>` : f.type === "dnd" ? `<ul style="margin:4px 0 0;padding-left:18px">${f.targets.map(x => `<li>${esc(x.t)} → <b>${esc(x.ans)}</b></li>`).join("")}</ul>` : f.type === "order" ? `<ol style="margin:4px 0 0;padding-left:20px">${f.ans.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<b>${esc(Array.isArray(f.ans) ? (f.ans.join(", ") || "none") : f.ans)}</b>`;
    return { src: "PBQ", d: q.d, o: q.o, front: `<span class="lbl">${esc(q.title)}</span><div class="prompt" style="font-size:1.1rem">${esc(f.label)}</div>${q.brief.length < 260 ? `<p class="note">${esc(q.brief)}</p>` : ""}`, back: `${ans}<br>${esc(f.why)}`, short: q.title + ": " + f.label }; }
  return extraCard(p, id);
}

function readiness() {
  const out = {};
  [1, 2, 3, 4].forEach(d => {
    const cards = CARDS.filter(c => c.d === d), ret = cards.filter(c => { const r = srs["c:" + c.t]; return r && r.box >= 3; }).length;
    const exs = Object.entries(stats.items).filter(([k, it]) => k.startsWith("e:") && it.d === d).reduce((a, [, it]) => (a.r += it.r, a.n += it.r + it.w, a), { r: 0, n: 0 });
    const best = store.get("pbqbest", {}), sb = store.get("scbest", {});
    const labs = [...PBQS.filter(q => q.d === d).map(q => (best[q.id] || 0) / 100), ...SCENS.filter(s => s.d === d).map(s => sb[s.id] ? 1 : 0)];
    const parts = [[ret / cards.length, .35], [exs.n >= 5 ? exs.r / exs.n : null, .40], [labs.length ? labs.reduce((a, b) => a + b, 0) / labs.length : null, .25]];
    const have = parts.filter(p => p[0] !== null), tw = have.reduce((a, p) => a + p[1], 0);
    out[d] = { cards: ret / cards.length, ret, total: cards.length, exam: exs.n >= 5 ? exs.r / exs.n : null, examN: exs.n, labs: labs.length ? parts[2][0] : null, score: tw ? have.reduce((a, p) => a + p[0] * p[1], 0) / tw : 0 };
  });
  out.all = [1, 2, 3, 4].reduce((a, d) => a + out[d].score * DOMAINS[d].w, 0) / 100;
  return out;
}

  else if (o.id === "shield") { if ((hype.shields || 0) < SHIELD_MAX) { hype.shields++; msg = "🛡️ +1 streak shield"; } else { addXp(100); msg = "🛡️ Shields full, so +100 XP instead"; } }
  else if (o.id === "double") { hype.boost = hype.boost || {}; hype.boost.dbl = (hype.boost.dbl || 0) + 15; msg = "🔥 Double XP on your next 15 correct answers"; }
  else if (o.id === "surge") { addXp(500); msg = "💻 XP surge: +500 XP"; }

  else if (o.id === "loot") { const it = lootDrop(false); msg = it ? `💾 Loot drop: ${it.cat.toLowerCase()} <b>${esc(it.name)}</b>. Equip it in Collection.` : "💾 Collection complete, so +300 XP instead"; }

  else { addXp(10); msg = "No match: +10 XP for the pull"; }
  ar.last = `<div class="fb ${o.id === "none" ? "" : "good"} spinmsg"><b class="v">${msg}</b>${extra}</div>`;

  stay();
  if (o.id !== "none") { sfx(big ? "jackpot" : "coin"); coinRain(big ? 40 : 14); }

  achSoon();
}
