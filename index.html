  {set:"tia",sev:"Wrong",pg:"93",obj:"1.9",said:"\"pwd: set or change a password\".",fix:"pwd = print working directory. passwd changes a password.",link:"https://man7.org/linux/man-pages/man1/pwd.1.html"},
  {set:"tia",sev:"Wrong",pg:"93",obj:"1.9",said:"\"find: search for text in files in a directory\".",fix:"find locates files by name, type, size or date (find /var -name \"*.log\"). grep searches the text inside files.",link:""},
  {set:"tia",sev:"Wrong",pg:"96",obj:"1.9",said:"chmod 764 is the same as \"chmod u+rwx,g+rw,a+r\".",fix:"+ only adds bits and a = all users, so that leaves any existing bits in place and gives read to everyone. The exact equivalent is chmod u=rwx,g=rw,o=r.",link:""},
  {set:"tia",sev:"Wrong",pg:"56",obj:"1.4",said:"HKEY_USERS \"stores settings that apply to all users\"; HKEY_CURRENT_CONFIG \"settings for individual devices when multiple of the same type are installed\"; HKEY_LOCAL_MACHINE \"devices installed or removed\".",fix:"HKLM holds machine-wide hardware and software settings (SAM, Security, Software, System). HKU holds each loaded user's profile hive; HKCU is the signed-in user's view of it. HKCC is the current hardware profile, pulled from HKLM\\System.",link:"https://learn.microsoft.com/en-us/windows/win32/sysinfo/registry-hives"},
  {set:"tia",sev:"Wrong",pg:"83",obj:"1.8",said:"Installing apps from a vendor's website \"is NOT enabled by default; must be enabled in System Preferences\".",fix:"Gatekeeper allows signed, notarized apps from identified developers by default. You approve the first launch. Only unsigned apps need an override in Privacy & Security.",link:"https://support.apple.com/guide/security/gatekeeper-and-runtime-protection-sec5599b66df/web"},
  {set:"tia",sev:"Wrong",pg:"154",obj:"2.5",said:"SQL injection compromises a database \"usually through cross-site scripting\".",fix:"They're separate attacks. SQL injection sends SQL through unvalidated input to the database. XSS injects script that runs in other users' browsers.",link:""},
  {set:"tia",sev:"Wrong",pg:"112",obj:"2.1",said:"Equipment locks: \"construction equipment, trailer, and cargo theft prevention\".",fix:"In A+ terms: cable locks for laptops and desktops, and locked server racks and cabinets.",link:""},
  {set:"tia",sev:"Imprecise",pg:"2",obj:"Exam",said:"Passing score \"700 (78%)\".",fix:"700 is on a 100–900 scaled score. CompTIA doesn't publish a fixed percentage, and it varies by exam form.",link:"https://www.comptia.org/en-us/certifications/a/core-2-v15/"},
  {set:"tia",sev:"Imprecise",pg:"7",obj:"1.1",said:"FAT32 \"partitions are limited to 32GB\".",fix:"32 GB is the limit of Windows' built-in format tool. FAT32 itself supports volumes up to about 2 TB (16 TB with large sectors). The 4 GB per-file limit is the real FAT32 limit.",link:""},
  {set:"tia",sev:"Incomplete",pg:"158",obj:"2.6",said:"Malware removal steps: \"Disable System Restore in Windows\" … \"Enable System Restore…in Windows\", with remediation listing only update + scan/remove.",fix:"The 220-1202 objective says Windows Home for both System Restore steps, and remediation also includes Reimage/reinstall.",link:""},
  {set:"tia",sev:"Imprecise",pg:"162",obj:"2.7",said:"\"No one should have an admin account\".",fix:"Least privilege means nobody uses admin rights day to day. Admins keep a separate elevated account (or use just-in-time access) and log in with a standard account.",link:""},
  {set:"tia",sev:"Imprecise",pg:"83",obj:"1.8",said:"\"Must have an Apple ID to setup and download apps\".",fix:"An Apple ID is needed for the App Store and iCloud, not to set up a Mac or install apps downloaded from the web.",link:""},
  {set:"tia",sev:"Imprecise",pg:"81",obj:"1.7",said:"Metered connection \"limits the amount of data that can be sent and received\".",fix:"It tells Windows to cut background data (updates, sync). It doesn't enforce a cap unless you also set a data limit.",link:""},
  {set:"tia",sev:"Outdated",pg:"88",obj:"1.8",said:"Disk Utility First Aid \"can repair permissions\".",fix:"Permission repair was removed in OS X 10.11 El Capitan. First Aid now checks and repairs the file system.",link:""},
  {set:"tia",sev:"Outdated",pg:"94",obj:"1.9",said:"Package managers: apt-get and YUM.",fix:"220-1202 lists apt and dnf. dnf replaced yum on Fedora/RHEL, and apt is the modern front end to apt-get.",link:""},
  {set:"tia",sev:"Outdated",pg:"160",obj:"2.7",said:"Password length \"8–10 min\" and \"expire every 60–90 days\".",fix:"NIST SP 800-63B Rev. 4 (2025): at least 15 characters when the password is the only factor, and no forced periodic expiration. Know both the classic exam answer and current practice.",link:"https://www.enzoic.com/blog/nist-sp-800-63b-rev4/"},
  {set:"tia",sev:"Outdated",pg:"85, 235",obj:"1.8 / 4.5",said:"\"System Preferences\" and \"Material safety data sheet (MSDS)\".",fix:"macOS 13+ calls it System Settings. US OSHA uses Safety Data Sheet (SDS).",link:""},
  {set:"tia",sev:"Typo",pg:"10, 98",obj:"1.1 / 1.10",said:"\"Windows 7 EOL was 1/14/202\"; \"32 bit processors can handle large amounts of RAM vs. 32-bit\".",fix:"Windows 7 EOL was 1/14/2020. The second line means 64-bit processors handle more RAM than 32-bit.",link:""},
  {set:"tia",sev:"Off-objective",pg:"8, 87, 254",obj:"1.1 / 1.8 / 4.9",said:"HFS+, ext3, CDFS/UDF, Remote Disc, Microsoft Remote Assistance (MSRA).",fix:"These were on older A+ objectives but aren't in the 220-1202 lists. Low priority.",link:""},
  {set:"tia",sev:"Gap",pg:"—",obj:"1.1",said:"File systems section skips ReFS and XFS.",fix:"Both are in 220-1202 objective 1.1. They're covered in the Flashcards tab.",link:""},
  {set:"tia",sev:"Gap",pg:"93",obj:"1.9",said:"Linux commands slide omits su, sudo, dnf, fsck, mount, curl, traceroute and du.",fix:"All of these are listed in 1.9 and covered in Flashcards and Command practice.",link:""},
  {set:"tia",sev:"Gap",pg:"97→105",obj:"1.11",said:"No section for objective 1.11 (cloud productivity tools).",fix:"Know email systems, storage and sync, collaboration tools, identity synchronization and licensing assignment.",link:""},
  {set:"tia",sev:"Gap",pg:"105–155",obj:"2.1 / 2.4 / 2.5",said:"Missing newer 1202 security terms.",fix:"2.1: zero trust, SSO, SAML, just-in-time access, PAM, IAM, DLP, directory services. 2.4: stalkerware, fileless malware, PUP, EDR/MDR/XDR, email security gateway. 2.5: QR code phishing, business email compromise, supply chain attacks. All are in Flashcards.",link:""},
  {set:"tia",sev:"Gap",pg:"253–255",obj:"4.9",said:"Remote access section omits SPICE and WinRM.",fix:"Both are new in 220-1202 4.9 (the deck lists MSRA, which isn't).",link:""},
  {set:"tia",sev:"Gap",pg:"257–301",obj:"4.10",said:"The AI section is mostly general AI theory (ML types, NLP, prompting).",fix:"The 4.10 objective tests application integration, appropriate use, plagiarism, bias, hallucinations, accuracy, and public vs. private AI (data security, data source, data privacy). The deck covers bias, hallucinations and privacy, but not the rest.",link:""}
);

/* ----- Objective 1.6: Control Panel and Settings ----- */
CARDS.push(
  {d:1,o:"1.6",t:"Internet Options",alt:["inetcpl.cpl"],def:"Control Panel applet for proxy and VPN connections (Connections tab), security zones, privacy/pop-up settings, certificates and a full browser-settings reset (Advanced)."},
  {d:1,o:"1.6",t:"Devices and Printers",def:"Control Panel view to add or remove printers, scanners and other devices and open their properties. Simpler than Device Manager."},
  {d:1,o:"1.6",t:"Programs and Features",alt:["appwiz.cpl"],def:"Control Panel applet to uninstall, change or repair programs and to turn Windows features on or off."},
  {d:1,o:"1.6",t:"Network and Sharing Center",alt:["ncpa.cpl"],def:"Control Panel hub for network adapters (Change adapter settings), sharing and discovery options, and setting up new connections such as VPN."},
  {d:1,o:"1.6",t:"System (Control Panel)",alt:["System","sysdm.cpl","System Properties"],def:"Rename the computer, join a domain or workgroup, set virtual memory, Remote settings and System Protection (restore points)."},
  {d:1,o:"1.6",t:"Mail (Control Panel)",alt:["Mail"],def:"Applet that appears only when Outlook is installed: manage Outlook profiles, email accounts and data files."},
  {d:1,o:"1.6",t:"Sound",alt:["mmsys.cpl"],def:"Control Panel applet to set default playback and recording devices and their levels."},
  {d:1,o:"1.6",t:"User Accounts",def:"Control Panel applet for local accounts: change account type, password and picture. Domain accounts are managed in AD."},
  {d:1,o:"1.6",t:"Indexing Options",def:"Choose which locations Windows Search indexes. Add a folder to speed up searches there."},
  {d:1,o:"1.6",t:"File Explorer Options",alt:["Folder Options"],def:"Show hidden files, hide or show file extensions, and set general and search behavior for File Explorer."},
  {d:1,o:"1.6",t:"Hibernate",def:"Power state that saves open work to disk and powers off completely, using no battery. Resume is slower than sleep."},
  {d:1,o:"1.6",t:"Sleep",alt:["standby"],def:"Low-power state that keeps open work in RAM for a fast resume. It draws a little power and can switch to hibernate when the battery runs low."},
  {d:1,o:"1.6",t:"Fast startup",def:"Power Options setting that hibernates the kernel at shutdown so boots are quicker. Turn it off when troubleshooting, because Shut down isn't a full restart."},
  {d:1,o:"1.6",t:"USB selective suspend",def:"Power plan setting that powers down idle USB devices. Disable it if a USB device (like a fingerprint reader) drops out."},
  {d:1,o:"1.6",t:"Ease of Access Center",alt:["Ease of Access","Accessibility"],def:"Accessibility options: on-screen keyboard, Narrator, Magnifier, high contrast, and keyboard and mouse aids."},
  {d:1,o:"1.6",t:"Administrative Tools",alt:["Windows Tools"],def:"Control Panel folder of admin consoles (Computer Management, Services, Event Viewer…), called Windows Tools in Windows 11."},
  {d:1,o:"1.6",t:"Active hours",def:"Windows Update setting that blocks automatic restarts during the hours you normally use the PC."},
  {d:1,o:"1.6",t:"Time & Language",def:"Settings page for time zone, automatic time sync, region and language packs. A clock more than 5 minutes off breaks Kerberos."},
  {d:1,o:"1.6",t:"Optional features",def:"Settings > System (or Apps) > Optional features: add components like OpenSSH Server, RSAT tools or the Media Feature Pack."},
  {d:1,o:"1.4",t:"HKEY_LOCAL_MACHINE",alt:["HKLM"],def:"Registry root holding machine-wide hardware and software settings that apply to every user."},
  {d:1,o:"1.4",t:"HKEY_CURRENT_USER",alt:["HKCU"],def:"Registry root holding the signed-in user's own settings (desktop, app preferences), loaded from NTUSER.DAT."},
  {d:1,o:"1.2",t:"Sysprep",alt:["System Preparation Tool","sysprep.exe"],def:"Generalizes a Windows install (removes the SID and machine-specific data) before you capture it as an image for deployment."}
);
EXAM.push(
  {d:1,o:"1.6",q:"A user opened 'invoice.pdf' from an email and it turned out to be an executable. You want users to see the real file type. Where do you change this?",c:["Indexing Options","File Explorer Options > View: uncheck 'Hide extensions for known file types'","Programs and Features","Internet Options > Security"],a:1,why:"Hidden extensions let 'invoice.pdf.exe' look like a PDF.",key:"File Explorer Options, View tab: uncheck 'Hide extensions for known file types' so the full extension shows.",kw:[["explorer","folder option","extension"]]},
  {d:1,o:"1.6",q:"A sales rep closes the laptop lid Friday and wants open documents exactly as they were on Monday, with no battery drain over the weekend. Which power state should the lid use?",c:["Sleep","Hibernate","Shut down with fast startup","Do nothing"],a:1,why:"Hibernate writes RAM to disk and powers off. Sleep keeps drawing power.",key:"Hibernate: it saves the session to disk and uses no power. Set it in Power Options > Choose what closing the lid does.",kw:[["hibernat"]]},
  {d:1,o:"1.6",q:"A driver issue keeps coming back after the user clicks Shut down and powers on again, but goes away after Restart. Which setting explains this?",c:["USB selective suspend","Fast startup","Active hours","Metered connection"],a:1,why:"Fast startup hibernates the kernel at shutdown, so drivers aren't fully reloaded. Restart does a full reload.",key:"Fast startup. Shut down hibernates the kernel, so it isn't a clean boot. Turn it off in Power Options or use Restart.",kw:[["fast start"]]},
  {d:1,o:"1.6",q:"A USB fingerprint reader stops responding after the laptop sits idle for a few minutes. Which setting should you check?",c:["USB selective suspend in the power plan","Indexing Options","BitLocker","Hibernate file size"],a:0,why:"Selective suspend powers down idle USB devices. Disable it for that device or plan.",key:"Turn off USB selective suspend in the power plan's advanced settings (Power Options).",kw:[["selective suspend"]]},
  {d:1,o:"1.6",q:"A legacy line-of-business app ignores the system proxy and needs it set the old way. Where do you configure it?",c:["Internet Options > Connections > LAN settings","Network and Sharing Center > Sharing","Sound","Device Manager"],a:0,why:"Internet Options' Connections tab holds the WinINET proxy that many legacy apps use.",key:"Internet Options > Connections tab > LAN settings: enter the proxy address and port.",kw:[["internet options"]]},
  {d:1,o:"1.6",q:"A user's searches inside D:\\Projects take forever, while searches in Documents are instant. What's the fix?",c:["Defragment D:","Add D:\\Projects in Indexing Options","Run chkdsk /r","Enable BitLocker"],a:1,why:"Only indexed locations search quickly.",key:"Add D:\\Projects as an indexed location in Indexing Options.",kw:[["index"]]},
  {d:1,o:"1.6",q:"Windows Update keeps restarting a nurse's workstation in the middle of a shift. What should you configure?",c:["Metered connection","Active hours in Windows Update","Hibernate","Fast startup"],a:1,why:"Active hours stop automatic restarts during the hours you set.",key:"Set active hours in Settings > Windows Update so restarts happen outside shift hours (and schedule them).",kw:[["active hours"]]},
  {d:1,o:"1.6",q:"You need to rename a new PC and join it to corp.local. Which Control Panel item gets you there?",c:["User Accounts","System (System Properties > Computer Name > Change)","Devices and Printers","Network and Sharing Center"],a:1,why:"System Properties (sysdm.cpl) handles the computer name and domain or workgroup membership. In Settings it's System > About.",key:"System (System Properties / sysdm.cpl) > Computer Name > Change. Rename and choose Domain: corp.local (needs Pro or better and rights to join).",kw:[["system","sysdm","about"]]},
  {d:1,o:"1.6",q:"Outlook won't open on one PC, and you need to create a new Outlook profile. Which Control Panel item do you use?",c:["Mail","Internet Options","Programs and Features","User Accounts"],a:0,why:"The Mail applet (present when Outlook is installed) manages profiles and data files.",key:"The Mail applet in Control Panel: Show Profiles > Add a new profile.",kw:[["mail"]]},
  {d:1,o:"1.4",q:"A policy setting must apply to every user who signs in to a shared PC. Which registry root holds machine-wide settings?",c:["HKEY_CURRENT_USER","HKEY_LOCAL_MACHINE","HKEY_CURRENT_CONFIG","HKEY_CLASSES_ROOT only"],a:1,why:"HKLM applies to the whole machine. HKCU is per user.",key:"HKEY_LOCAL_MACHINE (HKLM).",kw:[["hklm","local_machine","local machine"]]}
);

/* ===== Round 3: 51 more scenario questions, weighted to thin objectives. a:[i,j] = multiple response ("Choose two") ===== */
EXAM.push(
  // ---- Domain 1 ----
  {d:1,o:"1.1",q:"A Linux file server for a video team needs a high-performance 64-bit journaling file system built for very large volumes. It's the default on Red Hat Enterprise Linux. Which file system fits?",c:["exFAT","XFS","FAT32","APFS"],a:1,why:"XFS is designed for large volumes and parallel I/O, and it's RHEL's default. ext4 is the other common Linux choice.",key:"XFS.",kw:[["xfs"]]},
  {d:1,o:"1.3",q:"Which TWO features does Windows 11 Pro include that Windows 11 Home does not? (Choose two.)",c:["BitLocker drive encryption","Joining an Active Directory domain","Windows Hello sign-in","The Microsoft Store","Snap layouts"],a:[0,1],why:"Pro adds BitLocker, domain join, gpedit.msc, Hyper-V and the Remote Desktop host. Hello, the Store and Snap layouts are in both editions.",key:"BitLocker and Active Directory domain join (Pro also adds gpedit, Hyper-V and the Remote Desktop host).",kw:[["bitlocker"],["domain"]]},
  {d:1,o:"1.3",q:"An engineering workstation has four physical CPUs and 1.5 TB of RAM. Which Windows edition supports that hardware?",c:["Windows 11 Home","Windows 11 Pro","Windows 11 Pro for Workstations","Windows 11 Education"],a:2,why:"Pro for Workstations supports up to 4 CPUs and 6 TB of RAM. Pro tops out at 2 CPUs and 2 TB; Home at 1 CPU and 128 GB.",key:"Windows 11 Pro for Workstations (up to 4 CPUs, 6 TB RAM).",kw:[["workstation"]]},
  {d:1,o:"1.8",q:"A company requires every Mac laptop's drive to be encrypted, so data on a stolen laptop can't be read. What should you enable?",c:["Keychain","FileVault","Time Machine","Gatekeeper"],a:1,why:"FileVault is macOS full-disk encryption.",key:"FileVault full-disk encryption.",kw:[["filevault"]]},
  {d:1,o:"1.8",q:"A new Mac user asks for the quickest way to find a document by name without opening Finder. What do you show them?",c:["Mission Control","Spotlight (Command+Space)","Disk Utility","The Dock"],a:1,why:"Spotlight searches files, apps and email system-wide.",key:"Spotlight: press Command+Space and type the name.",kw:[["spotlight"]]},
  {d:1,o:"1.10",q:"Before rolling a 3D CAD application out to 30 PCs, which TWO requirements should you verify? (Choose two.)",c:["The GPU type and VRAM meet the vendor's spec","The OS is 64-bit to match the application","The monitor brand","The keyboard layout","The desktop wallpaper"],a:[0,1],why:"Graphics (dedicated vs. integrated, VRAM) and the OS platform (32- vs. 64-bit) are the 1.10 checks, along with RAM, CPU, storage and hardware tokens.",key:"Check graphics requirements (dedicated GPU/VRAM) and that the OS is 64-bit. RAM, CPU, storage and any license token matter too.",kw:[["gpu","graphics","vram"],["64"]]},
  {d:1,o:"1.11",q:"When employees leave, the company wants to reassign their Microsoft 365 licenses to new hires without tracking product keys. Which concept does this describe?",c:["Volume license keys in a spreadsheet","Cloud licensing assignment from the admin portal","Reimaging each PC","OEM license stickers"],a:1,why:"Cloud licensing ties licenses to users, so you manage and reassign them centrally.",key:"Cloud licensing assignment: manage and reassign licenses to users centrally in the admin portal.",kw:[["licens"]]},
  {d:1,o:"1.11",q:"A user saves a file on their laptop and it appears on their phone a minute later. Which cloud productivity feature is this?",c:["Folder redirection","Cloud storage synchronization","Identity synchronization","Email archiving"],a:1,why:"Sync clients upload local changes and download them to every registered device.",key:"Cloud storage synchronization (e.g. OneDrive or Google Drive sync).",kw:[["sync"]]},
  {d:1,o:"1.2",q:"Which TWO things do you need to install Windows on 50 new PCs over the network with no USB or optical media? (Choose two.)",c:["Network-boot (PXE) support in each PC's firmware/NIC","A deployment server, such as WDS, holding the image","An optical drive in each PC","A recovery partition on each PC","An in-place upgrade path"],a:[0,1],why:"PXE boots the PC from the network, and a deployment server delivers the image.",key:"PXE network boot on each PC plus a deployment server (e.g. WDS or another imaging server).",kw:[["pxe","network boot"],["server","wds","deploy"]]},
  {d:1,o:"1.7",q:"An admin shares a folder as Payroll$. What does the $ do?",c:["Encrypts the share","Hides the share from network browsing, but it isn't a security control","Makes the share read-only","Limits it to administrators"],a:1,why:"A $ suffix hides the share from browsing. Anyone who knows the name and has permissions can still open it.",key:"It hides the share from browsing. It doesn't secure it; permissions still control access.",kw:[["hid"]]},
  // ---- Domain 2 ----
  {d:2,o:"2.1",q:"Which TWO are examples of the authentication factor 'something you have'? (Choose two.)",c:["Smart card","Authenticator app or hardware token","Password","Fingerprint","Shoe size"],a:[0,1],why:"Possession factors are physical or app tokens. A password is something you know; a fingerprint is something you are.",key:"A smart card and a hardware or app token (TOTP authenticator).",kw:[["smart card"],["token","authenticator","key fob"]]},
  {d:2,o:"2.1",q:"Leadership wants every access request verified, even from inside the corporate network, with no implicit trust. Which model is this?",c:["Least privilege","Zero trust","Defense through obscurity","Perimeter security"],a:1,why:"Zero trust verifies every user, device and request.",key:"Zero trust.",kw:[["zero trust"]]},
  {d:2,o:"2.1",q:"Users sign in to the company portal once and then open Salesforce and Microsoft 365 without signing in again. Which capability is this?",c:["Multifactor authentication","Single sign-on (using a standard like SAML)","Just-in-time access","Password vaulting"],a:1,why:"SSO lets one authentication grant access to multiple services. SAML is a common standard for passing that identity.",key:"Single sign-on, typically via SAML federation.",kw:[["sso","single sign","saml"]]},
  {d:2,o:"2.2",q:"A standard user tries to install approved software. A dialog dims the screen and asks for an administrator's credentials. Which Windows feature is this?",c:["BitLocker","User Account Control (UAC)","Windows Hello","SmartScreen"],a:1,why:"UAC prompts for elevation on the secure desktop.",key:"User Account Control (UAC).",kw:[["uac","user account control"]]},
  {d:2,o:"2.2",q:"On a Windows 11 Pro laptop, HR needs a single folder encrypted so other users of the PC can't read it, without encrypting the whole drive. What should you use?",c:["BitLocker","EFS (Encrypting File System)","BitLocker To Go","FileVault"],a:1,why:"EFS encrypts individual files and folders per user on NTFS. BitLocker encrypts whole volumes.",key:"EFS (Encrypting File System) on the folder.",kw:[["efs","encrypting file"]]},
  {d:2,o:"2.3",q:"A company wants every employee to join Wi-Fi with their own Active Directory credentials instead of a shared password. What should be configured?",c:["WPA2/WPA3-Personal with a long PSK","WPA2/WPA3-Enterprise (802.1X) backed by a RADIUS server","An open network with a captive portal","WEP"],a:1,why:"Enterprise mode authenticates each user individually through 802.1X and RADIUS.",key:"WPA2/WPA3-Enterprise using 802.1X with a RADIUS server tied to AD.",kw:[["enterprise","802.1x","radius"]]},
  {d:2,o:"2.4",q:"Antivirus flags a toolbar that came bundled with a free PDF converter and changed the browser's search engine. How is this usually classified?",c:["Rootkit","Potentially unwanted program (PUP)","Boot sector virus","Ransomware"],a:1,why:"PUPs are bundled, unwanted software such as toolbars and search hijackers.",key:"A potentially unwanted program (PUP), adware or a search hijacker.",kw:[["pup","potentially unwanted","adware"]]},
  {d:2,o:"2.4",q:"A small company with no security staff wants experts to watch its endpoint alerts around the clock and respond to threats. What should it buy?",c:["XDR licenses only","MDR (managed detection and response)","An email security gateway","A software firewall"],a:1,why:"MDR is detection and response provided as a managed service.",key:"MDR, managed detection and response from a security provider.",kw:[["mdr","managed detection"]]},
  {d:2,o:"2.5",q:"Stickers with new QR codes appear over the real ones on restaurant table menus, and scanning them opens a fake payment page. What attack is this?",c:["Smishing","QR code phishing","Whaling","Evil twin"],a:1,why:"Swapping QR codes to send people to malicious sites is QR code phishing.",key:"QR code phishing.",kw:[["qr"]]},
  {d:2,o:"2.5",q:"Attackers break into a software vendor's update server and push malware to every customer through a normal update. What attack is this?",c:["Insider threat","Supply chain attack","Dictionary attack","On-path attack"],a:1,why:"Compromising a trusted supplier to reach its customers is a supply chain attack (like SolarWinds).",key:"A supply chain (pipeline) attack.",kw:[["supply chain","pipeline"]]},
  {d:2,o:"2.6",q:"You've updated the anti-malware software and removed the infection in Safe Mode. Following CompTIA's procedure, what comes next?",c:["Educate the end user","Schedule scans and run updates","Disable System Restore","Quarantine the system"],a:1,why:"After remediation: schedule scans and run updates, enable System Restore and create a restore point, then educate the user.",key:"Schedule scans and run updates (then re-enable System Restore and educate the user).",kw:[["schedul","update"]]},
  {d:2,o:"2.7",q:"Which TWO settings best reduce the risk of password-guessing attacks on workstations? (Choose two.)",c:["Lock the account after a set number of failed attempts","Rename or disable the default Administrator account","Enable the Guest account","Turn off the screen-saver lock","Allow blank passwords"],a:[0,1],why:"Lockout thresholds stop online brute force, and changing default accounts removes a known target.",key:"Account lockout after failed attempts, and renaming or disabling default admin accounts (plus strong password policy).",kw:[["lock"],["default","rename","admin"]]},
  {d:2,o:"2.7",q:"Malware is spreading through USB drives that launch automatically when inserted. Which workstation setting addresses this?",c:["Disable AutoRun/AutoPlay","Turn on BitLocker To Go","Enable the Guest account","Increase password length"],a:0,why:"Disabling AutoPlay/AutoRun stops media from launching content on insertion.",key:"Disable AutoRun/AutoPlay (Settings > Bluetooth & devices > AutoPlay, or via Group Policy).",kw:[["autoplay","autorun"]]},
  {d:2,o:"2.8",q:"Employees want to use personal phones for work email, but the company must be able to wipe work data without touching personal photos. What's the best approach?",c:["Factory reset the phones monthly","Enroll in MDM with a separate work profile or container that can be selectively wiped","Ban all personal phones","Install a mobile firewall only"],a:1,why:"BYOD under MDM separates corporate data so it can be wiped without wiping personal data.",key:"Enroll BYOD devices in MDM with a work profile/container (a partition) and use selective (corporate) wipe.",kw:[["mdm","work profile","container","partition","selective"]]},
  {d:2,o:"2.9",q:"Old HDDs will be reused inside the company. Data must not be recoverable, but the drives must keep working. What should you do?",c:["Quick format","Degauss","Overwrite the whole drive with a wipe tool (e.g. DBAN) or a full format","Drill through the platters"],a:2,why:"Overwriting removes the data and leaves the drive usable. Degaussing and drilling destroy the drive, and a quick format leaves data recoverable.",key:"Wipe/overwrite the entire drive (DBAN, or a full format, which writes zeros) so it can be reused.",kw:[["wipe","overwrite","dban","full format","zero"]]},
  {d:2,o:"2.11",q:"Several people share one front-desk PC. A user wants their browsing history, cookies and form data discarded when they close the browser. What should they use?",c:["Pop-up blocker","Private/incognito browsing mode","Browser synchronization","A proxy server"],a:1,why:"Private browsing doesn't keep history, cookies or cache after the window closes.",key:"Private (InPrivate/incognito) browsing mode.",kw:[["private","incognito","inprivate"]]},
  {d:2,o:"2.11",q:"Policy requires browsers to encrypt DNS lookups so others on the network can't see which sites users visit. Which setting do you turn on?",c:["Pop-up blocker","Secure DNS / DNS over HTTPS (DoH)","Ad blocker","Clear cache on exit"],a:1,why:"DoH sends DNS queries inside HTTPS.",key:"Secure DNS: DNS over HTTPS (DoH).",kw:[["doh","dns over https","secure dns"]]},

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LET = "ABCDEFGH";
const store = {
  get(k, d) { try { const v = localStorage.getItem("c2:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("c2:" + k, JSON.stringify(v)); } catch {} }
};

/* ---------- stats ---------- */
let stats = store.get("stats", { items: {}, exams: [] });
function record(key, d, o, ok, kind) {
  const it = stats.items[key] || (stats.items[key] = { d, o, k: kind, r: 0, w: 0 });
  ok ? it.r++ : it.w++;
  store.set("stats", stats);
  if (!key.startsWith("p:")) missUpdate(key, d, o, ok);
  hypeEvent(key, d, ok);
  achSoon();
}

/* ---------- domains ---------- */
let active = new Set(store.get("domains", [1, 2, 3, 4]));
const inDom = x => active.has(x.d);
function tagHTML(x) { return `<span class="tag"><span class="dd d${x.d}">${x.d}.0 ${esc(DOMAINS[x.d].short)}</span>Obj ${esc(x.o)}</span>`; }
function buildDomainBar() {
  const bar = $("#domainbar");
  bar.querySelectorAll(".chip").forEach(c => c.remove());
  for (const d of [1, 2, 3, 4]) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.id = "dom-" + d;
    b.setAttribute("aria-pressed", active.has(d));
    b.innerHTML = `<i style="background:var(--d${d})"></i>${d}.0 <span class="fn">${esc(DOMAINS[d].name)}</span><span class="sn">${esc(DOMAINS[d].short)}</span>`;
    b.onclick = () => {
      if (active.has(d) && active.size === 1) return;
      active.has(d) ? active.delete(d) : active.add(d);
      store.set("domains", [...active]);
      buildDomainBar(); resetViews(); render();
    };
    bar.appendChild(b);
  }
}

  try { if (window.claude && typeof window.claude.use === "function") sampleFn = await window.claude.use("sample"); } catch { sampleFn = null; }

}

}

/* ================= FLASHCARDS ================= */
const fc = { mode: store.get("fcmode", "mc"), deck: [], i: 0, r: 0, n: 0, answered: false, match: null };
function fcDeck() { const pr = c => { const r = srs["c:" + c.t]; return !r ? 1 : r.due < endOfToday() ? 0 : 2; }; fc.deck = shuffle(CARDS.filter(inDom)).sort((x, y) => pr(x) - pr(y)); fc.i = 0; fc.r = 0; fc.n = 0; fc.answered = false; fc.match = null; }
const normT = s => String(s).toLowerCase().replace(/[‘’“”]/g, "'").replace(/[\s._\-–—()'"/\\]+/g, "").replace(/^(the|an?)(?=\w)/, "");
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function termMatches(card, input) {
  const g = normT(input); if (!g) return false;
  return [card.t, ...(card.alt || [])].some(x => { const t = normT(x); return t === g || (t.length >= 7 && lev(t, g) <= 1); });
}
function renderCards() {
  const v = $("#view-cards");

/* ================= SPACED REPETITION (Leitner) ================= */
const DAY = 864e5, IV = [0, 1, 3, 7, 14, 30]; // box -> days until next review

const endOfToday = () => sod(nowMs()) + DAY;

    const x = r || (srs[key] = { d, o, box: 1, due: 0, miss: false, n: 0, last: 0 });

function readiness() {
  const out = {};
  [1, 2, 3, 4].forEach(d => {
    const cards = CARDS.filter(c => c.d === d), ret = cards.filter(c => { const r = srs["c:" + c.t]; return r && r.box >= 3; }).length;
    const exs = Object.entries(stats.items).filter(([k, it]) => k.startsWith("e:") && it.d === d).reduce((a, [, it]) => (a.r += it.r, a.n += it.r + it.w, a), { r: 0, n: 0 });
    const best = store.get("pbqbest", {}), sb = store.get("scbest", {});
    const labs = [...PBQS.filter(q => q.d === d).map(q => (best[q.id] || 0) / 100), ...SCENS.filter(s => s.d === d).map(s => sb[s.id] ? 1 : 0)];
    const parts = [[ret / cards.length, .35], [exs.n >= 5 ? exs.r / exs.n : null, .40], [labs.length ? labs.reduce((a, b) => a + b, 0) / labs.length : null, .25]];
    const have = parts.filter(p => p[0] !== null), tw = have.reduce((a, p) => a + p[1], 0);
    out[d] = { cards: ret / cards.length, ret, total: cards.length, exam: exs.n >= 5 ? exs.r / exs.n : null, examN: exs.n, labs: labs.length ? parts[2][0] : null, score: tw ? have.reduce((a, p) => a + p[0] * p[1], 0) / tw : 0 };
  });
  out.all = [1, 2, 3, 4].reduce((a, d) => a + out[d].score * DOMAINS[d].w, 0) / 100;
  return out;
}

const levelOf = xp => Math.min(50, Math.floor(Math.sqrt(xp / 60)) + 1);
const levelXp = l => 60 * (l - 1) * (l - 1);

function hypeEvent(key, d, ok) {
  if (!hype.on || hypeMute) return;
  const p = key.split(":")[0];
  hypeUndo = JSON.parse(JSON.stringify(hype));
  // daily activity
  const today = sod(nowMs());
  if (hype.day !== today) { hype.day = today; hype.dayN = 0; }
  hype.dayN++;
  if (hype.dayN >= 10 && !hype.days.includes(today)) { hype.days.push(today); hype.days = hype.days.slice(-400); }
  const w = p === "p" || p === "t" ? 5 : p === "k" ? 2 : 1;
  if (ok) {
    const before = hype.streak, beforeT = tierOf(before);
    hype.streak += w; hype.xp += 10 * w;
    if (d) { hype.dom[d] = (hype.dom[d] || 0) + w; hype.bestDom[d] = Math.max(hype.bestDom[d] || 0, hype.dom[d]); }
    hype.best = Math.max(hype.best, hype.streak);
    const earned = Math.floor(hype.streak / SHIELD_EVERY) - Math.floor(before / SHIELD_EVERY);
    let gotShield = false;
    if (earned > 0 && hype.shields < SHIELD_MAX) { hype.shields = Math.min(SHIELD_MAX, hype.shields + earned); gotShield = true; }
    const t = tierOf(hype.streak);
    if (t > beforeT) {
      const mult = 1 + Math.floor(Math.random() * 3); // jackpot reel: x1, x2 or x3
      const bonus = 50 * (t + 1) * mult;
      hype.xp += bonus; if (mult === 3) hype.jackpots++;
      hype.bestTier = Math.max(hype.bestTier, t);
      saveHype(); paintHud(true); showTier(TIERS[t], mult, bonus, gotShield);
      return;
    }
    saveHype(); paintHud(true);
    if (gotShield) toast(`🛡️ Shield earned. Your next miss won't break the streak.`, "good");
  } else {
    if (d) hype.dom[d] = 0;
    if (hype.shields > 0 && hype.streak > 0) { hype.shields--; saveHype(); paintHud(); toast(`🛡️ Shield blocked it. Streak ${hype.streak} survives.`, "good"); sfx("shield"); return; }
    const lost = hype.streak; hype.streak = 0; saveHype(); paintHud();
    if (lost >= 5) { toast(`💥 Streak broken at ${lost}${tierOf(lost) >= 0 ? " (" + TIERS[tierOf(lost)].name + ")" : ""}`, "bad"); sfx("break"); }
  }
}

    if (hype.on) { const t = sod(nowMs()); if (!hype.days.includes(t)) hype.days.push(t); if (pct === 1 && first) { hype.xp += 200; toast("🔥 Perfect daily challenge! +200 XP", "good"); } saveHype(); paintHud(true); }
  }
  if (ex.mode === "sim") store.set("simdone", (store.get("simdone", 0) || 0) + 1);
  if (ex.tag === "gen") store.set("gendone", (store.get("gendone", 0) || 0) + 1);
  achSoon();
}

/* ---------------- Weekly boss (Hype mode) ---------------- */
const BOSSES = [["THE GATEKEEPER", "🚪"], ["KERNEL PANIC", "💥"], ["THE ROOTKIT", "🕳️"], ["BLUE SCREEN", "🟦"], ["PHISH KING", "🎣"], ["ZERO-DAY", "☠️"], ["THE BOTNET", "🕸️"]];
const boss = { on: false, qs: [], i: 0, state: "fight", miss: null };
const bossNow = () => { const w = weekKey(); return { w, name: BOSSES[w % BOSSES.length][0], icon: BOSSES[w % BOSSES.length][1], beaten: !!store.get("bosswins", {})[w] }; };
function bossHTML() {
  if (!hype.on) return "";
  const b = bossNow(), wins = Object.keys(store.get("bosswins", {})).length;
  return `<div class="bossbox"><div><span class="lbl">Weekly boss</span><div class="bossname">${b.icon} ${esc(b.name)}</div><span class="note">20 questions in a row. One miss and the boss wins. ${b.beaten ? "<b>Defeated this week ✓</b>" : "First win this week: +1,000 XP."}${wins ? ` · ${wins} boss${wins === 1 ? "" : "es"} slain` : ""}</span></div><button class="btn sm" id="bossgo" type="button">${b.beaten ? "Rematch" : "Fight"} →</button></div>`;
}
function startBoss() {
  const b = bossNow(), r = rng(b.w * 7919 + (store.get("bosstries", 0) || 0));
  store.set("bosstries", (store.get("bosstries", 0) || 0) + 1);
  const single = EXAM.map((q, k) => ({ ...q, k })).filter(q => !isMulti(q));
  Object.assign(boss, { on: true, qs: seededPick(single, 20, r), i: 0, state: "fight", miss: null });
  rv.on = false; setTab("today"); window.scrollTo({ top: 0 });
}
function renderBoss(v) {
  const b = bossNow(), n = boss.qs.length, hp = n - boss.i;
  const head = `<div class="bosshead"><div class="bossname big3">${b.icon} ${esc(b.name)}</div><div class="hp" aria-label="Boss health ${hp} of ${n}">${Array.from({ length: n }, (_, k) => `<i class="${k < hp ? "on" : ""}"></i>`).join("")}</div><span class="note">${hp} HP left</span></div>`;
  if (boss.state === "lost") {
    const q = boss.miss;
    v.innerHTML = `<div class="panel bosspanel lost">${head}<h2>💀 ${esc(b.name)} wins</h2><p>You made it to question ${boss.i + 1} of ${n}.</p><div class="fb bad"><b class="v">${esc(q.q)}</b>Correct: <b>${esc(keyText(q))}</b><br><span class="note">${esc(q.why)}</span></div>${explainBtn("e:" + q.k)}<div class="row"><button class="btn" id="bossre" type="button">Try again →</button><button class="btn ghost" id="bossx" type="button">Back to Today</button></div></div>`;
    $("#bossre").onclick = startBoss; $("#bossx").onclick = () => { boss.on = false; renderToday(); }; wireExplain(v); return;
  }
  if (boss.state === "won") {
    v.innerHTML = `<div class="panel bosspanel won">${head}<h2>🗡️ ${esc(b.name)} defeated!</h2><p>20 for 20. ${boss.reward ? "+1,000 XP and this week's boss badge." : "Rematch won. The weekly reward was already claimed."}</p><div class="row"><button class="btn" id="bossx" type="button">Back to Today</button></div></div>`;
    $("#bossx").onclick = () => { boss.on = false; renderToday(); }; return;
  }
  const q = boss.qs[boss.i];
  v.innerHTML = `<div class="panel bosspanel">${head}${tagHTML(q)}<div class="prompt">${esc(q.q)}</div><div class="opts">${q.c.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="bub">${LET[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="bossx" type="button">Run away</button></div></div>`;
  v.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    const ok = +btn.dataset.i === q.a; record("e:" + q.k, q.d, q.o, ok, "exam");
    if (!ok) { boss.state = "lost"; boss.miss = q; renderBoss(v); return; }
    boss.i++;
    if (boss.i >= n) {
      boss.state = "won"; const wins = store.get("bosswins", {}); boss.reward = !wins[b.w];
      if (boss.reward) { wins[b.w] = nowMs(); store.set("bosswins", wins); hype.xp += 1000; saveHype(); paintHud(true); }
      showTier({ name: "BOSS SLAIN", icon: "🗡️", cls: "t7", at: 20, full: true, shake: true }, 1, boss.reward ? 1000 : 0, false); achSoon();
    }
    renderBoss(v);
  });
  $("#bossx").onclick = () => { boss.on = false; renderToday(); };
}

/* ---------------- Achievements ---------------- */
const retainedN = () => Object.entries(srs).filter(([k, r]) => k.startsWith("c:") && r.box >= 3).length;
const ACH = [
  ["first", "🩸", "First blood", "Get your first answer right", () => Object.values(stats.items).some(i => i.r > 0)],
  ["lab1", "🧪", "Lab rat", "Score 100% on any PBQ lab", () => Object.values(store.get("pbqbest", {})).some(v => v === 100)],
  ["laball", "🛠️", "PBQ master", "Every PBQ lab at 100%", () => PBQS.every(q => store.get("pbqbest", {})[q.id] === 100)],
  ["tkt1", "🎫", "Ticket closer", "Solve a Troubleshoot ticket", () => Object.values(store.get("scbest", {})).some(Boolean)],
  ["tktall", "🦸", "Help desk hero", "Solve every Troubleshoot ticket", () => SCENS.every(s => store.get("scbest", {})[s.id])],
  ["mock30", "📝", "Mock survivor", "Finish a mock exam of 30+ questions", () => stats.exams.some(e => e.n >= 30)],
  ["pass", "🎓", "Passing grade", "Score 75%+ on a mock of 60+ questions", () => stats.exams.some(e => e.n >= 60 && e.pct >= 0.75)],
  ["sim", "⏱️", "Full send", "Complete a full exam simulation", () => (store.get("simdone", 0) || 0) > 0],
  ["daily", "📅", "Daily perfect", "Get 10/10 on a daily challenge", () => Object.values(store.get("daily", {})).some(v => v === 1)],
  ["spaced50", "🧠", "Spaced out", "Retain 50 flashcards (recalled after a gap)", () => retainedN() >= 50],
  ["spaced200", "🏛️", "Memory palace", "Retain 200 flashcards", () => retainedN() >= 200],
  ["clean", "🧹", "Clean slate", "Clear 10 items off the Missed list for good", () => (store.get("cleared", 0) || 0) >= 10],
  ["acro", "🔤", "Acronym ace", "Score 30+ in an acronym blitz", () => (store.get("acrobest", 0) || 0) >= 30],
  ["gen", "✨", "Fresh blood", "Finish a set of AI-generated questions", () => (store.get("gendone", 0) || 0) > 0],
  ["savage", "🔥", "SAVAGE", "Hit a 5 streak in Hype mode", () => hype.bestTier >= 0],
  ["demon", "😈", "DEMON", "Hit a 20 streak in Hype mode", () => hype.bestTier >= 2],
  ["root", "💻", "ROOT ACCESS", "Hit a 100 streak in Hype mode", () => hype.bestTier >= 6],
  ["week", "🗓️", "Week warrior", "7-day daily streak in Hype mode", () => hype.on && dailyStreak() >= 7],
  ["boss", "🗡️", "Boss slayer", "Defeat a weekly boss", () => Object.keys(store.get("bosswins", {})).length > 0]
];
let achT = null;
function achSoon() { clearTimeout(achT); achT = setTimeout(checkAch, 60); }
function checkAch() {
  const got = store.get("ach", {}), fresh = [];
  ACH.forEach(([id, icon, name, , test]) => { try { if (!got[id] && test()) { got[id] = nowMs(); fresh.push(icon + " " + name); } } catch { } });
  if (!fresh.length) return;
  store.set("ach", got);
  toast(fresh.length === 1 ? `🏅 Achievement unlocked: ${fresh[0]}` : `🏅 ${fresh.length} achievements unlocked: ${fresh.join(", ")}`, "good");
}
function achHTML() {
  const got = store.get("ach", {}), n = ACH.filter(a => got[a[0]]).length;
  return `<div class="panel"><div class="bar"><h3 style="margin-right:auto">🏅 Achievements</h3><span class="note">${n}/${ACH.length}</span></div>
    <div class="achgrid">${ACH.map(([id, icon, name, desc]) => `<div class="ach${got[id] ? " got" : ""}" title="${esc(desc)}"><span class="ai">${got[id] ? icon : "🔒"}</span><b>${esc(name)}</b><span class="note">${esc(desc)}</span></div>`).join("")}</div></div>`;
}

/* ---------------- AI: fresh questions + explain ---------------- */
const gen = { busy: false, ctl: null, msg: "" };
function weakestObj() {
  const byObj = {}; Object.values(stats.items).forEach(x => { if (!OBJ_TITLES[x.o]) return; const o = byObj[x.o] || (byObj[x.o] = { o: x.o, r: 0, n: 0 }); o.r += x.r; o.n += x.r + x.w; });
  const w = Object.values(byObj).filter(o => o.n >= 3).sort((a, b) => a.r / a.n - b.r / b.n)[0];
  return w ? w.o : "2.4";
}
function genPanelHTML() {
  const saved = gstore(), sel = gen.obj || weakestObj();
  return `<div class="panel"><div class="bar"><h3 style="margin-right:auto">✨ Fresh questions from Claude</h3><span data-ai></span></div>
    <p class="note" style="margin:6px 0 10px">Claude writes 10 new scenario questions on one objective, so you're tested on understanding, not on questions you've memorized. Defaults to your weakest objective. ${sampleFn ? "Takes about 30–60 seconds." : "Available on your Claude page. The Netlify copy can't reach Claude."}</p>
    <div class="bar"><select class="txt" id="genobj" style="max-width:420px;min-width:0;flex:1 1 200px;width:auto" ${!sampleFn ? "disabled" : ""}>${Object.entries(OBJ_TITLES).map(([o, t]) => `<option value="${o}"${o === sel ? " selected" : ""}>${o} · ${esc(t)}${o === weakestObj() ? " (weakest)" : ""}</option>`).join("")}</select>
      <button class="btn" id="gengo" type="button" ${!sampleFn || gen.busy ? "disabled" : ""}>${gen.busy ? "Writing…" : "Generate 10"}</button>${gen.busy ? `<button class="btn ghost" id="genstop" type="button">Stop</button>` : ""}</div>
    <div id="genmsg" class="note" style="margin-top:8px">${esc(gen.msg)}</div>
    ${saved.length ? `<div class="row"><button class="btn ghost" id="genprac" type="button">Practice saved AI questions (${saved.length})</button><button class="btn ghost sm" id="genclr" type="button">Delete saved</button></div>` : ""}</div>`;
}
function wireGen(v) {
  v.querySelectorAll("[data-ai]").forEach(paintAi);
  const s = $("#genobj"); if (s) s.onchange = () => { gen.obj = s.value; };
  if ($("#gengo")) $("#gengo").onclick = () => generateQs($("#genobj").value);
  if ($("#genstop")) $("#genstop").onclick = () => gen.ctl && gen.ctl.abort();
  if ($("#genprac")) $("#genprac").onclick = () => { const qs = shuffle(gstore()).slice(0, 20).map(q => ({ ...q, gk: q.id })); Object.assign(ex, { qs, ans: qs.map(() => null), graded: qs.map(() => null), flags: new Set(), cur: 0, mode: "mc", phase: "run", confirm: false, end: 0, tag: "gen" }); renderExam(); };
  if ($("#genclr")) $("#genclr").onclick = () => { if (!gen.clr) { gen.clr = true; $("#genclr").textContent = "Press again to delete all"; return; } gen.clr = false; store.set("gen", []); gen.msg = "Saved AI questions deleted."; renderExam(); };
}
async function generateQs(obj) {
  if (!sampleFn || gen.busy) return;
  const d = +obj.split(".")[0], title = OBJ_TITLES[obj];
  const ground = CARDS.filter(c => c.o === obj).slice(0, 25).map(c => `- ${c.t}: ${c.def}`).join("\n");
  const avoid = [...EXAM.filter(q => q.o === obj).slice(0, 4).map(q => q.q), ...gstore().filter(q => q.o === obj).slice(-6).map(q => q.q)].map(s => "- " + s).join("\n");
  const prompt = `Write 10 NEW practice questions for the CompTIA A+ Core 2 exam (220-1202), objective ${obj}: ${title} (Domain ${d}.0 ${DOMAINS[d].name}).

Reference facts for this objective (use them, stay accurate, and don't invent product behavior):
${ground || "- (use standard 220-1202 knowledge for this objective)"}

Requirements:
- Scenario-based, the way CompTIA writes them: a short help desk or technician situation, then a question (use FIRST, BEST or MOST LIKELY where natural).
- Exactly 4 answer options, exactly one correct, with plausible distractors. No "all of the above" or "none of the above".
- Current technology: Windows 10/11, current macOS, mainstream Linux distros.
- Vary the sub-topics and don't repeat these existing questions:
${avoid}
- "why": 1-2 sentences explaining why the answer is right (and why a tempting distractor is wrong).

Reply with only a JSON array of 10 objects shaped like {"q": string, "c": [string, string, string, string], "a": 0-3, "why": string}.`;
  gen.busy = true; gen.msg = "Claude is writing your questions…"; gen.ctl = new AbortController(); renderExam();
  try {
    const out = await sampleFn.json(prompt, { modelTier: "default", signal: gen.ctl.signal, cache: false });
    const items = (Array.isArray(out) ? out : []).filter(x => x && typeof x.q === "string" && Array.isArray(x.c) && x.c.length === 4 && x.c.every(c => typeof c === "string" && c.trim()) && Number.isInteger(+x.a) && +x.a >= 0 && +x.a <= 3)
      .map((x, i) => ({ id: "g" + nowMs().toString(36) + i, d, o: obj, q: x.q.trim(), c: x.c.map(s => s.trim()), a: +x.a, why: String(x.why || "").trim(), key: x.c[+x.a], kw: [[String(x.c[+x.a]).toLowerCase().split(/\W+/).filter(w => w.length > 3)[0] || "x"]], ai: true }));
    if (!items.length) throw { code: "invalid_json" };
    const all = [...gstore(), ...items].slice(-200); store.set("gen", all);
    gen.busy = false; gen.msg = `${items.length} new questions on ${obj}. Saved for later practice too.`;
    const qs = items.map(q => ({ ...q, gk: q.id }));
    Object.assign(ex, { qs, ans: qs.map(() => null), graded: qs.map(() => null), flags: new Set(), cur: 0, mode: "mc", phase: "run", confirm: false, end: 0, tag: "gen" });
    renderExam();
  } catch (e) {
    gen.busy = false;
    const c = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { sampleFn = null; aiState = "off"; gen.msg = "Claude isn't available on this page, so question generation is off."; }
    else gen.msg = c === "cancelled" ? "Stopped." : c === "rate_limited" ? "Claude is rate-limited right now. Try again in a bit." : c === "invalid_json" ? "Claude's reply didn't come back in a usable format. Press Generate again." : "Couldn't generate questions this time. Press Generate to try again.";
    if (tab === "exam") renderExam();
  }
}
const explainCache = {};
function explainBtn(key) { return sampleFn ? `<div class="explainwrap"><button class="btn ghost sm" type="button" data-explain="${esc(key)}">✨ Explain this</button><div class="explain" hidden></div></div>` : ""; }
function explainCtx(key) {
  const [p, ...rest] = key.split(":"), id = rest.join(":");
  if (p === "e" || p === "g") { const q = p === "e" ? EXAM[+id] : gstore().find(x => x.id === id); return q && `Question (objective ${q.o}): ${q.q}\nOptions: ${q.c.join(" | ")}\nCorrect answer: ${keyText(q)}\nOfficial explanation: ${q.why}`; }
  const c = missCard(key); if (!c) return null;
  const strip = h => h.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  return `Study item (${c.src}, objective ${c.o}): ${strip(c.front)}\nCorrect answer: ${strip(c.back)}`;
}
function wireExplain(root) {
  root.querySelectorAll("[data-explain]").forEach(b => b.onclick = async () => {
    const key = b.dataset.explain, box = b.nextElementSibling, ctx = explainCtx(key);
    if (!ctx || !sampleFn) return;
    box.hidden = false;
    if (explainCache[key]) { box.innerHTML = explainCache[key]; b.remove(); return; }
    b.disabled = true; box.textContent = "Thinking…";
    const render = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
    try {
      const { text } = await sampleFn(`You're a friendly CompTIA A+ Core 2 (220-1202) tutor. A student got this wrong and wants to understand it.

${ctx}

Explain in plain English for someone new to IT, under 130 words, in exactly three short parts that start with "Why:", "Memory trick:" and "On the exam:". No headers or bullet lists. Be accurate, and stick to what CompTIA expects.`, { modelTier: "quick", onText: ({ text }) => { box.innerHTML = render(text); } });
      explainCache[key] = box.innerHTML = render(text); b.remove();
    } catch (e) {
      b.disabled = false;
      box.textContent = e && e.code === "rate_limited" ? "Claude is rate-limited. Try again shortly." : e && ["not_granted", "sampling_disabled"].includes(e.code) ? "Claude isn't available on this page." : "Couldn't get an explanation this time. Press the button to try again.";
    }
  });
}
