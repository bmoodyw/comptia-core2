/* ===== Round 3: 51 more scenario questions, weighted to thin objectives. a:[i,j] = multiple response ("Choose two") ===== */
EXAM.push(
  // ---- Domain 1 ----
  {d:1,o:"1.1",q:"A Linux file server for a video team needs a high-performance 64-bit journaling file system built for very large volumes. It's the default on Red Hat Enterprise Linux. Which file system fits?",c:["exFAT","XFS","FAT32","APFS"],a:1,why:"XFS is designed for large volumes and parallel I/O, and it's RHEL's default. ext4 is the other common Linux choice.",key:"XFS.",kw:[["xfs"]]},
  {d:1,o:"1.3",q:"Which TWO features does Windows 11 Pro include that Windows 11 Home does not? (Choose two.)",c:["BitLocker drive encryption","Joining an Active Directory domain","Windows Hello sign-in","The Microsoft Store","Snap layouts"],a:[0,1],why:"Pro adds BitLocker, domain join, gpedit.msc, Hyper-V and the Remote Desktop host. Hello, the Store and Snap layouts are in both editions.",key:"BitLocker and Active Directory domain join (Pro also adds gpedit, Hyper-V and the Remote Desktop host).",kw:[["bitlocker"],["domain"]]},
  {d:1,o:"1.3",q:"An engineering workstation has four physical CPUs and 1.5 TB of RAM. Which Windows edition supports that hardware?",c:["Windows 11 Home","Windows 11 Pro","Windows 11 Pro for Workstations","Windows 11 Education"],a:2,why:"Pro for Workstations supports up to 4 CPUs and 6 TB of RAM. Pro tops out at 2 CPUs and 2 TB; Home at 1 CPU and 128 GB.",key:"Windows 11 Pro for Workstations (up to 4 CPUs, 6 TB RAM).",kw:[["workstation"]]},
  {d:1,o:"1.8",q:"A company requires every Mac laptop's drive to be encrypted, so data on a stolen laptop can't be read. What should you enable?",c:["Keychain","FileVault","Time Machine","Gatekeeper"],a:1,why:"FileVault is macOS full-disk encryption.",key:"FileVault full-disk encryption.",kw:[["filevault"]]},
  {d:1,o:"1.8",q:"A new Mac user asks for the quickest way to find a document by name without opening Finder. What do you show them?",c:["Mission Control","Spotlight (Command+Space)","Disk Utility","The Dock"],a:1,why:"Spotlight searches files, apps and email system-wide.",key:"Spotlight: press Command+Space and type the name.",kw:[["spotlight"]]},
  {d:1,o:"1.10",q:"Before rolling a 3D CAD application out to 30 PCs, which TWO requirements should you verify? (Choose two.)",c:["The GPU type and VRAM meet the vendor's spec","The OS is 64-bit to match the application","The monitor brand","The keyboard layout","The desktop wallpaper"],a:[0,1],why:"Graphics (dedicated vs. integrated, VRAM) and the OS platform (32- vs. 64-bit) are the 1.10 checks, along with RAM, CPU, storage and hardware tokens.",key:"Check graphics requirements (dedicated GPU/VRAM) and that the OS is 64-bit. RAM, CPU, storage and any license token matter too.",kw:[["gpu","graphics","vram"],["64"]]},
  {d:1,o:"1.11",q:"When employees leave, the company wants to reassign their Microsoft 365 licenses to new hires without tracking product keys. Which concept does this describe?",c:["Volume license keys in a spreadsheet","Cloud licensing assignment from the admin portal","Reimaging each PC","OEM license stickers"],a:1,why:"Cloud licensing ties licenses to users, so you manage and reassign them centrally.",key:"Cloud licensing assignment: manage and reassign licenses to users centrally in the admin portal.",kw:[["licens"]]},
  {d:1,o:"1.11",q:"A user saves a file on their laptop and it appears on their phone a minute later. Which cloud productivity feature is this?",c:["Folder redirection","Cloud storage synchronization","Identity synchronization","Email archiving"],a:1,why:"Sync clients upload local changes and download them to every registered device.",key:"Cloud storage synchronization (e.g. OneDrive or Google Drive sync).",kw:[["sync"]]},
  {d:1,o:"1.2",q:"Which TWO things do you need to install Windows on 50 new PCs over the network with no USB or optical media? (Choose two.)",c:["Network-boot (PXE) support in each PC's firmware/NIC","A deployment server, such as WDS, holding the image","An optical drive in each PC","A recovery partition on each PC","An in-place upgrade path"],a:[0,1],why:"PXE boots the PC from the network, and a deployment server delivers the image.",key:"PXE network boot on each PC plus a deployment server (e.g. WDS or another imaging server).",kw:[["pxe","network boot"],["server","wds","deploy"]]},
  {d:1,o:"1.7",q:"An admin shares a folder as Payroll$. What does the $ do?",c:["Encrypts the share","Hides the share from network browsing, but it isn't a security control","Makes the share read-only","Limits it to administrators"],a:1,why:"A $ suffix hides the share from browsing. Anyone who knows the name and has permissions can still open it.",key:"It hides the share from browsing. It doesn't secure it; permissions still control access.",kw:[["hid"]]},
  // ---- Domain 2 ----
  {d:2,o:"2.1",q:"Which TWO are examples of the authentication factor 'something you have'? (Choose two.)",c:["Smart card","Authenticator app or hardware token","Password","Fingerprint","Shoe size"],a:[0,1],why:"Possession factors are physical or app tokens. A password is something you know; a fingerprint is something you are.",key:"A smart card and a hardware or app token (TOTP authenticator).",kw:[["smart card"],["token","authenticator","key fob"]]},
  {d:2,o:"2.1",q:"Leadership wants every access request verified, even from inside the corporate network, with no implicit trust. Which model is this?",c:["Least privilege","Zero trust","Defense through obscurity","Perimeter security"],a:1,why:"Zero trust verifies every user, device and request.",key:"Zero trust.",kw:[["zero trust"]]},
  {d:2,o:"2.1",q:"Users sign in to the company portal once and then open Salesforce and Microsoft 365 without signing in again. Which capability is this?",c:["Multifactor authentication","Single sign-on (using a standard like SAML)","Just-in-time access","Password vaulting"],a:1,why:"SSO lets one authentication grant access to multiple services. SAML is a common standard for passing that identity.",key:"Single sign-on, typically via SAML federation.",kw:[["sso","single sign","saml"]]},
  {d:2,o:"2.2",q:"A standard user tries to install approved software. A dialog dims the screen and asks for an administrator's credentials. Which Windows feature is this?",c:["BitLocker","User Account Control (UAC)","Windows Hello","SmartScreen"],a:1,why:"UAC prompts for elevation on the secure desktop.",key:"User Account Control (UAC).",kw:[["uac","user account control"]]},
  {d:2,o:"2.2",q:"On a Windows 11 Pro laptop, HR needs a single folder encrypted so other users of the PC can't read it, without encrypting the whole drive. What should you use?",c:["BitLocker","EFS (Encrypting File System)","BitLocker To Go","FileVault"],a:1,why:"EFS encrypts individual files and folders per user on NTFS. BitLocker encrypts whole volumes.",key:"EFS (Encrypting File System) on the folder.",kw:[["efs","encrypting file"]]},
  {d:2,o:"2.3",q:"A company wants every employee to join Wi-Fi with their own Active Directory credentials instead of a shared password. What should be configured?",c:["WPA2/WPA3-Personal with a long PSK","WPA2/WPA3-Enterprise (802.1X) backed by a RADIUS server","An open network with a captive portal","WEP"],a:1,why:"Enterprise mode authenticates each user individually through 802.1X and RADIUS.",key:"WPA2/WPA3-Enterprise using 802.1X with a RADIUS server tied to AD.",kw:[["enterprise","802.1x","radius"]]},
  {d:2,o:"2.4",q:"Antivirus flags a toolbar that came bundled with a free PDF converter and changed the browser's search engine. How is this usually classified?",c:["Rootkit","Potentially unwanted program (PUP)","Boot sector virus","Ransomware"],a:1,why:"PUPs are bundled, unwanted software such as toolbars and search hijackers.",key:"A potentially unwanted program (PUP), adware or a search hijacker.",kw:[["pup","potentially unwanted","adware"]]},
  {d:2,o:"2.4",q:"A small company with no security staff wants experts to watch its endpoint alerts around the clock and respond to threats. What should it buy?",c:["XDR licenses only","MDR (managed detection and response)","An email security gateway","A software firewall"],a:1,why:"MDR is detection and response provided as a managed service.",key:"MDR, managed detection and response from a security provider.",kw:[["mdr","managed detection"]]},
  {d:2,o:"2.5",q:"Stickers with new QR codes appear over the real ones on restaurant table menus, and scanning them opens a fake payment page. What attack is this?",c:["Smishing","QR code phishing","Whaling","Evil twin"],a:1,why:"Swapping QR codes to send people to malicious sites is QR code phishing.",key:"QR code phishing.",kw:[["qr"]]},
  {d:2,o:"2.5",q:"Attackers break into a software vendor's update server and push malware to every customer through a normal update. What attack is this?",c:["Insider threat","Supply chain attack","Dictionary attack","On-path attack"],a:1,why:"Compromising a trusted supplier to reach its customers is a supply chain attack (like SolarWinds).",key:"A supply chain (pipeline) attack.",kw:[["supply chain","pipeline"]]},
  {d:2,o:"2.6",q:"You've updated the anti-malware software and removed the infection in Safe Mode. Following CompTIA's procedure, what comes next?",c:["Educate the end user","Schedule scans and run updates","Disable System Restore","Quarantine the system"],a:1,why:"After remediation: schedule scans and run updates, enable System Restore and create a restore point, then educate the user.",key:"Schedule scans and run updates (then re-enable System Restore and educate the user).",kw:[["schedul","update"]]},
  {d:2,o:"2.7",q:"Which TWO settings best reduce the risk of password-guessing attacks on workstations? (Choose two.)",c:["Lock the account after a set number of failed attempts","Rename or disable the default Administrator account","Enable the Guest account","Turn off the screen-saver lock","Allow blank passwords"],a:[0,1],why:"Lockout thresholds stop online brute force, and changing default accounts removes a known target.",key:"Account lockout after failed attempts, and renaming or disabling default admin accounts (plus strong password policy).",kw:[["lock"],["default","rename","admin"]]},
  {d:2,o:"2.7",q:"Malware is spreading through USB drives that launch automatically when inserted. Which workstation setting addresses this?",c:["Disable AutoRun/AutoPlay","Turn on BitLocker To Go","Enable the Guest account","Increase password length"],a:0,why:"Disabling AutoPlay/AutoRun stops media from launching content on insertion.",key:"Disable AutoRun/AutoPlay (Settings > Bluetooth & devices > AutoPlay, or via Group Policy).",kw:[["autoplay","autorun"]]},
  {d:2,o:"2.8",q:"Employees want to use personal phones for work email, but the company must be able to wipe work data without touching personal photos. What's the best approach?",c:["Factory reset the phones monthly","Enroll in MDM with a separate work profile or container that can be selectively wiped","Ban all personal phones","Install a mobile firewall only"],a:1,why:"BYOD under MDM separates corporate data so it can be wiped without wiping personal data.",key:"Enroll BYOD devices in MDM with a work profile/container (a partition) and use selective (corporate) wipe.",kw:[["mdm","work profile","container","partition","selective"]]},
  {d:2,o:"2.9",q:"Old HDDs will be reused inside the company. Data must not be recoverable, but the drives must keep working. What should you do?",c:["Quick format","Degauss","Overwrite the whole drive with a wipe tool (e.g. DBAN) or a full format","Drill through the platters"],a:2,why:"Overwriting removes the data and leaves the drive usable. Degaussing and drilling destroy the drive, and a quick format leaves data recoverable.",key:"Wipe/overwrite the entire drive (DBAN, or a full format, which writes zeros) so it can be reused.",kw:[["wipe","overwrite","dban","full format","zero"]]},
  {d:2,o:"2.11",q:"Several people share one front-desk PC. A user wants their browsing history, cookies and form data discarded when they close the browser. What should they use?",c:["Pop-up blocker","Private/incognito browsing mode","Browser synchronization","A proxy server"],a:1,why:"Private browsing doesn't keep history, cookies or cache after the window closes.",key:"Private (InPrivate/incognito) browsing mode.",kw:[["private","incognito","inprivate"]]},
  {d:2,o:"2.11",q:"Policy requires browsers to encrypt DNS lookups so others on the network can't see which sites users visit. Which setting do you turn on?",c:["Pop-up blocker","Secure DNS / DNS over HTTPS (DoH)","Ad blocker","Clear cache on exit"],a:1,why:"DoH sends DNS queries inside HTTPS.",key:"Secure DNS: DNS over HTTPS (DoH).",kw:[["doh","dns over https","secure dns"]]},
  {d:2,o:"2.10",q:"A home office printer must always keep the same IP address, but you don't want to configure it statically on the printer. What do you set on the SOHO router?",c:["Port forwarding","A DHCP reservation for the printer's MAC address","UPnP","A screened subnet"],a:1,why:"A reservation always hands the same IP to that MAC address.",key:"A DHCP reservation tied to the printer's MAC address.",kw:[["reserv"]]},
  // ---- Domain 3 ----
  {d:3,o:"3.1",q:"Since last night's Windows update installed, a PC hangs on a black screen at boot. What's the best first fix?",c:["Reinstall Windows","Boot to WinRE and uninstall the latest update (roll back)","Replace the hard drive","Run chkdsk /r from Windows"],a:1,why:"Rolling back the update that caused the problem is the least invasive fix. WinRE has Uninstall Updates.",key:"Boot into WinRE (or Safe Mode) and uninstall/roll back the latest quality or feature update.",kw:[["uninstall","roll back","rollback"]]},
  {d:3,o:"3.1",q:"A user signs in and gets 'You've been signed in with a temporary profile.' Their desktop and settings are missing. What should you do?",c:["Reinstall all applications","Rebuild the Windows user profile (copy data to a new profile)","Replace the keyboard","Disable UAC"],a:1,why:"A corrupt profile is fixed by rebuilding it: back up data, create a new profile, migrate.",key:"Rebuild the Windows profile: back up data, let Windows create a fresh profile, then migrate files and settings.",kw:[["profile"]]},
  {d:3,o:"3.1",q:"Print jobs sit in the queue and won't print for anyone using a shared PC. Users can still reach the printer. What's a fast first step?",c:["Reinstall Windows","Restart the Print Spooler service","Replace the printer","Run sfc /scannow"],a:1,why:"Restarting the service clears stuck jobs. It's one of the 3.1 troubleshooting steps.",key:"Restart the Print Spooler service (services.msc), clearing the stuck queue if needed.",kw:[["restart"],["spool","service"]]},
  {d:3,o:"3.1",q:"A PC has become sluggish since the user installed several utilities. Which TWO should you check first? (Choose two.)",c:["Task Manager for processes using high CPU, memory or disk","Startup apps that launch at sign-in","Monitor refresh rate","Mouse DPI","The desktop wallpaper"],a:[0,1],why:"Check resource use, then trim startup items before anything heavier.",key:"Task Manager resource use (CPU/memory/disk per process) and the Startup apps list.",kw:[["task manager","cpu","memory","process"],["startup"]]},
  {d:3,o:"3.2",q:"One app on an iPhone won't update ('Unable to download'), while other apps work. Settings shows 300 MB of storage free. What's the likely fix?",c:["Factory reset","Free up storage space, then retry the update","Replace the battery","Turn on airplane mode"],a:1,why:"Updates need free space to download and unpack.",key:"Free up storage (offload apps or delete media), then retry. Also check connectivity and the payment method.",kw:[["storage","space","free"]]},
  {d:3,o:"3.2",q:"A phone reboots randomly, gets hot, and the screen is lifting off the frame. What do you do?",c:["Update all apps","Stop using it: likely a swollen battery. Power it off and have the battery or device replaced.","Clear the cache","Disable Bluetooth"],a:1,why:"A swollen lithium battery is a safety hazard as well as the cause of the reboots.",key:"Swollen battery: power it off, stop charging it and replace it safely. It's a fire hazard.",kw:[["battery","swollen"]]},
  {d:3,o:"3.2",q:"AirDrop can't find a coworker's iPhone sitting at the next desk. What should you check?",c:["NFC is enabled","Both devices have Wi-Fi and Bluetooth on and AirDrop is discoverable (Contacts Only/Everyone)","The cellular plan","The screen rotation lock"],a:1,why:"AirDrop uses Bluetooth for discovery and Wi-Fi for transfer, within about 30 feet.",key:"Turn on Wi-Fi and Bluetooth on both devices, stay within about 30 ft, and set AirDrop discoverability (Contacts Only or Everyone for 10 minutes).",kw:[["bluetooth","wi-fi","wifi","discover"]]},
  {d:3,o:"3.3",q:"After a user installed a 'free flashlight' app, their Android phone shows full-screen ads even on the home screen. What's the cause and fix?",c:["A carrier outage; wait it out","Adware in the new app: uninstall it, run an anti-malware scan and review app permissions","A failing screen; replace it","A full cache; clear browser data"],a:1,why:"A high number of ads after a new install points to adware.",key:"Adware from the new app: uninstall it, scan for malware and check device admin and permissions. Factory reset if it persists.",kw:[["adware","malware","uninstall","remove"]]},
  {d:3,o:"3.3",q:"A browser pop-up on a phone says 'Your device has 3 viruses! Install Cleaner now.' What should the user do?",c:["Install the cleaner","Ignore it and close the tab; it's a fake security warning, so don't install anything","Factory reset immediately","Call the number shown"],a:1,why:"Fake security warnings trick users into installing malware.",key:"It's a fake security warning: close the tab and don't install or call anything. Scan with trusted anti-malware if they already tapped it.",kw:[["fake","close","ignore","don't","do not"]]},
  {d:3,o:"3.3",q:"A user's personal files leaked from their phone, and MDM reports the device as rooted. What should you do?",c:["Ignore it, since MDM is installed","Block the device from company data, factory reset it to an unrooted state and have the user change passwords","Just update the apps","Turn off developer mode only"],a:1,why:"Rooting bypasses OS security and makes MDM ineffective.",key:"Treat it as compromised: cut its access, factory reset to a stock unrooted OS, change passwords and check for leaked data.",kw:[["reset","wipe","root","factory"]]},
  {d:3,o:"3.4",q:"Every file on a user's shared drive now ends in .locked, and a text file demands Bitcoin. What's the FIRST step?",c:["Pay the ransom","Disconnect the PC from the network to quarantine it, then follow incident response","Rename the files back","Run Disk Cleanup"],a:1,why:"Ransomware spreads. Isolate it first, then restore from clean backups.",key:"Ransomware: quarantine (disconnect) immediately, report through incident response, then restore from known-good offline backups.",kw:[["disconnect","quarantin","isolat"]]},
  {d:3,o:"3.4",q:"Windows Update keeps failing with an error on a PC that's clean of malware and has plenty of disk space. What built-in tool should you run?",c:["Disk Defragmenter","The Windows Update troubleshooter","Reliability Monitor","Resource Monitor"],a:1,why:"Settings > System > Troubleshoot > Other troubleshooters > Windows Update.",key:"The Windows Update troubleshooter (Settings > System > Troubleshoot > Other troubleshooters).",kw:[["troubleshoot"]]},
  {d:3,o:"3.4",q:"A user's files have been renamed, some open with 'Access denied', and file permissions changed overnight. What does this most likely indicate?",c:["A failing monitor","Malware that altered system or personal files","A full Recycle Bin","An expired license"],a:1,why:"Altered or renamed files and changed permissions are classic malware symptoms (3.4).",key:"Malware altering files and permissions. Quarantine it and follow the malware removal steps, or restore from a known-good backup.",kw:[["malware","virus","ransom"]]},
  // ---- Domain 4 ----
  {d:4,o:"4.1",q:"Which TWO pieces of information are most important to put in a new help desk ticket? (Choose two.)",c:["User contact and device information","A clear, concise problem description","Your opinion of the user","Unrelated past tickets","The user's password"],a:[0,1],why:"Who, what device and a clear description drive categorization, severity and escalation. Never record passwords.",key:"The user's contact and device information, and a clear, concise problem description (then category and severity).",kw:[["user","contact","device"],["description","problem"]]},
  {d:4,o:"4.1",q:"Every laptop gets a barcode label that links it to its record with purchase date, warranty and assigned user. What is this?",c:["Change management","Asset management (asset tags in a CMDB/inventory)","An SLA","An AUP"],a:1,why:"Asset tags tie devices to inventory and CMDB records.",key:"Asset management: asset tags linked to an inventory/CMDB database.",kw:[["asset"]]},
  {d:4,o:"4.2",q:"Replacing a user's toner cartridge follows a documented, pre-approved, low-risk process. Which change type is it?",c:["Emergency","Normal","Standard","Major"],a:2,why:"Standard changes are routine and pre-approved.",key:"A standard change.",kw:[["standard"]]},
  {d:4,o:"4.3",q:"A user needs yesterday's version of a spreadsheet, but today's edits must not be overwritten. How should you restore it?",c:["In-place restore over the original","Restore to an alternate location","Run a new full backup","Use System Restore"],a:1,why:"Restoring to an alternate location keeps the current file intact.",key:"Restore to an alternate location so the current file isn't overwritten.",kw:[["alternate","different location","another location"]]},
  {d:4,o:"4.4",q:"You need to move a 70 lb rack UPS to a cart. What's the safe approach?",c:["Lift with your back quickly","Get help or use a lift/cart, keep your back straight and lift with your legs","Drag it by the cord","Lift it alone and twist"],a:1,why:"Use proper lifting technique and get help or equipment for heavy items.",key:"Team lift or use equipment; lift with your legs, keep your back straight and don't twist.",kw:[["legs","help","team","cart","dolly","lift"]]},
  {d:4,o:"4.5",q:"In winter, techs in the server room keep getting static shocks. What environmental control helps?",c:["Lower the temperature","Raise humidity to around 50%","Add more fans","Open the windows"],a:1,why:"Low humidity increases static. About 50% is the usual target; too high causes condensation.",key:"Raise relative humidity (target around 50%) and keep using ESD precautions.",kw:[["humid"]]},
  {d:4,o:"4.5",q:"The office loses power for a few seconds several times a month and the file server crashes each time. What fixes this?",c:["A surge suppressor","A UPS (battery backup)","A power strip","Joule ratings"],a:1,why:"Only a UPS rides through outages. Surge suppressors only clamp spikes.",key:"A UPS (uninterruptible power supply), ideally with auto-shutdown software.",kw:[["ups","battery backup","uninterruptible"]]},
  {d:4,o:"4.6",q:"Which TWO are personally identifiable information (PII)? (Choose two.)",c:["A customer's Social Security number","A customer's home address","The company's stock ticker","A server hostname","The office Wi-Fi SSID"],a:[0,1],why:"PII identifies a specific person.",key:"The Social Security number and the home address.",kw:[["social security","ssn"],["address"]]},
  {d:4,o:"4.6",q:"An audit finds a design program installed on 50 PCs, but the company owns a 10-seat license. What should happen?",c:["Nothing, since it was purchased","Report it: license violation. Remove the extra installs or buy enough licenses.","Crack the license","Rename the PCs"],a:1,why:"Installing beyond the license terms violates the EULA.",key:"It's a licensing (EULA) violation. Report it and either buy the extra seats or uninstall the extras.",kw:[["licens","eula"]]},
  {d:4,o:"4.7",q:"While fixing an executive's laptop, you see confidential salary documents open on screen. What do you do?",c:["Read them for context","Don't read or share them; ask the user to close them, or work around them and keep them confidential","Email them to HR","Take a photo for the ticket"],a:1,why:"Professionalism means respecting customers' confidential and private materials.",key:"Respect confidentiality: don't read, copy or disclose them. Ask the user to close or save them.",kw:[["confidential","privacy","don't read","do not read","close"]]},
  {d:4,o:"4.7",q:"You're running 20 minutes late for an on-site appointment. What's the professional move?",c:["Show up late without mentioning it","Contact the customer before the appointment time, apologize and give a new ETA","Skip the appointment","Send a coworker without telling the customer"],a:1,why:"Be on time, and if you can't, contact the customer.",key:"Call or message the customer ahead of time, apologize and set a new ETA.",kw:[["call","contact","notify","message","let"]]},
  {d:4,o:"4.10",q:"An employee pastes AI-generated text that closely paraphrases a published article into a client report, with no citation. What's the concern?",c:["Hallucination","Plagiarism","Bias","Data source"],a:1,why:"Presenting others' work, even paraphrased by AI, without attribution is plagiarism.",key:"Plagiarism: cite the source or rewrite it, and follow the company's AI-use policy.",kw:[["plagiar"]]}
);

/* ===== Round 4: coverage audit. Fills every 220-1202 sub-objective that had no card or question ===== */
CARDS.push(
  // 1.1
  {d:1,o:"1.1",t:"ChromeOS",def:"Google's Linux-based OS for Chromebooks. Browser-centric, cloud-first, auto-updates, and runs Android and web apps."},
  {d:1,o:"1.1",t:"iPadOS",def:"Apple's tablet OS, split from iOS in 2019. Adds multitasking (Split View, Stage Manager) and desktop-class browsing."},
  {d:1,o:"1.1",t:"Vendor life-cycle limits",def:"After end of life (EOL), an OS stops getting security patches and updates. Plan replacements before EOL to avoid unpatched systems."},
  {d:1,o:"1.1",t:"OS compatibility concerns",def:"Moving files between OSs: Windows can't natively read ext4 or APFS, macOS reads NTFS but can't write it. exFAT works on all three."},
  // 1.2
  {d:1,o:"1.2",t:"Internet-based install",def:"OS install or reset that downloads the image over the internet: macOS Recovery's reinstall, Windows 'Cloud download' reset."},
  {d:1,o:"1.2",t:"Image deployment",def:"Capturing one configured reference install (after Sysprep) and copying it to many PCs. Faster and more consistent than separate clean installs."},
  {d:1,o:"1.2",t:"Remote network installation",def:"Installing the OS from a network share or deployment server (often booted via PXE) instead of local media."},
  {d:1,o:"1.2",t:"Load driver (setup)",def:"Setup can't see the disk (RAID or NVMe controller)? Use 'Load driver' to add the third-party storage driver from USB."},
  {d:1,o:"1.2",t:"Upgrade compatibility check",def:"Before upgrading: back up files and user preferences, confirm application and driver support (backward compatibility), and confirm hardware meets requirements."},
  {d:1,o:"1.2",t:"External / hot-swappable drive boot",def:"Booting setup from an external USB drive or eSATA drive you can connect without powering down. Set the boot order in UEFI first."},
  // 1.3
  {d:1,o:"1.3",t:"Edition RAM limits",def:"Windows 11 Home: 128 GB. Pro: 2 TB. Pro for Workstations and Enterprise: 6 TB."},
  {d:1,o:"1.3",t:"Remote Desktop host",def:"Only Pro, Pro for Workstations, Education and Enterprise can accept incoming RDP sessions. Home can only connect out."},
  // 1.5
  {d:1,o:"1.5",t:"cd",def:"Change directory. cd \\ goes to the root, cd .. goes up one level. cd with no argument shows the current path."},
  {d:1,o:"1.5",t:"dir",def:"Lists files and folders. /a shows hidden and system files, /s searches subfolders, /p pauses each screen."},
  {d:1,o:"1.5",t:"xcopy",def:"Copies files AND folders. /s copies subfolders, /e includes empty ones. Robocopy is the more robust replacement."},
  {d:1,o:"1.5",t:"md / rd",def:"md (mkdir) makes a directory; rd (rmdir) removes it. rd /s deletes a folder and everything in it."},
  {d:1,o:"1.5",t:"hostname",def:"Prints the computer's name. Quick check before remote support or when mapping drives."},
  {d:1,o:"1.5",t:"shutdown /r /t 0",def:"Restarts immediately. /s shuts down, /t sets a delay in seconds, /a aborts a pending shutdown."},
  {d:1,o:"1.5",t:"[command] /?",def:"Shows the help for any Windows command, listing its switches and syntax."},
  // 1.6
  {d:1,o:"1.6",t:"Settings: Update & Security",def:"Windows Update, delivery optimization, recovery and backup options. In Windows 11, Windows Update has its own section."},
  {d:1,o:"1.6",t:"Settings: Personalization",def:"Background, colors, lock screen, themes, Start and taskbar."},
  {d:1,o:"1.6",t:"Settings: Network & Internet",def:"Wi-Fi, Ethernet, VPN, proxy, mobile hotspot, airplane mode, and changing a network between Public and Private."},
  {d:1,o:"1.6",t:"Settings: Gaming",def:"Xbox Game Bar, captures, and Game Mode, which prioritizes the game's performance."},
  {d:1,o:"1.6",t:"Settings: Apps",def:"Uninstall or modify apps, set default apps, manage startup apps and optional features."},
  {d:1,o:"1.6",t:"Settings: Accounts",def:"Your info, sign-in options (Windows Hello, PIN), email accounts, family and other users, access work or school."},
  // 1.7
  {d:1,o:"1.7",t:"Firewall exception",def:"'Allow an app through Windows Firewall' opens access for a specific program on Private and/or Public networks instead of opening a port to everyone."},
  {d:1,o:"1.7",t:"UNC network path",def:"\\\\server\\share\\folder. Type it into File Explorer or use it with net use to map a drive."},
  {d:1,o:"1.7",t:"WWAN connection",def:"Cellular data connection (LTE/5G) using a built-in modem or USB adapter. Often set as metered."},
  // 1.8
  {d:1,o:"1.8",t:"Apple ID (corporate)",def:"Personal Apple account for the App Store and iCloud. Companies use Managed Apple IDs and MDM to restrict personal accounts on work Macs."},
  {d:1,o:"1.8",t:"Gestures (macOS)",def:"Multi-finger trackpad actions: swipe between desktops, Mission Control, App Exposé. Set in System Settings › Trackpad."},
  {d:1,o:"1.8",t:"Dock",def:"Bar of app shortcuts at the bottom of the macOS screen. A dot marks running apps."},
  {d:1,o:"1.8",t:"Finder",def:"macOS file manager, the equivalent of File Explorer."},
  {d:1,o:"1.8",t:"Uninstall a Mac app",def:"Drag the .app from Applications to the Trash (or use its own uninstaller if it came as a .pkg)."},
  // 1.9
  {d:1,o:"1.9",t:"Bootloader (GRUB)",def:"Loads the Linux kernel at startup. GRUB is the common one and can offer a menu to choose kernels or OSs."},
  {d:1,o:"1.9",t:"Root account",def:"Linux superuser (UID 0) with unlimited rights. Log in as a normal user and elevate with sudo instead of using root directly."},
  {d:1,o:"1.9",t:"systemd",def:"Init system and service manager on most Linux distros. systemctl start, stop, enable and status control services."},
  {d:1,o:"1.9",t:"Kernel",def:"Core of the OS. Manages hardware, memory and processes. uname -r shows its version."},
  // 1.10
  {d:1,o:"1.10",t:"Dedicated vs. integrated graphics",def:"Integrated GPU shares system RAM. Dedicated card has its own VRAM. CAD, video and 3D apps often require dedicated."},
  {d:1,o:"1.10",t:"32-bit vs. 64-bit app",def:"A 64-bit app needs a 64-bit OS and CPU. A 32-bit app runs on 64-bit Windows. A 32-bit OS is limited to about 4 GB of RAM."},
  {d:1,o:"1.10",t:"Mountable ISO",def:"Disk image you double-click to mount as a virtual drive. Replaces physical install media."},
  {d:1,o:"1.10",t:"Install impact: device",def:"Will the app slow the PC, conflict with other software or change system settings? Test before rollout."},
  {d:1,o:"1.10",t:"Install impact: network",def:"Large downloads, new traffic or ports, license-server calls. Schedule mass installs off-hours."},
  {d:1,o:"1.10",t:"Install impact: operation and business",def:"Operation: training, support load, workflow changes. Business: licensing cost, downtime, compliance."},
  // 1.11
  {d:1,o:"1.11",t:"Cloud email system",def:"Hosted mailbox such as Exchange Online or Gmail. Accessed by web, mobile and desktop clients with no local mail server."},
  {d:1,o:"1.11",t:"Cloud storage sync",def:"OneDrive, Google Drive, Dropbox. Folder settings pick what syncs. 'Files on demand' keeps placeholders until opened."},
  {d:1,o:"1.11",t:"Collaboration tools",def:"Cloud word processing, spreadsheets, presentations, videoconferencing and instant messaging (Microsoft 365, Google Workspace, Teams, Slack)."},
  {d:1,o:"1.11",t:"License assignment",def:"Cloud suites are licensed per user. An admin assigns or removes licenses in the admin center during onboarding and offboarding."},
  // 2.1
  {d:2,o:"2.1",t:"Badge reader",def:"Reads an ID card or key fob to unlock a door and logs who entered and when."},
  {d:2,o:"2.1",t:"Video surveillance",def:"CCTV cameras that deter and record activity. Footage supports incident investigations."},
  {d:2,o:"2.1",t:"Motion sensors and alarms",def:"Detect movement or forced entry after hours and alert security."},
  {d:2,o:"2.1",t:"Equipment lock",def:"Cable lock (Kensington slot) or locked rack that stops someone walking off with hardware."},
  {d:2,o:"2.1",t:"Mobile digital key",def:"Phone acts as the badge or key using NFC or Bluetooth."},
  {d:2,o:"2.1",t:"Biometric types",def:"Fingerprint, palm print, retina, facial recognition, voice recognition: 'something you are'."},
  {d:2,o:"2.1",t:"Directory services",def:"Central database of users, groups and devices (Active Directory, LDAP) used for authentication and access control."},
  {d:2,o:"2.1",t:"Fencing and lighting",def:"Perimeter controls. Fences keep people to entrances; lighting removes hiding spots and helps cameras."},
  // 2.2
  {d:2,o:"2.2",t:"Defender definitions update",def:"Windows Security › Virus & threat protection › Protection updates. Also arrives through Windows Update."},
  {d:2,o:"2.2",t:"Standard vs. administrator account",def:"Standard users run apps and change their own settings. Administrators install software and change system settings. Use standard for daily work."},
  {d:2,o:"2.2",t:"Power Users group",def:"Legacy Windows group kept for compatibility. On modern Windows it has no more rights than standard Users by default."},
  {d:2,o:"2.2",t:"Guest account",def:"Built-in limited account, disabled by default. Leave it off."},
  {d:2,o:"2.2",t:"Windows Hello / passwordless",def:"Sign in with face, fingerprint or a device-bound PIN instead of a password."},
  {d:2,o:"2.2",t:"File attributes",def:"Read-only, Hidden, System, Archive. View with attrib or file Properties. Separate from NTFS permissions."},
  {d:2,o:"2.2",t:"Run as administrator",def:"Right-click › Run as administrator, or Ctrl+Shift+Enter from Start search. Triggers a UAC prompt."},
  {d:2,o:"2.2",t:"Logon script and home folder",def:"Set on the user's Profile tab in Active Directory Users and Computers. Home folder maps a personal network drive."},
  {d:2,o:"2.2",t:"BitLocker To Go",def:"BitLocker encryption for removable USB drives."},
  // 2.4
  {d:2,o:"2.4",t:"Recovery console (WinRE)",def:"Windows Recovery Environment command prompt. Repairs boot records (bootrec) and removes malware when Windows won't start."},
  {d:2,o:"2.4",t:"User education / anti-phishing training",def:"Teaching users to spot phishing and report it. Often the most effective malware prevention."},
  {d:2,o:"2.4",t:"Software firewall",def:"Host-based firewall (Windows Defender Firewall) that filters traffic for that one device and can block malware calling home."},
  // 2.5
  {d:2,o:"2.5",t:"Unpatched / unprotected systems",def:"Missing updates, or missing antivirus and firewall. Top vulnerabilities attackers exploit."},
  {d:2,o:"2.5",t:"Non-compliant system",def:"Device that fails the organization's security policy (old OS, encryption off). Quarantine or block it until fixed."},
  {d:2,o:"2.5",t:"BYOD risk",def:"Personal devices may be unpatched, shared or lost. Use MDM, containerization and an acceptable-use policy."},
  {d:2,o:"2.5",t:"Quishing (QR code phishing)",def:"Malicious QR code that sends the victim to a phishing site, often stuck over a legitimate code."},
  {d:2,o:"2.5",t:"Denial of service",def:"Overwhelming a service so legitimate users can't reach it. DDoS uses many machines (a botnet)."},
  // 2.7
  {d:2,o:"2.7",t:"Password best practices",def:"Long (length beats complexity), mixed character types, unique per site, and changed on the organization's expiration schedule."},
  {d:2,o:"2.7",t:"Screensaver / screen lock",def:"Auto-lock after inactivity with a password required to wake. Press Win+L when walking away."},
  {d:2,o:"2.7",t:"Account lockout",def:"Locks an account after a set number of failed logins, stopping brute-force guessing."},
  {d:2,o:"2.7",t:"Login time restrictions",def:"Allow sign-in only during set hours (configured in AD account settings)."},
  {d:2,o:"2.7",t:"Data-at-rest encryption",def:"Encrypts stored data (BitLocker, FileVault, EFS) so a stolen drive is unreadable."},
  {d:2,o:"2.7",t:"Disable unused services",def:"Fewer running services means a smaller attack surface."},
  {d:2,o:"2.7",t:"Rename / change default admin",def:"Change the default administrator password (and ideally rename or disable the account) so attackers can't guess it."},
  // 2.8
  {d:2,o:"2.8",t:"Locator app",def:"Find My (Apple) or Find My Device (Google). Shows location, plays a sound, locks or wipes a lost phone."},
  {d:2,o:"2.8",t:"Failed-login restrictions",def:"Phone erases itself or adds delays after too many wrong passcodes."},
  {d:2,o:"2.8",t:"Mobile patch management",def:"Keep the OS and apps updated. MDM can enforce minimum OS versions."},
  {d:2,o:"2.8",t:"BYOD vs. corporate-owned",def:"Corporate-owned: full MDM control and full wipe. BYOD: a work profile/container, and only corporate data is wiped."},
  {d:2,o:"2.8",t:"Remote backup apps",def:"iCloud or Google backup, so a lost or wiped phone can be restored."},
  // 2.9
  {d:2,o:"2.9",t:"Standard format",def:"Quick format only rebuilds the file table, so data is recoverable. Not safe for disposal."},
  {d:2,o:"2.9",t:"Drive wiping",def:"Overwrites every sector with patterns or zeros so data can't be recovered. Drive can be reused."},
  {d:2,o:"2.9",t:"Third-party destruction vendor",def:"Outsourced shredding or recycling. Get a certificate of destruction as proof."},
  {d:2,o:"2.9",t:"Physical destruction methods",def:"Drilling, shredding, crushing, incineration, degaussing (magnetic media only, not SSDs)."},
  // 2.10
  {d:2,o:"2.10",t:"Change router default password",def:"First step on any new router or AP. Default credentials are published online."},
  {d:2,o:"2.10",t:"IP filtering",def:"Router allow/deny lists by IP address to control which devices pass traffic."},
  {d:2,o:"2.10",t:"Router physical placement",def:"Secure location (locked closet), centrally placed for coverage, away from exterior walls and public access."},
  {d:2,o:"2.10",t:"Secure management access",def:"Manage the router over HTTPS from inside only. Disable remote (WAN-side) admin."},
  {d:2,o:"2.10",t:"Disable SSID broadcast",def:"Hides the network name from casual scans. Weak on its own because the SSID is still visible in traffic."},
  {d:2,o:"2.10",t:"Guest network",def:"Separate SSID that gives visitors internet access but isolates them from internal devices."},
  {d:2,o:"2.10",t:"Firmware updates",def:"Patches router vulnerabilities. Check the vendor site or enable auto-update."},
  // 2.11
  {d:2,o:"2.11",t:"Trusted download source",def:"Get browsers and extensions from the official vendor site or store. Untrusted mirrors may bundle malware."},
  {d:2,o:"2.11",t:"Clear browsing data / cache",def:"Removes history, cookies and cached files. Fixes stale pages and removes tracking data."},
  {d:2,o:"2.11",t:"Private browsing",def:"Incognito/InPrivate: no history or cookies kept after closing. It doesn't hide you from your ISP or employer."},
  {d:2,o:"2.11",t:"Pop-up and ad blockers",def:"Block unwanted windows and ads. They cut malvertising risk."},
  {d:2,o:"2.11",t:"Browser sync",def:"Signing in to the browser syncs bookmarks, passwords and history across devices. Protect the account with MFA."},
  {d:2,o:"2.11",t:"Password manager",def:"Generates and stores unique strong passwords and autofills only on the matching site."},
  // 3.1
  {d:3,o:"3.1",t:"No OS found",def:"Check boot order and remove USB media, then repair boot records: bootrec /fixmbr, /fixboot, /rebuildbcd. Check the drive in UEFI."},
  {d:3,o:"3.1",t:"USB controller resource warning",def:"Too many devices on one USB controller. Move some to a port on a different controller or a powered hub."},
  {d:3,o:"3.1",t:"Slow profile load",def:"Large roaming profile or network delay. Clean up the profile or rebuild it."},
  {d:3,o:"3.1",t:"Services not starting",def:"Check services.msc: the startup type, the service's dependencies and its logon account. Event Viewer shows the error."},
  {d:3,o:"3.1",t:"Frequent shutdowns",def:"Often overheating or power problems. Check fans, dust, temperatures and the PSU."},
  {d:3,o:"3.1",t:"Low memory warnings",def:"Close apps, find leaks in Task Manager, increase the page file or add RAM."},
  {d:3,o:"3.1",t:"Rebuild a Windows profile",def:"Corrupt profile: back up the user's data, rename or delete the profile folder and registry entry, then sign in to create a fresh one."},
  // 3.2
  {d:3,o:"3.2",t:"App fails to launch / crashes",def:"Force-stop, clear the app cache, update or reinstall, then restart the phone. Check storage space."},
  {d:3,o:"3.2",t:"App or OS fails to update",def:"Check free storage, network, battery level (usually 50%+) and device compatibility."},
  {d:3,o:"3.2",t:"Poor battery life",def:"Check battery usage per app, reduce brightness and background refresh, and check battery health."},
  {d:3,o:"3.2",t:"Random reboots",def:"Overheating, a faulty app, low storage or a failing battery. Update the OS and remove recent apps."},
  {d:3,o:"3.2",t:"Connectivity issues (Bluetooth, Wi-Fi, NFC)",def:"Toggle the radio or airplane mode, forget and re-pair, update the OS, reset network settings."},
  // 3.3
  {d:3,o:"3.3",t:"Unofficial app store",def:"Apps outside Google Play or Apple's App Store skip vetting and are a common malware source."},
  {d:3,o:"3.3",t:"Data-usage limit notification",def:"Unexpected data spike can mean malware sending data out. Check per-app data usage."},
  {d:3,o:"3.3",t:"Fake security warnings (mobile)",def:"Pop-ups claiming infection that push you to install an 'antivirus'. Usually malicious ads or adware."},
  {d:3,o:"3.3",t:"Leaked personal files",def:"Photos or data showing up online can mean a compromised account or malicious app. Change passwords and audit app permissions."},
  // 3.4
  {d:3,o:"3.4",t:"Rogue antivirus",def:"False alerts from fake security software demanding payment. A sign of malware."},
  {d:3,o:"3.4",t:"Unwanted OS notifications",def:"Spammy desktop notifications, often from a website allowed to send browser push notifications. Revoke them in browser settings."},
  {d:3,o:"3.4",t:"OS update failures (security)",def:"Malware often blocks Windows Update and security tools. Investigate if updates keep failing."},
  {d:3,o:"3.4",t:"Altered or missing files",def:"Renamed, encrypted or missing files suggest ransomware or other malware."},
  {d:3,o:"3.4",t:"Degraded browser performance",def:"Slow browser with odd toolbars or redirects. Check for malicious extensions and reset the browser."},
  // 4.1
  {d:4,o:"4.1",t:"Ticket fields",def:"User info, device info, problem description, category, severity, escalation level, progress notes, resolution."},
  {d:4,o:"4.1",t:"Procurement life cycle",def:"Request › approve › purchase › receive and tag › deploy › maintain › retire and dispose. Track warranties and licenses along the way."},
  {d:4,o:"4.1",t:"New-user setup checklist",def:"Onboarding SOP: create accounts, assign licenses and groups, issue hardware, set up email and access."},
  {d:4,o:"4.1",t:"Incident report",def:"Documents what happened, when, who was affected, actions taken and lessons learned."},
  {d:4,o:"4.1",t:"Escalation levels",def:"Tier 1 help desk › Tier 2 specialists › Tier 3 engineers/vendors. Escalate when you lack skill or permissions."},
  // 4.2
  {d:4,o:"4.2",t:"Change request form",def:"Documents purpose, scope, change type, date/time, affected systems, risk level, rollback plan and the responsible staff member."},
  {d:4,o:"4.2",t:"Change advisory board (CAB)",def:"Reviews and approves change requests based on risk and business impact."},
  {d:4,o:"4.2",t:"Risk analysis (change)",def:"Rates the likelihood and impact of a change failing. Sets the risk level the CAB uses to approve or deny."},
  {d:4,o:"4.2",t:"Peer review",def:"Another technician checks the change plan or work for mistakes before or after implementation."},
  {d:4,o:"4.2",t:"Backup plan (change)",def:"If the change and the rollback both fail, how will you restore service? Usually tested backups."},
  // 4.3
  {d:4,o:"4.3",t:"Recovery testing",def:"Regularly restoring from backup to prove it works. An untested backup isn't a backup."},
  {d:4,o:"4.3",t:"Onsite vs. offsite backup",def:"Onsite: fast restores. Offsite (cloud or another building): survives fire, flood or theft. Use both."},
  // 4.4
  {d:4,o:"4.4",t:"ESD mat",def:"Antistatic work surface connected to ground. Use it with a wrist strap."},
  {d:4,o:"4.4",t:"Antistatic bag",def:"Store and move components in shielded bags. Hold parts by the edges."},
  {d:4,o:"4.4",t:"Equipment grounding",def:"Three-prong grounded outlets send fault current safely to ground. Never remove the ground pin."},
  {d:4,o:"4.4",t:"Disconnect power first",def:"Unplug before opening a PC. Never open a power supply or CRT: capacitors hold a charge."},
  {d:4,o:"4.4",t:"Lifting technique",def:"Bend at the knees, keep your back straight, hold the load close, get help for heavy items."},
  {d:4,o:"4.4",t:"Safety goggles and air filtration mask",def:"Goggles for cutting or flying debris; a mask when cleaning dust or toner."},
  {d:4,o:"4.4",t:"Government regulations (safety)",def:"Follow OSHA and local building and electrical codes. They override company preference."},
  // 4.5
  {d:4,o:"4.5",t:"Battery disposal",def:"Batteries are hazardous waste. Recycle them per the SDS and local rules, never in the trash."},
  {d:4,o:"4.5",t:"Toner disposal",def:"Return or recycle cartridges. Clean spills with a toner vacuum, not a regular vacuum."},
  {d:4,o:"4.5",t:"Humidity",def:"Too low = static/ESD risk. Too high = condensation and corrosion. Aim for roughly 40–60% relative humidity."},
  {d:4,o:"4.5",t:"Ventilation and dust",def:"Keep vents clear, clean dust with compressed air or an electronics vacuum, and place equipment away from heat sources."},
  {d:4,o:"4.5",t:"Under-voltage (brownout)",def:"Voltage drops below normal. Can crash or damage equipment. A UPS or line conditioner helps."},
  {d:4,o:"4.5",t:"Surge suppressor",def:"Absorbs voltage spikes. It doesn't help during a power loss (blackout); a UPS does."},
  // 4.6
  {d:4,o:"4.6",t:"Inform management / law enforcement",def:"When you find illegal content or a security incident, stop, preserve the evidence and report through proper channels. Management decides on law enforcement."},
  {d:4,o:"4.6",t:"Forensic copy of drive",def:"Bit-for-bit image of the evidence drive, hashed to prove integrity. Analyze the copy, never the original."},
  {d:4,o:"4.6",t:"Documentation of incident",def:"Record what you saw, when, and every action taken, with times. It supports the chain of custody."},
  {d:4,o:"4.6",t:"Perpetual license",def:"Pay once, use that version forever (no new versions). Subscription licenses expire if not renewed."},
  {d:4,o:"4.6",t:"Personal vs. corporate license",def:"Personal/home licenses usually forbid business use. Corporate licenses cover commercial use and multiple seats."},
  {d:4,o:"4.6",t:"Open-source license",def:"Source code is free to view, modify and share under its license terms (GPL, MIT, Apache)."},
  {d:4,o:"4.6",t:"Regulated data types",def:"Credit card data (PCI DSS), government-issued IDs, PII, healthcare data (PHI/HIPAA). Each has handling rules."},
  {d:4,o:"4.6",t:"Data retention requirements",def:"Laws or policy that set how long records must be kept, and when they must be destroyed."},
  // 4.7
  {d:4,o:"4.7",t:"Professional attire",def:"Match the environment: formal for executive or client-facing settings, business casual otherwise."},
  {d:4,o:"4.7",t:"Avoid jargon",def:"Use plain language the customer understands. Explain acronyms."},
  {d:4,o:"4.7",t:"Avoid distractions",def:"No personal calls, texting or social media while with a customer."},
  {d:4,o:"4.7",t:"Difficult customers",def:"Don't argue or get defensive, don't dismiss the problem, repeat it back to confirm, and never post about it on social media."},
  {d:4,o:"4.7",t:"Open-ended questions",def:"'What happened right before the error?' Gets detail that yes/no questions miss."},
  {d:4,o:"4.7",t:"Set and meet expectations",def:"Give a realistic timeline, provide status updates, offer repair vs. replace options, and follow up after."},
  {d:4,o:"4.7",t:"Cultural sensitivity",def:"Use appropriate professional titles and respect cultural communication differences."},
  {d:4,o:"4.7",t:"Customer confidential materials",def:"Don't read, copy or share documents or data on a customer's desk or PC."},
  {d:4,o:"4.7",t:"Be on time",def:"Arrive when promised. If you'll be late, contact the customer beforehand."},
  // 4.8
  {d:4,o:"4.8",t:"Script use cases",def:"Basic automation: restarting machines, remapping network drives, installing applications, automated backups, gathering information, initiating updates."},
  {d:4,o:"4.8",t:"Script risks",def:"Downloaded scripts can introduce malware; mistakes can change system settings or crash systems through runaway resource use. Test first."},
  // 4.9
  {d:4,o:"4.9",t:"MSRA / Quick Assist",def:"Windows Remote Assistance (msra.exe) and Quick Assist: the user invites a tech and stays present to watch the session."},
  {d:4,o:"4.9",t:"Third-party remote tools",def:"Screen-sharing, videoconferencing, file transfer and desktop management software. Vet each one and require MFA."},
  {d:4,o:"4.9",t:"Remote access security",def:"Don't expose RDP to the internet. Use a VPN, MFA, strong passwords, current patches and logging."},
  // 4.10
  {d:4,o:"4.10",t:"AI application integration",def:"AI built into existing tools (Copilot in Office, AI in help desk software)."},
  {d:4,o:"4.10",t:"AI appropriate-use policy",def:"Company rules on which AI tools are allowed and what data can go into them."},
  {d:4,o:"4.10",t:"AI data privacy",def:"Public AI may store prompts and use them for training. Never paste confidential data or PII; use the approved private AI."},
  // audit pass 2
  // audit pass 3: checked against the official 220-1202 objectives (v3.0)
  {d:3,o:"3.3",t:"Limited or no internet (mobile)",def:"Malware can hijack DNS or proxy settings or eat bandwidth, leaving a phone with limited or no connectivity. Check for unknown VPN or proxy profiles and recent apps."},
  {d:1,o:"1.1",t:"Update limitations",def:"Older or unsupported OS versions stop getting feature and security updates, and new apps may drop support for them."},
  {d:1,o:"1.2",t:"Multiboot",def:"Installing two or more OSs on one PC (separate partitions). A boot menu picks which one starts."},
  {d:1,o:"1.2",t:"Product life cycle",def:"Each OS version has a support end date. Plan upgrades before end of support (Windows 10 consumer support ended Oct 14, 2025)."},
  {d:1,o:"1.3",t:"Edition UI differences",def:"Desktop look is the same across editions; Windows 11 adds a centered Start menu, Snap layouts and widgets. Differences are features (BitLocker, RDP host, domain join, gpedit), not style."},
  {d:1,o:"1.7",t:"Shared resources (workgroup vs. domain)",def:"Workgroup: each PC shares its own folders and printers with local accounts. Domain: shares on file and print servers, controlled by AD accounts and groups."},
  {d:1,o:"1.8",t:"macOS system folders",def:"/Applications (installed apps), /Users (home folders), /Library (system-wide settings and support files), /System (core OS, protected), ~/Library = /Users/<name>/Library (per-user settings)."},
  {d:1,o:"1.8",t:"iCloud services",def:"iCloud Drive (file sync), iMessage and FaceTime (messages and calls across Apple devices), photos, Keychain sync and device backups."},
  {d:1,o:"1.10",t:"Downloadable package",def:"Installer downloaded from the vendor or a store (.exe, .msi, .dmg, .pkg). Verify the source and hash."},
  {d:2,o:"2.11",t:"Browser feature management",def:"Enable or disable plug-ins, extensions and features (like autofill or location access) in browser settings, or centrally with Group Policy."},
  {d:4,o:"4.1",t:"Custom software install procedure",def:"An SOP for installing a specific software package the same way every time: steps, settings, licensing and testing."},
  {d:4,o:"4.3",t:"Restore: in-place vs. alternative location",def:"In-place (overwrite) restores to the original location, replacing current files. Alternative location restores to a different folder or drive so you can compare first."},
  {d:4,o:"4.3",t:"Backup frequency",def:"How often you back up sets how much data you can lose. More critical data means more frequent backups."},
  {d:4,o:"4.4",t:"Cable management",def:"Route, label and secure cables so no one trips and airflow stays clear."},
  {d:4,o:"4.4",t:"Electrical fire safety",def:"Cut power if it's safe, use a Class C (CO2) extinguisher, never water. Evacuate if it spreads."},
  {d:4,o:"4.5",t:"Disposal of other devices",def:"Monitors, phones and circuit boards are e-waste. Recycle through certified e-waste vendors per local rules and the SDS."},
  {d:4,o:"4.5",t:"Equipment placement",def:"Keep equipment off the floor, away from heat, water and direct sun, with room for airflow."},
  {d:4,o:"4.6",t:"Mutual NDA (MNDA)",def:"Non-disclosure agreement where BOTH parties agree to protect each other's confidential information."},
  {d:4,o:"4.6",t:"Regulatory and business compliance",def:"Following laws (HIPAA, PCI DSS, GDPR) and internal policies. Non-compliance can mean fines or lost business."},
  {d:4,o:"4.7",t:"Avoid interrupting / judging",def:"Let the customer finish, don't judge how the problem happened, and don't dismiss their concern."},
  {d:4,o:"4.7",t:"Offer repair or replacement options",def:"Explain the choices, costs and timelines so the customer can decide."},
  {d:4,o:"4.7",t:"Document and follow up",def:"Give the customer documentation of the work done, and follow up later to confirm the fix held."},
  {d:4,o:"4.7",t:"Professional appearance",def:"Dress for the environment, use proper language, and avoid personal interruptions while working."},
  {d:2,o:"2.6",t:"Malware removal step 1",def:"Investigate and verify malware symptoms. Confirm it's really malware before acting."},
  {d:2,o:"2.6",t:"Malware removal step 2",def:"Quarantine the infected system: disconnect it from the network so it can't spread."},
  {d:2,o:"2.6",t:"Malware removal step 3",def:"Disable System Restore (Windows) so infected restore points are deleted and can't reinfect the PC."},
  {d:2,o:"2.6",t:"Malware removal step 4",def:"Remediate: update the anti-malware software, then scan and remove (Safe Mode or a preinstallation environment if needed)."},
  {d:2,o:"2.6",t:"Malware removal step 5",def:"Schedule scans and run updates (OS and anti-malware) so it stays clean."},
  {d:2,o:"2.6",t:"Malware removal step 6",def:"Enable System Restore and create a new, clean restore point."},
  {d:2,o:"2.6",t:"Malware removal step 7",def:"Educate the end user on how the infection happened and how to avoid it."},
  {d:2,o:"2.9",t:"Regulatory and environmental disposal rules",def:"Data-privacy laws can require proof of destruction; environmental laws (e-waste) control how hardware is recycled. Follow both."},
  {d:2,o:"2.10",t:"Disable unused router ports",def:"Close unused switch/router ports and firewall ports so attackers can't plug in or connect through them."},
  {d:2,o:"2.11",t:"Browser patching",def:"Keep the browser auto-updating. Most browser attacks target known, already-patched bugs."},
  {d:2,o:"2.11",t:"Valid certificate (secure site)",def:"HTTPS with a padlock and a certificate that's trusted, unexpired and matches the site name. Warnings mean don't enter data."},
  {d:2,o:"2.11",t:"Untrusted extensions / plug-ins",def:"Install add-ons only from the official store and remove ones you don't use. Malicious extensions can read every page."},
  {d:3,o:"3.1",t:"Degraded performance (Windows)",def:"Check Task Manager for CPU, RAM or disk hogs, startup apps, malware, low free space. Fix: add resources (RAM/SSD) or remove the load."},
  {d:3,o:"3.1",t:"Windows fix ladder",def:"Reboot › restart services › update/reinstall the app › verify requirements › add resources › sfc › repair Windows › System Restore › roll back updates › reimage."},
  {d:3,o:"3.1",t:"System instability",def:"Random freezes or crashes. Check recent driver or update changes, Reliability Monitor, RAM (mdsched) and temperatures."},
  {d:3,o:"3.2",t:"App slow to respond",def:"Low storage or RAM, too many background apps, outdated app or OS. Close apps, update, then restart."},
  {d:3,o:"3.3",t:"Rooting (Android)",def:"Gaining root access on Android, the equivalent of jailbreaking iOS. Removes security sandboxing; usually blocked by MDM."},
  {d:3,o:"3.3",t:"Unexpected app behavior",def:"Apps opening by themselves, new permissions or settings changing: possible malware or a spoofed app."},
  {d:3,o:"3.4",t:"Unable to access the network",def:"Malware can change DNS, proxy or firewall settings to cut access or redirect traffic. Check them after ruling out hardware."},
  {d:4,o:"4.6",t:"Valid, non-expired licenses",def:"Every installed copy needs a current license. Track expiration dates in asset management and renew before they lapse."},
  {d:4,o:"4.7",t:"Positive attitude",def:"Project confidence, stay calm, and focus on the fix rather than blame."}
);

EXAM.push(
  // ---- Domain 1 ----
  {d:1,o:"1.1",q:"A school wants cheap, low-maintenance laptops for students that update automatically and do almost everything in a browser and Google's cloud apps. Which OS fits best?",c:["Windows 11 Pro","ChromeOS","macOS","Ubuntu Server"],a:1,why:"ChromeOS is built for browser and cloud work, updates itself and is easy to manage centrally.",key:"ChromeOS (Chromebooks).",kw:[["chrome"]]},
  {d:1,o:"1.1",q:"A user needs one USB flash drive that both their Windows PC and Mac can read AND write, with files larger than 4 GB. How should it be formatted?",c:["NTFS","FAT32","exFAT","APFS"],a:2,why:"exFAT is read/write on Windows and macOS and has no 4 GB file limit. macOS can't write NTFS natively, FAT32 caps files at 4 GB, and Windows can't read APFS.",key:"exFAT.",kw:[["exfat"]]},
  {d:1,o:"1.1",q:"A clinic still runs a PC on an OS that reached end of life last year. What is the main security problem?",c:["It can't connect to Wi-Fi","It no longer receives security patches","Its license becomes illegal","It can't run Office"],a:1,why:"After EOL the vendor stops releasing security updates, so new vulnerabilities stay open.",key:"No more security patches after end of life.",kw:[["patch","update","security"]]},
  {d:1,o:"1.2",q:"Windows Setup on a new server-grade PC doesn't list any drives to install on. The disks sit behind a RAID controller. What should the technician do?",c:["Convert the disk to MBR","Use Load driver to add the RAID controller's storage driver","Run chkdsk /r","Boot from PXE instead"],a:1,why:"Setup lacks the third-party storage driver. Load driver lets you supply it from USB.",key:"Click Load driver and supply the third-party RAID/storage controller driver.",kw:[["driver"]]},
  {d:1,o:"1.2",q:"An IT team must set up 60 identical PCs with the OS, apps and settings already configured. Which method is MOST efficient?",c:["Clean install from USB on each PC","Image deployment from a sysprepped reference image","Repair installation","In-place upgrade on each PC"],a:1,why:"Capture one configured reference image (after Sysprep) and deploy it to all 60.",key:"Image deployment of a sysprepped reference image (often over the network).",kw:[["image"]]},
  {d:1,o:"1.2",q:"Before an in-place upgrade to a new Windows version, which TWO steps should come first? (Choose two.)",c:["Back up user files and preferences","Confirm apps and drivers are compatible with the new version","Delete the recovery partition","Disable the firewall","Convert the disk to MBR"],a:[0,1],why:"Upgrade prep: back up data, and check application, driver and hardware compatibility.",key:"Back up files/preferences and check app, driver and hardware compatibility.",kw:[["back"],["compat","driver","support"]]},
  {d:1,o:"1.3",q:"A video editor's PC needs 512 GB of RAM. It runs Windows 11 Home. What's the problem?",c:["Home supports up to 128 GB of RAM","Home only supports 4 GB","Home supports 2 TB, so there's no problem","RAM limits only apply to 32-bit Pro"],a:0,why:"Windows 11 Home tops out at 128 GB. Pro supports 2 TB, Pro for Workstations and Enterprise 6 TB.",key:"Home is capped at 128 GB; upgrade to Pro (2 TB) or higher.",kw:[["128"]]},
  {d:1,o:"1.5",q:"A technician needs to copy the folder D:\\Projects, including all subfolders and empty folders, to E:\\Backup using a classic Windows command (not robocopy). Which command does this?",c:["copy D:\\Projects E:\\Backup","xcopy D:\\Projects E:\\Backup /e","move D:\\Projects E:\\Backup","md E:\\Backup\\Projects"],a:1,why:"xcopy /e copies the folder tree including empty subfolders. copy handles files only.",key:"xcopy D:\\Projects E:\\Backup /e",kw:[["xcopy"],["/e"]]},
  {d:1,o:"1.5",q:"A remote user is on the phone and needs to tell you their computer's name. Which command shows it?",c:["whoami","hostname","winver","ipconfig /release"],a:1,why:"hostname prints the computer name. whoami shows the signed-in user, winver the Windows version.",key:"hostname",kw:[["hostname"]]},
  {d:1,o:"1.6",q:"A user wants to change their desktop background and lock screen picture. Which Windows Settings section should they open?",c:["System","Personalization","Accounts","Apps"],a:1,why:"Personalization covers background, colors, lock screen, themes, Start and taskbar.",key:"Settings › Personalization.",kw:[["personali"]]},
  {d:1,o:"1.6",q:"A laptop on a hotel Wi-Fi is set to a Private network profile. Where in Windows Settings do you switch it to Public?",c:["Network & Internet","Privacy","Accounts","Time & Language"],a:0,why:"Network & Internet › Wi-Fi › the network's properties holds the Public/Private network profile.",key:"Settings › Network & Internet, then the connection's properties.",kw:[["network"]]},
  {d:1,o:"1.7",q:"A payroll app needs to accept connections on the office network, but the firewall blocks it. What is the BEST fix?",c:["Turn off Windows Defender Firewall","Add the app as an exception for Private networks","Open every port on the Public profile","Set the network to Public"],a:1,why:"'Allow an app through Windows Firewall' scopes access to that program on the right profile. Disabling the firewall is never the best answer.",key:"Create a firewall exception for that app on Private (domain) networks.",kw:[["exception","allow"]]},
  {d:1,o:"1.7",q:"A user wants to open the Finance share on server FS01 directly in File Explorer. What should they type?",c:["http://FS01/Finance","\\\\FS01\\Finance","FS01:/Finance","//Finance/FS01"],a:1,why:"Windows network paths use UNC format: \\\\server\\share.",key:"\\\\FS01\\Finance",kw:[["fs01"]]},
  {d:1,o:"1.8",q:"A new Mac user asks how to see all open windows and desktops at once using the trackpad. Where would you point them?",c:["Keychain Access","Trackpad gestures for Mission Control (e.g., three-finger swipe up)","FileVault","Disk Utility"],a:1,why:"Mission Control shows all windows and desktops, and trackpad gestures (System Settings › Trackpad) open it.",key:"Mission Control via a trackpad gesture (three/four-finger swipe up).",kw:[["mission"]]},
  {d:1,o:"1.9",q:"A Linux PC shows a menu at startup listing two kernel versions before the OS loads. Which component provides that menu?",c:["systemd","The bootloader (GRUB)","/etc/fstab","The kernel"],a:1,why:"GRUB is the bootloader. It loads the chosen kernel, which then starts systemd.",key:"The bootloader (GRUB).",kw:[["grub","boot"]]},
  {d:1,o:"1.9",q:"Why should Linux admins avoid logging in directly as root for daily work?",c:["Root can't run sudo","Mistakes or malware run with unlimited privileges, and actions aren't tied to a named user","Root can't use the GUI","Root expires after 30 days"],a:1,why:"Root (UID 0) can do anything. Using a normal account plus sudo limits damage and logs who ran what.",key:"Root has unlimited rights; use a normal account and sudo for least privilege and accountability.",kw:[["privilege","sudo","unlimited"]]},
  {d:1,o:"1.10",q:"A company plans to deploy a new 3 GB application to 200 PCs during business hours. Which impact is the BIGGEST concern?",c:["Device impact on the monitors","Network impact from 600 GB of downloads at once","Business impact on the logo","Operation impact on printer toner"],a:1,why:"Mass downloads saturate bandwidth. Schedule off-hours or use a local distribution point.",key:"Network impact (bandwidth); schedule after hours or stage locally.",kw:[["network","bandwidth"]]},
  {d:1,o:"1.10",q:"A 64-bit engineering application won't install on an older PC. Which is the MOST likely reason?",c:["The PC runs a 32-bit OS","The monitor is too small","The PC has an SSD","The user is a standard account"],a:0,why:"A 64-bit app needs a 64-bit OS (and CPU). 32-bit apps can run on 64-bit Windows, not the other way round.",key:"The OS is 32-bit; 64-bit apps need a 64-bit OS.",kw:[["32"]]},
  {d:1,o:"1.11",q:"A new hire can sign in to Microsoft 365 but has no Outlook mailbox or Teams. What did the admin MOST likely forget?",c:["Assign a Microsoft 365 license to the user","Run gpupdate","Join the PC to a workgroup","Enable BitLocker"],a:0,why:"Cloud services are licensed per user. With no license assigned, the account exists but gets no mailbox or apps.",key:"Assign the user a Microsoft 365 license.",kw:[["licen"]]},
  {d:1,o:"1.11",q:"A user's laptop is low on space because OneDrive downloads every file. Which setting helps MOST?",c:["Turn off Windows Update","Files On-Demand, so files stay in the cloud until opened","Format the drive to FAT32","Disable the recycle bin"],a:1,why:"Files On-Demand (or choosing which folders sync) keeps placeholders locally and saves disk space.",key:"Enable Files On-Demand or limit which folders sync.",kw:[["demand","sync","folder"]]},
  // ---- Domain 2 ----
  {d:2,o:"2.1",q:"A data center wants to know exactly who entered the server room and when, using the employees' ID cards. What should be installed?",c:["Bollards","A badge reader with access logging","A magnetometer","Motion-activated lighting"],a:1,why:"Badge readers control entry and log each card swipe with a timestamp.",key:"A badge reader (with access logs).",kw:[["badge"]]},
  {d:2,o:"2.1",q:"Which TWO are biometric authentication methods? (Choose two.)",c:["Retina scan","Voice recognition","Key fob","Smart card","PIN"],a:[0,1],why:"Biometrics are 'something you are': retina, fingerprint, palm, face, voice. Fobs and smart cards are 'something you have'; a PIN is 'something you know'.",key:"Retina scan and voice recognition (also fingerprint, palm, face).",kw:[["retina"],["voice"]]},
  {d:2,o:"2.1",q:"Laptops keep disappearing from a shared training room during the day. Which control is the simplest fix?",c:["Cable locks on each laptop","A fence around the building","Zero trust","Longer passwords"],a:0,why:"Equipment (cable) locks physically secure devices in shared areas.",key:"Equipment/cable locks.",kw:[["lock","cable"]]},
  {d:2,o:"2.2",q:"A user needs to install software once but shouldn't be an admin day to day. Which approach follows least privilege?",c:["Add them to Administrators permanently","Keep a standard account; an admin approves the UAC prompt with admin credentials","Enable the Guest account","Add them to Power Users"],a:1,why:"Standard account for daily work; elevate only when needed through UAC. Power Users has no extra rights on modern Windows.",key:"Keep them standard; an admin enters credentials at the UAC prompt (Run as administrator).",kw:[["standard","uac","credential"]]},
  {d:2,o:"2.2",q:"Every user in Sales needs a personal network drive (H:) mapped when they sign in. Where is this set in Active Directory?",c:["The user's Profile tab: home folder (and/or logon script)","The OU's Delegation tab","Local Users and Groups","Device Manager"],a:0,why:"In AD Users and Computers, the Profile tab sets the home folder drive and the logon script.",key:"User properties › Profile tab › Home folder (or a logon script / GPO).",kw:[["home","profile","logon","login"]]},
  {d:2,o:"2.2",q:"A sales rep carries client files on a USB flash drive. Which feature encrypts the drive with no third-party software?",c:["EFS","BitLocker To Go","FileVault","NTFS compression"],a:1,why:"BitLocker To Go encrypts removable drives. EFS encrypts individual files on NTFS, and FileVault is macOS.",key:"BitLocker To Go.",kw:[["to go"]]},
  {d:2,o:"2.2",q:"A user wants to sign in to Windows with their face instead of a password. Which feature provides this?",c:["Windows Hello","Credential Manager","SSO","UAC"],a:0,why:"Windows Hello supports facial recognition, fingerprint and PIN, which enables passwordless sign-in.",key:"Windows Hello (facial recognition).",kw:[["hello"]]},
  {d:2,o:"2.4",q:"A PC's boot sector is infected and Windows won't start. Which tool lets you run bootrec and remove the infection?",c:["Task Manager","Windows Recovery Environment (recovery console)","Event Viewer","msconfig"],a:1,why:"WinRE's command prompt runs offline: bootrec /fixmbr and /fixboot, and offline scans.",key:"Windows Recovery Environment (recovery console) with bootrec / offline scanning.",kw:[["recovery","winre","bootrec"]]},
  {d:2,o:"2.4",q:"Several staff keep clicking malicious links in emails. Which control addresses the ROOT cause?",c:["Reinstall Windows on their PCs","Anti-phishing user education and training","Disable USB ports","Upgrade to WPA3"],a:1,why:"The cause is user behavior, so training addresses it. Email gateways help, but people still need to recognize phishing.",key:"Anti-phishing training / user education.",kw:[["train","educat"]]},
  {d:2,o:"2.5",q:"A sticker over a restaurant's menu QR code sends diners to a fake payment site. What is this?",c:["Vishing","QR code phishing","Evil twin","Whaling"],a:1,why:"QR code phishing (quishing) uses a malicious QR code to lead victims to a phishing site.",key:"QR code phishing (quishing).",kw:[["qr"]]},
  {d:2,o:"2.5",q:"Which TWO are vulnerabilities rather than attacks? (Choose two.)",c:["A PC missing six months of patches","A laptop with antivirus and firewall disabled","Tailgating","SQL injection","Vishing"],a:[0,1],why:"Unpatched and unprotected systems are weaknesses. Tailgating, SQL injection and vishing are attacks that exploit weaknesses.",key:"Unpatched systems and unprotected systems (no AV/firewall).",kw:[["patch"],["antivirus","firewall","unprotected"]]},
  {d:2,o:"2.7",q:"Which policy BEST stops attackers from guessing passwords over and over?",c:["Account lockout after several failed attempts","Password expiration every 7 days","Disabling AutoRun","Login time restrictions"],a:0,why:"Lockout after failed attempts directly blocks brute-force and guessing.",key:"Account lockout after a set number of failed logins.",kw:[["lockout","lock"]]},
  {d:2,o:"2.7",q:"Office PCs are left signed in when people go to lunch. Which TWO controls help? (Choose two.)",c:["Screensaver lock with password after inactivity","Train users to press Win+L when leaving","Disable the Guest account","Enable UPnP","Use FAT32"],a:[0,1],why:"Automatic screen lock plus the habit of locking (Win+L) protect unattended PCs.",key:"Auto screen lock (screensaver password) and locking manually with Win+L.",kw:[["screen","saver","lock"],["win+l","lock"]]},
  {d:2,o:"2.7",q:"A new batch of workstations all have the same default local administrator password. What should be done FIRST?",c:["Change the default admin password (and rename or disable the account)","Enable the Guest account","Disable Windows Update","Install a screensaver"],a:0,why:"Default credentials are well known. Change them before deployment.",key:"Change the default administrator password (rename/disable the account).",kw:[["change","default","password"]]},
  {d:2,o:"2.8",q:"An employee's personal phone is enrolled with a work profile. They quit. What should IT wipe?",c:["The entire phone","Only the corporate work profile and its data","Nothing, it's personal","The SIM card"],a:1,why:"With BYOD, MDM removes only corporate data and apps. A full wipe is for corporate-owned devices.",key:"Only the corporate/work profile (selective wipe).",kw:[["work","corporate","profile","selective"]]},
  {d:2,o:"2.8",q:"A user left their phone in a taxi. Which feature helps find it, and erase it if it can't be recovered?",c:["A locator app such as Find My","Developer mode","Rotation lock","NFC"],a:0,why:"Locator apps show location, play a sound, lock and remote-wipe.",key:"A locator app (Find My / Find My Device) with remote lock and wipe.",kw:[["find","locat"]]},
  {d:2,o:"2.9",q:"A technician quick-formats a hard drive before donating the PC. Why is this NOT enough?",c:["Quick format only rebuilds the file table, so the data can be recovered","Quick format destroys the drive","Quick format only works on SSDs","Donations require NTFS"],a:0,why:"Standard (quick) format leaves the data on the platters. Wipe or overwrite the drive, or destroy it.",key:"A quick/standard format leaves data recoverable; use a wipe/overwrite tool.",kw:[["recover"]]},
  {d:2,o:"2.9",q:"A company outsources disposal of 300 old drives. What should it get from the vendor?",c:["A certificate of destruction","An EULA","An SLA for uptime","A restore point"],a:0,why:"A certificate of destruction proves the drives were destroyed. Keep it for audits.",key:"A certificate of destruction.",kw:[["certificate"]]},
  {d:2,o:"2.10",q:"A family wants visitors to have internet access without seeing their NAS or smart TV. What should be configured on the router?",c:["A guest network","Port forwarding","UPnP","A screened subnet for the NAS"],a:0,why:"Guest networks isolate visitors from internal devices.",key:"A guest Wi-Fi network (client isolation).",kw:[["guest"]]},
  {d:2,o:"2.10",q:"Which TWO steps harden a new SOHO router's management? (Choose two.)",c:["Change the default admin password","Disable remote (WAN-side) administration","Enable UPnP","Broadcast the default SSID","Turn off firmware updates"],a:[0,1],why:"Change default credentials and manage only from inside (HTTPS). UPnP and default SSIDs weaken security.",key:"Change the default admin password and disable WAN-side remote management.",kw:[["password"],["remote","wan"]]},
  {d:2,o:"2.11",q:"A website keeps showing an old version of a page after the company updated it. What should the user try FIRST?",c:["Clear the browser cache","Disable the pop-up blocker","Install an extension","Reinstall Windows"],a:0,why:"A stale cache serves old files. Clearing the cache (or a hard refresh) loads the new version.",key:"Clear the browser cache (or hard refresh).",kw:[["cache"]]},
  {d:2,o:"2.11",q:"A user finds a 'faster' version of a popular browser on a file-sharing site. What's the risk?",c:["None if it's free","Untrusted sources can bundle malware; download from the vendor and verify the hash","It will only work in private browsing","It disables HTTPS"],a:1,why:"Install browsers only from trusted sources, and verify downloads with the published hash.",key:"Untrusted source may contain malware; get it from the official vendor and check the hash.",kw:[["trust","vendor","official","hash"]]},
  // ---- Domain 3 ----

/* spread the correct answers across A–E with a fixed (deterministic) reorder, so positions never give the answer away.
   Applies to the whole bank: the original questions leaned heavily on B. */
EXAM.forEach((q, n) => {
  const len = q.c.length, perm = [...Array(len).keys()];
  let seed = 7 + n * 131;
  for (let i = len - 1; i > 0; i--) { seed = (seed * 1103515245 + 12345) % 2147483648; const j = seed % (i + 1); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const c = perm.map(i => q.c[i]), m = old => perm.indexOf(old);
  q.c = c; q.a = Array.isArray(q.a) ? q.a.map(m).sort((x, y) => x - y) : m(q.a);
});
