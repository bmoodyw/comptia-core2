<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Core 2 Drill Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: answer-sheet workspace. Sticky tab rail on top, one centered 960px column, bubbles + mono for the exam-room feel. */
:root{
  --paper:#f3f5f8; --card:#ffffff; --ink:#14202c; --muted:#56657a; --line:#d5dce6; --wash:#e8edf4;
  --accent:#1d47c9; --accent-ink:#ffffff; --accent-soft:#e3eafd;
  --good:#17784a; --good-soft:#e0f3e8; --bad:#b8321c; --bad-soft:#fbe6e1; --warn:#9a5800; --warn-soft:#fbefd9;
  --d1:#1d47c9; --d2:#b42318; --d3:#a35200; --d4:#0b6e83;
  --term-bg:#101a26; --term-fg:#d8e3ef; --term-dim:#7d8fa5; --term-hi:#8fd0ff;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e141b; --card:#151d27; --ink:#e4eaf2; --muted:#94a3b6; --line:#28323f; --wash:#1b2430;
  --accent:#7ea2ff; --accent-ink:#0b1220; --accent-soft:#1c2a4a;
  --good:#53c48d; --good-soft:#123326; --bad:#ff8a73; --bad-soft:#3a1a14; --warn:#f1ac4b; --warn-soft:#3a2a10;
  --d1:#86a6ff; --d2:#ff8c7d; --d3:#f3ad55; --d4:#5cc6db;
  --term-bg:#070c12; --term-fg:#d8e3ef; --term-dim:#7d8fa5; --term-hi:#8fd0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e141b; --card:#151d27; --ink:#e4eaf2; --muted:#94a3b6; --line:#28323f; --wash:#1b2430;
  --accent:#7ea2ff; --accent-ink:#0b1220; --accent-soft:#1c2a4a;
  --good:#53c48d; --good-soft:#123326; --bad:#ff8a73; --bad-soft:#3a1a14; --warn:#f1ac4b; --warn-soft:#3a2a10;
  --d1:#86a6ff; --d2:#ff8c7d; --d3:#f3ad55; --d4:#5cc6db;
  --term-bg:#070c12; --term-fg:#d8e3ef; --term-dim:#7d8fa5; --term-hi:#8fd0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* masthead */
.mast{background:var(--card);border-bottom:1px solid var(--line)}
.mast .wrap{padding-block:20px 14px;display:grid;gap:12px}
.mast h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.mast h1 small{display:block;font-family:var(--f-mono);font-size:.78rem;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:none;margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.86rem;color:var(--muted)}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.wbar{display:flex;height:26px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.wbar span{display:flex;align-items:center;padding:0 8px;font:600 .72rem/1 var(--f-mono);color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.wbar .w1{background:var(--d1)}.wbar .w2{background:var(--d2)}.wbar .w3{background:var(--d3)}.wbar .w4{background:var(--d4)}
:root[data-theme="dark"] .wbar span{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wbar span{color:#0b1220}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 12px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:600 .7rem var(--f-mono);background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:9px;margin-left:4px}

main .wrap{padding-block:20px 60px;display:grid;gap:18px}
main .wrap>*,section>*{min-width:0}
section{display:grid;gap:12px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--wash);font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;flex:1 1 auto;background:none;padding:7px 13px;cursor:pointer;font-size:.9rem}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,26px);min-width:0}
.tag{display:inline-flex;gap:6px;align-items:center;font:600 .72rem var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.tag .dd{color:#fff;padding:2px 7px;border-radius:4px}
:root[data-theme="dark"] .tag .dd{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag .dd{color:#0b1220}}
.dd.d1{background:var(--d1)}.dd.d2{background:var(--d2)}.dd.d3{background:var(--d3)}.dd.d4{background:var(--d4)}
.score{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
.prompt{font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.4;margin:10px 0 16px;font-weight:700}
.prompt.term{font-family:var(--f-mono);font-size:clamp(1.3rem,3.6vw,1.9rem)}

/* answer bubbles */
.opts{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:11px 13px;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:700 .78rem var(--f-mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--muted);background:var(--wash);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:14px}
.fb.good{border-color:var(--good);background:var(--good-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.part{border-color:var(--warn);background:var(--warn-soft)}
.fb b.v{font-family:var(--f-display);font-stretch:85%;font-size:1.05rem;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
input.txt,textarea.txt{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px}
input.txt:focus,textarea.txt:focus{border-color:var(--accent);outline:none}
textarea.txt{min-height:110px;resize:vertical}

/* matching */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px;text-align:left;cursor:pointer;line-height:1.35;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.mi.t{font-family:var(--f-mono);font-weight:600}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{border-color:var(--good);background:var(--good-soft);opacity:.75;cursor:default}
.mi.miss{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mi.miss{animation:none}}
@media (max-width:560px){.match{grid-template-columns:1fr}}

/* terminal */
.term{background:var(--term-bg);color:var(--term-fg);border-radius:10px;padding:16px;font:14px/1.6 var(--f-mono);overflow-x:auto}
.term .dim{color:var(--term-dim)}
.term .hi{color:var(--term-hi)}
.term .line{display:flex;gap:8px;align-items:center;margin-top:8px}
.term .ps{color:var(--term-hi);white-space:nowrap}
.term input{flex:1;min-width:0;background:transparent;border:0;color:var(--term-fg);font:inherit;outline:none;caret-color:var(--term-hi)}
.term pre{margin:0;white-space:pre-wrap;word-break:break-word}

/* exam */
.qnav{display:flex;flex-wrap:wrap;gap:4px}
.qnav button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font:600 .72rem var(--f-mono);cursor:pointer}
.qnav button.ans{background:var(--wash);border-color:var(--muted)}
.qnav button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qnav button.flag{border-color:var(--warn);border-style:dashed}
.timer{font:700 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.big{font:800 clamp(2.6rem,9vw,4rem)/1 var(--f-display);font-stretch:75%;font-variant-numeric:tabular-nums}
.pass{color:var(--good)}.fail{color:var(--bad)}
.setup{display:grid;gap:14px}
.note{font-size:.88rem;color:var(--muted)}
.aistate{font:600 .78rem var(--f-mono);padding:3px 9px;border-radius:999px;background:var(--wash);color:var(--muted)}
.aistate.on{background:var(--good-soft);color:var(--good)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--wash);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);white-space:nowrap}
.sev{font:700 .7rem var(--f-mono);padding:2px 8px;border-radius:4px;white-space:nowrap;display:inline-block}
.sev.Wrong{background:var(--bad-soft);color:var(--bad)}
.sev.Outdated{background:var(--warn-soft);color:var(--warn)}
.sev.Imprecise,.sev.Mislabel{background:var(--accent-soft);color:var(--accent)}
.sev.Gap,.sev.Incomplete{background:var(--warn-soft);color:var(--warn);outline:1px dashed var(--warn)}
.sev.Typo,.sev.Off-objective{background:var(--wash);color:var(--muted)}
.meter{height:8px;background:var(--wash);border-radius:4px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
details.rev{border-top:1px solid var(--line);padding:10px 0}
details.rev summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
details.rev summary .mk{font:700 .8rem var(--f-mono);min-width:22px}
a{color:var(--accent)}
.chip .sn{display:none}
@media (max-width:560px){.chip .fn{display:none}.chip .sn{display:inline}}
@media (max-width:640px){.errt thead{display:none}.errt tr{display:block;padding:12px 14px;border-bottom:1px solid var(--line)}.errt td{display:inline-block;border:0;padding:2px 8px 2px 0}.errt td.said,.errt td.fix{display:block;padding:4px 0}.errt td.said{color:var(--muted)}.errt td.said::before{content:"Notes: ";font-weight:700}.errt td.fix::before{content:"Fix: ";font-weight:700}}

/* PBQ windows */
.pbqpick{display:flex;flex-wrap:wrap;gap:6px}
.brief{white-space:pre-line;margin:0 0 14px;max-width:70ch}
.win{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.wintitle{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--wash);border-bottom:1px solid var(--line);padding:7px 12px;font:600 .8rem var(--f-mono);color:var(--muted)}
.wbtns{display:flex;gap:5px}.wbtns i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--muted);display:block}
.winbody{padding:12px 14px;display:grid;gap:4px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:0}
.frow>label{font-size:.93rem;font-weight:700}
.fctl{display:flex;gap:8px;align-items:center;min-width:0}
.fctl select,.fctl input:not([type=checkbox]){flex:1;min-width:0;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px}
.fctl select:focus,.fctl input:focus{border-color:var(--accent);outline:none}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono)}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.fmark{font:800 1.1rem var(--f-mono);width:22px;text-align:center}
.fmark.y{color:var(--good)}.fmark.n{color:var(--bad)}
.fwhy{grid-column:1/-1;font-size:.86rem;padding:6px 10px;border-radius:6px;background:var(--wash)}
.fwhy.n{background:var(--bad-soft)}.fwhy.y{background:var(--good-soft)}
@media (max-width:600px){.frow{grid-template-columns:1fr}}
ol.order{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.order li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
ol.order li.y{border-color:var(--good);background:var(--good-soft)}ol.order li.n{border-color:var(--bad);background:var(--bad-soft)}
.on{font:700 .8rem var(--f-mono);color:var(--muted);text-align:center}
.ob{display:flex;gap:4px}.ob button{width:34px;height:34px;border:1.5px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;font-size:.8rem}
.ob button:disabled{opacity:.3;cursor:default}
/* scenarios */
.ticket{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.ticket p{margin:4px 0 0}
.pickm{display:none}
@media (max-width:600px){.pbqpick{display:none}.pickm{display:block}.term{font-size:12px;padding:12px}}
.term.tall pre{white-space:pre}
.term.tall{max-height:440px;min-height:220px;overflow-y:auto;cursor:text}
.term pre{margin:0 0 6px}
.term pre .ps{color:var(--term-hi)}
.term .dim{white-space:pre-line;margin-bottom:8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.confirm{display:inline-flex;gap:8px;align-items:center}
</style>

<script>
/* ===== DATA: every item tagged with domain (d) and objective (o) per CompTIA 220-1202 v3.0 ===== */
const DOMAINS = {
  1: { name: "Operating Systems", short: "OS", w: 28 },
  2: { name: "Security", short: "Security", w: 28 },
  3: { name: "Software Troubleshooting", short: "Troubleshooting", w: 23 },
  4: { name: "Operational Procedures", short: "Ops", w: 21 }
};

/* Flashcards: t = term (typed answer), alt = also-accepted answers, def = definition */
const CARDS = [
  // 1.1 File systems
  {d:1,o:"1.1",t:"NTFS",def:"Windows file system with file/folder permissions, EFS encryption, quotas, compression and journaling."},
  {d:1,o:"1.1",t:"ReFS",alt:["Resilient File System"],def:"Microsoft's Resilient File System: integrity checks and self-repair for very large volumes; Windows Server, Pro for Workstations and Enterprise."},
  {d:1,o:"1.1",t:"FAT32",def:"Legacy, widely compatible file system with a 4 GB maximum file size."},
  {d:1,o:"1.1",t:"exFAT",def:"Flash-drive file system that supports files larger than 4 GB and reads/writes on Windows, macOS and Linux."},
  {d:1,o:"1.1",t:"ext4",def:"Fourth extended file system: the common journaling file system on Linux and Android."},
  {d:1,o:"1.1",t:"XFS",def:"High-performance 64-bit journaling Linux file system built for very large volumes (default on RHEL)."},
  {d:1,o:"1.1",t:"APFS",alt:["Apple File System"],def:"Apple File System: SSD-optimized, with snapshots and native encryption; default since macOS 10.13 High Sierra."},
  // 1.2 Installs
  {d:1,o:"1.2",t:"GPT",alt:["GUID Partition Table"],def:"Partition style that needs UEFI to boot Windows, allows 128 partitions in Windows and removes the 2 TB limit."},
  {d:1,o:"1.2",t:"MBR",alt:["Master Boot Record"],def:"Legacy partition style: up to 4 primary partitions (or 3 + 1 extended) and a 2 TB partition limit."},
  {d:1,o:"1.2",t:"PXE",alt:["Preboot Execution Environment","Pixie"],def:"Network boot used to start an OS installation from a deployment server with no local media."},
  {d:1,o:"1.2",t:"In-place upgrade",alt:["inplace upgrade","upgrade"],def:"Install a newer OS from inside the running OS, keeping applications, files and settings."},
  {d:1,o:"1.2",t:"Clean install",def:"Wipe the drive and install the OS fresh; boot from the installation media and restore data from backup."},
  {d:1,o:"1.2",t:"Repair installation",alt:["repair install"],def:"Reinstall Windows system files to fix OS problems without touching user files."},
  {d:1,o:"1.2",t:"Zero-touch deployment",alt:["zero touch","zero-touch"],def:"Fully automated, company-configured install: ship a new laptop to the user and it configures itself at first boot."},
  {d:1,o:"1.2",t:"Recovery partition",def:"Hidden partition that holds the OEM's installation/restore files."},
  {d:1,o:"1.2",t:"TPM 2.0",alt:["TPM","Trusted Platform Module"],def:"Motherboard security chip required by Windows 11; used by BitLocker and Windows Hello. Check with tpm.msc."},
  {d:1,o:"1.2",t:"Feature update",def:"Windows update delivered about once a year that adds new functionality (vs. monthly quality updates)."},
  // 1.3 Editions
  {d:1,o:"1.3",t:"Windows 11 Pro",alt:["Pro","Windows Pro"],def:"Lowest Windows edition that can join an AD domain and includes BitLocker, gpedit.msc, Hyper-V and the Remote Desktop host."},
  {d:1,o:"1.3",t:"Windows 10 Pro for Workstations",alt:["Pro for Workstations"],def:"Edition for high-end desktops: up to 4 CPUs, up to 6 TB RAM and ReFS support."},
  {d:1,o:"1.3",t:"Windows Enterprise",alt:["Enterprise"],def:"Volume-licensed edition with AppLocker, BranchCache and granular UX control for large organizations."},
  {d:1,o:"1.3",t:"N edition",alt:["N editions","Windows N","N version"],def:"European Windows editions without Windows Media Player; add it later with the Media Feature Pack."},
  {d:1,o:"1.3",t:"Device Encryption",def:"Windows 11 Home's consumer full-disk encryption; the recovery key is stored in the Microsoft account."},
  {d:1,o:"1.3",t:"EFS",alt:["Encrypting File System"],def:"NTFS feature that encrypts individual files and folders per user; not in Home editions."},
  {d:1,o:"1.3",t:"BitLocker",def:"Full-volume encryption (including the OS) in Pro/Enterprise; BitLocker To Go covers removable drives."},
  // 1.4 Tools
  {d:1,o:"1.4",t:"Ctrl+Shift+Esc",alt:["ctrl shift esc","ctrl-shift-esc"],def:"Keyboard shortcut that opens Task Manager directly."},
  {d:1,o:"1.4",t:"eventvwr.msc",alt:["Event Viewer"],def:"Event Viewer: Application, Security, Setup and System logs with Information, Warning, Error and Critical levels."},
  {d:1,o:"1.4",t:"diskmgmt.msc",alt:["Disk Management"],def:"Disk Management: initialize disks, create/extend/shrink partitions, assign drive letters."},
  {d:1,o:"1.4",t:"taskschd.msc",alt:["Task Scheduler"],def:"Task Scheduler: run an application or script on a schedule or trigger."},
  {d:1,o:"1.4",t:"devmgmt.msc",alt:["Device Manager"],def:"Device Manager: update, roll back, disable or uninstall hardware drivers."},
  {d:1,o:"1.4",t:"certmgr.msc",alt:["Certificate Manager"],def:"Certificate Manager: view, add and remove the current user's certificates."},
  {d:1,o:"1.4",t:"lusrmgr.msc",alt:["Local Users and Groups"],def:"Local Users and Groups: manage local accounts and group membership (not on Home)."},
  {d:1,o:"1.4",t:"perfmon.msc",alt:["Performance Monitor"],def:"Performance Monitor: collect long-term counters, data collector sets, alerts and reports."},
  {d:1,o:"1.4",t:"gpedit.msc",alt:["Group Policy Editor","Local Group Policy Editor"],def:"Local Group Policy Editor for the single machine (domain GPOs use gpmc.msc)."},
  {d:1,o:"1.4",t:"msinfo32.exe",alt:["msinfo32","System Information"],def:"System Information: hardware resources, components and software environment summary."},
  {d:1,o:"1.4",t:"resmon.exe",alt:["resmon","Resource Monitor"],def:"Resource Monitor: detailed real-time CPU, memory, disk and network use per process."},
  {d:1,o:"1.4",t:"msconfig.exe",alt:["msconfig","System Configuration"],def:"System Configuration: boot options (Safe boot), services and diagnostic startup."},
  {d:1,o:"1.4",t:"cleanmgr.exe",alt:["cleanmgr","Disk Cleanup"],def:"Disk Cleanup: remove temporary and unneeded files to free space."},
  {d:1,o:"1.4",t:"dfrgui.exe",alt:["dfrgui","Defragment and Optimize Drives"],def:"Defragment and Optimize Drives: defrags HDDs and runs TRIM on SSDs."},
  {d:1,o:"1.4",t:"regedit.exe",alt:["regedit","Registry Editor"],def:"Registry Editor: view and edit the hierarchical Windows configuration database. Back it up first."},
  // 1.5 Windows CLI
  {d:1,o:"1.5",t:"ipconfig /all",def:"Show full IP configuration including MAC, DHCP server, DNS servers and lease times."},
  {d:1,o:"1.5",t:"pathping",def:"Windows tool that traces the route, then measures latency and packet loss at each hop."},
  {d:1,o:"1.5",t:"tracert",def:"Windows route tracer: uses ICMP TTL-exceeded replies to list each router hop."},
  {d:1,o:"1.5",t:"netstat",def:"Show active connections and listening ports; -a all, -n numeric, -b owning executable (admin)."},
  {d:1,o:"1.5",t:"nslookup",def:"Query DNS servers for name/IP records from Windows (dig is the Linux equivalent)."},
  {d:1,o:"1.5",t:"net use",def:"Map or disconnect a network share to a drive letter, e.g. net use H: \\\\server\\share."},
  {d:1,o:"1.5",t:"net user",def:"View or manage user accounts; add /domain to act on domain accounts (e.g. reset a password)."},
  {d:1,o:"1.5",t:"gpupdate /force",alt:["gpupdate"],def:"Reapply all Group Policy settings immediately instead of waiting for the refresh interval."},
  {d:1,o:"1.5",t:"gpresult /r",alt:["gpresult"],def:"Show the Resultant Set of Policy: which GPOs applied to the computer and user."},
  {d:1,o:"1.5",t:"sfc /scannow",alt:["sfc"],def:"System File Checker: scan and repair protected Windows system files."},
  {d:1,o:"1.5",t:"chkdsk /r",alt:["chkdsk"],def:"Locate bad sectors and recover readable data (implies /f, which fixes logical file system errors)."},
  {d:1,o:"1.5",t:"robocopy",def:"Robust File Copy: resumable copies of whole folder trees; /MIR mirrors source to destination."},
  {d:1,o:"1.5",t:"diskpart",def:"Interactive command-line disk partitioning tool. Mistakes erase data."},
  {d:1,o:"1.5",t:"winver",def:"Opens the About Windows dialog showing version and build."},
  {d:1,o:"1.5",t:"whoami",def:"Shows the signed-in user; /all adds SID, groups and privileges."},
  // 1.7 Networking
  {d:1,o:"1.7",t:"APIPA",alt:["Automatic Private IP Addressing"],def:"Self-assigned 169.254.x.x address used when no DHCP server answers; local link only, no Internet."},
  {d:1,o:"1.7",t:"Metered connection",alt:["metered"],def:"Network setting that limits background data (Windows Update, OneDrive sync) on capped links."},
  {d:1,o:"1.7",t:"Public network profile",alt:["public","public network"],def:"Network location for untrusted Wi-Fi: hides the PC and blocks sharing/discovery."},
  {d:1,o:"1.7",t:"Administrative share",alt:["hidden share","$ share"],def:"A share whose name ends in $ so it doesn't appear when browsing; not a security control."},
  {d:1,o:"1.7",t:"Domain",alt:["Windows domain","Active Directory domain"],def:"Centralized network where Active Directory handles authentication and policy for many devices (vs. a peer workgroup)."},
  {d:1,o:"1.7",t:"Proxy server",alt:["proxy"],def:"Go-between that forwards web requests; set in Settings > Network & Internet > Proxy or Internet Options > Connections."},
  // 1.8 macOS
  {d:1,o:"1.8",t:".dmg",alt:["dmg","disk image"],def:"macOS disk image that mounts as a volume in Finder, usually holding an app to drag to /Applications."},
  {d:1,o:"1.8",t:".pkg",alt:["pkg"],def:"macOS installer package that runs through Installer with scripts."},
  {d:1,o:"1.8",t:".app",alt:["app","application bundle"],def:"macOS application bundle; uninstall by moving it to the Trash."},
  {d:1,o:"1.8",t:"Time Machine",def:"Built-in macOS backup: hourly for 24 hours, daily for a month, weekly after that."},
  {d:1,o:"1.8",t:"FileVault",def:"macOS full-disk encryption; authentication is required before macOS starts."},
  {d:1,o:"1.8",t:"Keychain",alt:["Keychain Access"],def:"macOS password manager for passwords, secure notes and certificates."},
  {d:1,o:"1.8",t:"Spotlight",def:"macOS system-wide search, opened with Command+Space."},
  {d:1,o:"1.8",t:"Mission Control",def:"macOS view of all open windows and Spaces (multiple desktops); Control+Up Arrow."},
  {d:1,o:"1.8",t:"Continuity",def:"Apple feature set for working across devices: Handoff, AirDrop, iPhone as webcam, forwarded texts."},
  {d:1,o:"1.8",t:"Force Quit",def:"Stop a hung macOS app: Command+Option+Esc, or Option+right-click the Dock icon."},
  {d:1,o:"1.8",t:"Disk Utility",def:"macOS tool to verify/repair file systems, partition, erase disks and manage images."},
  {d:1,o:"1.8",t:"Rapid Security Response",alt:["RSR"],def:"Urgent Apple security patch installed between full updates; the version gains a letter, e.g. 13.3.1 (a)."},
  // 1.9 Linux
  {d:1,o:"1.9",t:"/etc/fstab",alt:["fstab"],def:"Linux file systems table: what gets mounted where at boot."},
  {d:1,o:"1.9",t:"/etc/shadow",alt:["shadow"],def:"Linux file holding password hashes and aging fields, readable only by root."},
  {d:1,o:"1.9",t:"/etc/passwd",alt:["passwd"],def:"Linux user list: username, UID, GID, home directory and login shell, colon-separated."},
  {d:1,o:"1.9",t:"/etc/resolv.conf",alt:["resolv.conf"],def:"Linux file listing the DNS servers the system uses."},
  {d:1,o:"1.9",t:"/etc/hosts",alt:["hosts"],def:"Local name-to-IP mappings checked before (or instead of) DNS."},
  {d:1,o:"1.9",t:"chmod",def:"Change file permissions, e.g. chmod 754 or chmod u+x."},
  {d:1,o:"1.9",t:"chown",def:"Change a file's owner and group, e.g. sudo chown alice:devs file."},
  {d:1,o:"1.9",t:"grep",def:"Search file contents for matching text or patterns."},
  {d:1,o:"1.9",t:"fsck",def:"Check and repair a Linux file system; run on an unmounted volume."},
  {d:1,o:"1.9",t:"sudo",def:"Run a single command with superuser (or another user's) rights."},
  {d:1,o:"1.9",t:"su",def:"Switch to another user (root by default) until you exit."},
  {d:1,o:"1.9",t:"apt",def:"Debian/Ubuntu package manager: sudo apt install <pkg>."},
  {d:1,o:"1.9",t:"dnf",def:"Red Hat/Fedora RPM package manager that replaced yum."},
  {d:1,o:"1.9",t:"dig",def:"Linux DNS lookup tool (Domain Information Groper)."},
  {d:1,o:"1.9",t:"df -h",alt:["df"],def:"Show free and used space per mounted file system in human-readable units."},
  {d:1,o:"1.9",t:"du",def:"Show how much disk space files and directories are using."},
  {d:1,o:"1.9",t:"top",def:"Live Linux view of CPU, memory, load averages and the busiest processes."},
  // 1.10 / 1.11
  {d:1,o:"1.10",t:"Hardware token",alt:["dongle","external hardware token","USB dongle"],def:"USB licensing device the application needs plugged in to run."},
  {d:1,o:"1.10",t:"Program Files (x86)",alt:["C:\\Program Files (x86)","x86"],def:"Folder for 32-bit applications on 64-bit Windows."},
  {d:1,o:"1.11",t:"Identity synchronization",alt:["directory synchronization","identity sync"],def:"Syncing directory accounts (e.g. on-prem AD to Entra ID) so a change made once appears in cloud apps."},
  // 2.1
  {d:2,o:"2.1",t:"Access control vestibule",alt:["mantrap","vestibule"],def:"Two-door entry where only one door can be open at a time, so people pass one at a time."},
  {d:2,o:"2.1",t:"Bollards",alt:["bollard"],def:"Posts that block vehicles but let people through."},
  {d:2,o:"2.1",t:"Magnetometer",def:"Passive scanner that detects metal objects; misses ceramic and plastic."},
  {d:2,o:"2.1",t:"Least privilege",alt:["principle of least privilege"],def:"Give users and applications only the rights they need for the task."},
  {d:2,o:"2.1",t:"Zero trust",def:"Security model where nothing inside or outside the network is trusted by default; every request is verified."},
  {d:2,o:"2.1",t:"TOTP",alt:["Time-based One-Time Password"],def:"One-time code generated from a shared secret plus the current time, usually changing every 30 seconds."},
  {d:2,o:"2.1",t:"SSO",alt:["single sign-on","single sign on"],def:"Authenticate once and gain access to all authorized resources without logging in again."},
  {d:2,o:"2.1",t:"SAML",alt:["Security Assertion Markup Language"],def:"Open XML standard for passing authentication and authorization between an identity provider and a service."},
  {d:2,o:"2.1",t:"Just-in-time access",alt:["JIT","just in time access","just in time"],def:"Elevated rights granted on request for a limited time, often with ephemeral credentials from a vault."},
  {d:2,o:"2.1",t:"PAM",alt:["Privileged access management"],def:"Vault-based management of admin/root credentials with temporary access and full auditing."},
  {d:2,o:"2.1",t:"MDM",alt:["Mobile device management"],def:"Central management of phones and tablets: policies, apps, encryption, remote wipe."},
  {d:2,o:"2.1",t:"DLP",alt:["Data loss prevention"],def:"Detects and blocks sensitive data (SSNs, card numbers) leaving through email, cloud or endpoints."},
  {d:2,o:"2.1",t:"IAM",alt:["Identity and access management"],def:"Gives each entity a digital identity and the right access at the right time, with governance and auditing."},
  // 2.2
  {d:2,o:"2.2",t:"UAC",alt:["User Account Control"],def:"Windows prompt that limits software rights until an administrator approves elevation."},
  {d:2,o:"2.2",t:"Organizational unit",alt:["OU"],def:"Active Directory container for grouping users and computers so policies can be applied to them."},
  {d:2,o:"2.2",t:"Folder redirection",def:"Group Policy that points Documents, Desktop and similar folders to a network share."},
  {d:2,o:"2.2",t:"Most restrictive wins",alt:["most restrictive"],def:"Rule for combining NTFS and share permissions on network access."},
  {d:2,o:"2.2",t:"Inherited permissions",alt:["inheritance"],def:"NTFS permissions passed from a parent folder to its child objects."},
  // 2.3
  {d:2,o:"2.3",t:"WPA3",def:"Wi-Fi security that replaces the PSK handshake with SAE, adding forward secrecy and resistance to offline guessing."},
  {d:2,o:"2.3",t:"AES",alt:["Advanced Encryption Standard","AES-CCMP","CCMP"],def:"Encryption used by WPA2 (CCMP) and WPA3; replaced TKIP."},
  {d:2,o:"2.3",t:"TKIP",def:"WPA's stopgap encryption that ran on WEP-era hardware; deprecated."},
  {d:2,o:"2.3",t:"RADIUS",def:"Common AAA protocol behind 802.1X Wi-Fi (WPA2/3-Enterprise), VPNs and network devices."},
  {d:2,o:"2.3",t:"TACACS+",alt:["TACACS"],def:"Cisco-originated AAA protocol over TCP 49 that encrypts the whole payload and separates authentication, authorization and accounting."},
  {d:2,o:"2.3",t:"Kerberos",def:"Ticket-based mutual authentication for Windows domains; enables SSO and needs clocks within 5 minutes."},
  // 2.4 Malware
  {d:2,o:"2.4",t:"Trojan",alt:["Trojan horse"],def:"Malware disguised as legitimate software; it doesn't self-replicate."},
  {d:2,o:"2.4",t:"Rootkit",def:"Malware that modifies the kernel or core system files to hide from the OS and antivirus."},
  {d:2,o:"2.4",t:"Virus",def:"Malware that replicates when a user runs an infected program."},
  {d:2,o:"2.4",t:"Ransomware",def:"Malware that encrypts your files and demands payment for the key."},
  {d:2,o:"2.4",t:"Keylogger",def:"Malware that records keystrokes to capture passwords and messages."},
  {d:2,o:"2.4",t:"Boot sector virus",def:"Malware in the boot loader that runs before the OS; Secure Boot helps prevent it."},
  {d:2,o:"2.4",t:"Cryptominer",alt:["cryptojacking"],def:"Malware or script that uses your CPU/GPU to mine cryptocurrency."},
  {d:2,o:"2.4",t:"Stalkerware",def:"Surveillance software used to track another person's location, messages, camera and microphone."},
  {d:2,o:"2.4",t:"Fileless malware",alt:["fileless","fileless virus"],def:"Malware that runs in memory via legitimate tools (e.g. PowerShell) without installing a file."},
  {d:2,o:"2.4",t:"PUP",alt:["Potentially unwanted program"],def:"Bundled software such as aggressive toolbars or ad-showing utilities; flagged but not strictly malware."},
  {d:2,o:"2.4",t:"EDR",alt:["Endpoint detection and response"],def:"Agent-based endpoint protection that detects by behavior, investigates root cause and auto-isolates."},
  {d:2,o:"2.4",t:"MDR",alt:["Managed detection and response"],def:"EDR monitoring and response provided as a service by an MSSP."},
  {d:2,o:"2.4",t:"XDR",alt:["Extended detection and response"],def:"Correlates endpoint, network and cloud telemetry for better detection."},
  {d:2,o:"2.4",t:"Email security gateway",def:"Filters inbound email (spam, phishing, malware) before it reaches users; on-site or cloud."},
  // 2.5 Threats
  {d:2,o:"2.5",t:"Vishing",def:"Voice phishing over the phone or voicemail, often with caller ID spoofing."},
  {d:2,o:"2.5",t:"Smishing",def:"SMS/text-message phishing."},
  {d:2,o:"2.5",t:"Whaling",def:"Spear phishing aimed at an executive such as the CEO or CFO."},
  {d:2,o:"2.5",t:"Spear phishing",def:"Phishing aimed at a specific person or group using inside information."},
  {d:2,o:"2.5",t:"Tailgating",def:"Following an authorized person through a secure door without their consent."},
  {d:2,o:"2.5",t:"Piggybacking",def:"Entering a secure area with the authorized person's consent, e.g. they hold the door."},
  {d:2,o:"2.5",t:"Evil twin",def:"Rogue access point that mimics a legitimate SSID to intercept traffic."},
  {d:2,o:"2.5",t:"On-path attack",alt:["on path","man-in-the-middle","MITM"],def:"Attacker silently relays and can alter traffic between two parties, e.g. through ARP poisoning."},
  {d:2,o:"2.5",t:"Zero-day",alt:["zero day"],def:"Vulnerability exploited before the vendor knows about it or has a patch."},
  {d:2,o:"2.5",t:"Dictionary attack",def:"Password guessing from wordlists of common words with letter substitutions."},
  {d:2,o:"2.5",t:"Brute force",alt:["brute-force attack"],def:"Trying every possible combination, online against a login or offline against stolen hashes."},
  {d:2,o:"2.5",t:"SQL injection",alt:["SQLi"],def:"Inserting SQL through unvalidated input to read or alter a database, e.g. ' OR '1'='1."},
  {d:2,o:"2.5",t:"XSS",alt:["Cross-site scripting"],def:"Injecting script into a trusted site so it runs in other users' browsers (reflected or stored)."},
  {d:2,o:"2.5",t:"BEC",alt:["Business email compromise"],def:"Fraud that impersonates a trusted email sender to redirect payments or gift cards."},
  {d:2,o:"2.5",t:"Supply chain attack",alt:["supply chain","pipeline attack"],def:"Compromising a vendor, update or component to reach its customers (SolarWinds, Target's HVAC vendor)."},
  {d:2,o:"2.5",t:"Insider threat",def:"Attack by an employee or contractor who uses legitimate access and inside knowledge."},
  {d:2,o:"2.5",t:"EOL",alt:["End of life","EOSL"],def:"Product no longer sold or patched by the vendor, so its vulnerabilities stay open."},
  // 2.7 - 2.11
  {d:2,o:"2.7",t:"AutoPlay",def:"Windows feature that acts on inserted media; disable it in Settings > Bluetooth & devices > AutoPlay."},
  {d:2,o:"2.7",t:"BIOS supervisor password",alt:["supervisor password","administrator password"],def:"UEFI/BIOS password that blocks changes to firmware settings (a user password blocks booting)."},
  {d:2,o:"2.8",t:"Remote wipe",def:"Erase a lost or stolen mobile device's data from afar, usually through MDM or a locator service."},
  {d:2,o:"2.8",t:"Configuration profile",def:"MDM-pushed bundle of settings: email, Wi-Fi, passcode rules and restrictions."},
  {d:2,o:"2.9",t:"Degaussing",def:"Strong magnetic field that wipes magnetic media and ruins the drive; useless on SSDs and flash."},
  {d:2,o:"2.9",t:"Certificate of destruction",def:"Third-party proof that drives were destroyed, for the audit trail."},
  {d:2,o:"2.9",t:"Low-level format",def:"Factory-level sector formatting, not done by users."},
  {d:2,o:"2.10",t:"UPnP",alt:["Universal Plug and Play"],def:"Lets internal apps open inbound router ports without approval; best practice is to disable it."},
  {d:2,o:"2.10",t:"Screened subnet",alt:["DMZ"],def:"Separate network segment for public-facing servers, between the Internet and the internal LAN."},
  {d:2,o:"2.10",t:"Port forwarding",alt:["port mapping","destination NAT","static NAT"],def:"Maps an external IP/port to an internal host/port so an inside service can be reached from outside."},
  {d:2,o:"2.10",t:"Content filtering",def:"Allow or block traffic by URL, category or content (parental controls, NSFW blocking)."},
  {d:2,o:"2.11",t:"Hash verification",alt:["hash","checksum"],def:"Compare a download's SHA-256 hash with the publisher's posted value to confirm integrity."},
  {d:2,o:"2.11",t:"DoH",alt:["DNS over HTTPS","secure DNS"],def:"Encrypts DNS lookups inside HTTPS so others on the path can't see them."},
  {d:2,o:"2.11",t:"Transparent proxy",def:"Proxy that intercepts traffic without any browser configuration (an explicit proxy needs IP and port)."},
  // 3.x
  {d:3,o:"3.1",t:"bootrec /rebuildbcd",alt:["bootrec","rebuildbcd"],def:"WinRE command that scans for Windows installs and rebuilds the Boot Configuration Data store."},
  {d:3,o:"3.1",t:"Startup Repair",def:"WinRE tool that automatically fixes boot problems such as \"BOOTMGR is missing\" or a bad BCD."},
  {d:3,o:"3.1",t:"Reliability Monitor",def:"Windows timeline of application failures, Windows failures and installs, with links to solutions."},
  {d:3,o:"3.1",t:"Virtual memory",alt:["paging file","page file","pagefile"],def:"Disk space used as RAM overflow; increase it to ease low-memory warnings."},
  {d:3,o:"3.1",t:"Roll Back Driver",alt:["rollback driver","driver rollback"],def:"Device Manager option that restores the previous driver after a bad update."},
  {d:3,o:"3.1",t:"Safe Mode",def:"Windows boot with minimal drivers and services, used to isolate driver or malware problems."},
  {d:3,o:"3.1",t:"Time drift",def:"Clock slowly wanders off; fix by enabling automatic time sync. More than 5 minutes off breaks Kerberos."},
  {d:3,o:"3.2",t:"Rotation lock",alt:["orientation lock"],def:"Setting that stops the screen from autorotating."},
  {d:3,o:"3.3",t:"Developer mode",alt:["developer options"],def:"Hidden settings such as USB debugging; on Android, tap Build number seven times to enable."},
  {d:3,o:"3.3",t:"Jailbreaking",alt:["jailbreak","rooting"],def:"Removing iOS restrictions (rooting on Android); bypasses security and breaks MDM control."},
  {d:3,o:"3.3",t:"Sideloading",alt:["sideload"],def:"Installing apps from outside the official store, e.g. an APK from a website."},
  {d:3,o:"3.3",t:"Application spoofing",alt:["app spoofing"],def:"Malicious app posing as a legitimate one."},
  {d:3,o:"3.4",t:"Browser redirection",alt:["redirect","hijacker"],def:"Malware sends searches or URLs to attacker sites; removal is unreliable, so restore from known-good backup."},
  {d:3,o:"3.4",t:"Certificate warning",def:"Browser alert for an expired, mismatched or untrusted certificate; also triggered by a wrong system date."},
  // 4.x
  {d:4,o:"4.1",t:"SLA",alt:["Service level agreement"],def:"Contract that sets minimum service terms such as uptime and response time."},
  {d:4,o:"4.1",t:"CMDB",alt:["Configuration management database"],def:"Central asset database linking devices to users, warranty and licensing."},
  {d:4,o:"4.1",t:"Asset tag",def:"Barcode, RFID or numbered label that ties a device to its asset record."},
  {d:4,o:"4.1",t:"Knowledge base",alt:["KB"],def:"Searchable archive of known issues and resolutions."},
  {d:4,o:"4.1",t:"Off-boarding",alt:["offboarding"],def:"Predefined checklist for departing users: recover hardware, decide what happens to data, disable accounts."},
  {d:4,o:"4.2",t:"Rollback plan",alt:["backout plan","back-out plan"],def:"Documented way to revert a change if it fails."},
  {d:4,o:"4.2",t:"Emergency change",def:"High-risk change that must go in immediately, e.g. a zero-day patch."},
  {d:4,o:"4.2",t:"Standard change",def:"Low-risk, pre-approved, well-documented change that happens often."},
  {d:4,o:"4.2",t:"Change freeze",def:"Period when no changes are allowed for any reason."},
  {d:4,o:"4.2",t:"Sandbox",alt:["sandbox testing"],def:"Isolated test environment with no link to production, used to try changes and confirm rollback."},
  {d:4,o:"4.2",t:"End-user acceptance",alt:["user acceptance"],def:"Sign-off from the people who use the system once the change is complete."},
  {d:4,o:"4.3",t:"Incremental backup",alt:["incremental"],def:"Backs up changes since the last backup of any type; restore needs the full plus every incremental."},

/* Command practice. sh: cmd | bash | ps. ok: regexes tested against normalized input. */
const CMDS = [
  {d:1,o:"1.5",sh:"cmd",task:"Show full IP configuration, including DNS servers and the DHCP lease.",ans:"ipconfig /all",ok:["^ipconfig\\s+[/-]all$"],why:"/all adds MAC address, DHCP server, DNS servers and lease times to the basic output."},
  {d:1,o:"1.5",sh:"cmd",task:"Clear the local DNS resolver cache.",ans:"ipconfig /flushdns",ok:["^ipconfig\\s+[/-]flushdns$"],why:"Use it after DNS records change and the PC still resolves the old address."},
  {d:1,o:"1.5",sh:"cmd",task:"Give up the current DHCP lease, then (second command) request a new one. Type the FIRST command.",ans:"ipconfig /release",ok:["^ipconfig\\s+[/-]release$"],why:"Then run ipconfig /renew. Together they force a fresh DHCP lease."},
  {d:1,o:"1.5",sh:"cmd",task:"Ping 8.8.8.8 continuously until you press Ctrl+C.",ans:"ping -t 8.8.8.8",ok:["^ping\\s+[/-]t\\s+8\\.8\\.8\\.8$","^ping\\s+8\\.8\\.8\\.8\\s+[/-]t$"],why:"-t is the Windows continuous switch. On Linux, ping runs continuously by default and -t sets the TTL."},
  {d:1,o:"1.5",sh:"cmd",task:"Send exactly 10 echo requests to 10.0.0.1.",ans:"ping -n 10 10.0.0.1",ok:["^ping\\s+[/-]n\\s+10\\s+10\\.0\\.0\\.1$","^ping\\s+10\\.0\\.0\\.1\\s+[/-]n\\s+10$"],why:"Windows uses -n for count; Linux uses -c."},
  {d:1,o:"1.5",sh:"cmd",task:"List every router hop to example.com.",ans:"tracert example.com",ok:["^tracert\\s+example\\.com$"],why:"tracert raises the TTL one hop at a time and records the ICMP Time Exceeded replies."},
  {d:1,o:"1.5",sh:"cmd",task:"Find which hop between you and example.com is dropping packets.",ans:"pathping example.com",ok:["^pathping\\s+example\\.com$"],why:"pathping traces the route, then measures loss and latency at each hop over a few minutes."},
  {d:1,o:"1.5",sh:"cmd",task:"Show all connections and listening ports with numeric addresses (no name lookups).",ans:"netstat -an",ok:["^netstat\\s+([/-]a\\s*[/-]?n|[/-]n\\s*[/-]?a|-an|-na)$"],why:"-a shows all connections and listeners; -n skips DNS so the output is faster."},
  {d:1,o:"1.5",sh:"cmd",task:"Show which executable owns each connection (needs an elevated prompt).",ans:"netstat -b",ok:["^netstat\\s+[/-]b"],why:"-b lists the binary behind each connection, which helps spot malware calling out."},
  {d:1,o:"1.5",sh:"cmd",task:"Look up the IP address for intranet.corp.local in DNS.",ans:"nslookup intranet.corp.local",ok:["^nslookup\\s+intranet\\.corp\\.local"],why:"nslookup queries the configured DNS server; add a server name as a second argument to query a different one."},
  {d:1,o:"1.5",sh:"cmd",task:"Map drive H: to the share \\\\fs01\\users.",ans:"net use H: \\\\fs01\\users",ok:["^net\\s+use\\s+h:\\s+\\\\\\\\fs01\\\\users(\\s+[/-]persistent:(yes|no))?$"],why:"Add /persistent:yes to reconnect at each login."},
  {d:1,o:"1.5",sh:"cmd",task:"Disconnect mapped drive H:.",ans:"net use H: /delete",ok:["^net\\s+use\\s+h:\\s+[/-](delete|d)(\\s+[/-]y)?$"],why:"/delete (or /d) removes the mapping."},
  {d:1,o:"1.5",sh:"cmd",task:"Reset domain user jsmith's password, prompting for the new one.",ans:"net user jsmith * /domain",ok:["^net\\s+user\\s+jsmith\\s+\\*\\s+[/-]domain$"],why:"The * prompts for the password so it isn't typed in the clear; /domain targets AD instead of the local SAM."},
  {d:1,o:"1.5",sh:"cmd",task:"Reapply all Group Policy settings now, including unchanged ones.",ans:"gpupdate /force",ok:["^gpupdate\\s+[/-]force$"],why:"Without /force only changed policies are applied."},
  {d:1,o:"1.5",sh:"cmd",task:"Show a summary of which GPOs applied to this computer and user.",ans:"gpresult /r",ok:["^gpresult\\s+[/-]r$"],why:"/r prints the RSoP summary; /v is verbose; /h writes an HTML report."},
  {d:1,o:"1.5",sh:"cmd",task:"Scan and repair protected Windows system files.",ans:"sfc /scannow",ok:["^sfc\\s+[/-]scannow$"],why:"Run it from an elevated prompt."},
  {d:1,o:"1.5",sh:"cmd",task:"Check drive D: and fix logical file system errors only.",ans:"chkdsk D: /f",ok:["^chkdsk\\s+d:\\s+[/-]f$"],why:"/f fixes errors; /r also scans for bad sectors and implies /f."},
  {d:1,o:"1.5",sh:"cmd",task:"Check drive C: for bad sectors and recover readable data.",ans:"chkdsk C: /r",ok:["^chkdsk\\s+(c:\\s+)?[/-]r$","^chkdsk\\s+c:\\s+[/-]f\\s+[/-]r$"],why:"A locked system volume is scheduled for the next restart."},
  {d:1,o:"1.5",sh:"cmd",task:"Mirror C:\\Data to \\\\nas\\backup (the destination ends up matching the source exactly).",ans:"robocopy C:\\Data \\\\nas\\backup /MIR",ok:["^robocopy\\s+c:\\\\data\\s+\\\\\\\\nas\\\\backup\\s+[/-]mir$"],why:"/MIR = /E plus purging files missing from the source. It deletes from the destination, so be careful."},
  {d:1,o:"1.5",sh:"cmd",task:"Create the folder C:\\Reports.",ans:"md C:\\Reports",ok:["^(md|mkdir)\\s+c:\\\\reports$"],why:"md and mkdir are the same command."},
  {d:1,o:"1.5",sh:"cmd",task:"Delete C:\\Temp\\old and everything in it, without a prompt.",ans:"rmdir /s /q C:\\Temp\\old",ok:["^(rmdir|rd)\\s+([/-]s\\s+[/-]q|[/-]q\\s+[/-]s)\\s+c:\\\\temp\\\\old$","^(rmdir|rd)\\s+c:\\\\temp\\\\old\\s+([/-]s\\s+[/-]q|[/-]q\\s+[/-]s)$"],why:"/s removes subfolders and files; /q is quiet mode. Without /s, rmdir only removes empty folders."},
  {d:1,o:"1.5",sh:"cmd",task:"Format drive E: with NTFS.",ans:"format E: /fs:ntfs",ok:["^format\\s+e:\\s+[/-]fs:ntfs(\\s+[/-]q)?$"],why:"Add /q for a quick format. Formatting destroys data."},
  {d:1,o:"1.5",sh:"cmd",task:"Show the signed-in user with SID, groups and privileges.",ans:"whoami /all",ok:["^whoami\\s+[/-]all$"],why:"/groups or /priv show subsets."},
  {d:1,o:"1.5",sh:"cmd",task:"Get built-in help for robocopy's switches.",ans:"robocopy /?",ok:["^robocopy\\s+[/-]\\?$","^help\\s+robocopy$"],why:"[command] /? works for nearly every Windows command."},
  {d:3,o:"3.1",sh:"cmd",task:"From the WinRE Command Prompt, rebuild the Boot Configuration Data store.",ans:"bootrec /rebuildbcd",ok:["^bootrec(\\.exe)?\\s+[/-]rebuildbcd$"],why:"Related switches: /fixmbr writes a new MBR; /fixboot writes a new boot sector."},
  {d:1,o:"1.9",sh:"bash",task:"List all files, including hidden ones, in long format.",ans:"ls -la",ok:["^ls\\s+(-la|-al|-l\\s+-a|-a\\s+-l)$"],why:"-l = long listing (permissions, owner, size); -a = include dotfiles."},
  {d:1,o:"1.9",sh:"bash",task:"Print the directory you're in.",ans:"pwd",ok:["^pwd$"],why:"Print working directory."},
  {d:1,o:"1.9",sh:"bash",task:"Rename report.txt to final.txt.",ans:"mv report.txt final.txt",ok:["^mv\\s+report\\.txt\\s+final\\.txt$"],why:"mv both moves and renames."},
  {d:1,o:"1.9",sh:"bash",task:"Copy the directory site/ and everything in it to site-backup/.",ans:"cp -r site site-backup",ok:["^cp\\s+-(r|R|a)\\s+site/?\\s+site-backup/?$"],why:"-r (recursive) is required for directories."},
  {d:1,o:"1.9",sh:"bash",task:"Delete the directory oldlogs/ and its contents.",ans:"rm -r oldlogs",ok:["^rm\\s+-(r|rf|fr|R|Rf)\\s+oldlogs/?$"],why:"rm won't remove a directory without -r. Adding -f skips prompts, so double-check the path."},
  {d:1,o:"1.9",sh:"bash",task:"Set deploy.sh to owner rwx, group r-x, others no access (octal).",ans:"chmod 750 deploy.sh",ok:["^chmod\\s+0?750\\s+deploy\\.sh$"],why:"r=4, w=2, x=1. Owner 4+2+1=7, group 4+1=5, others 0."},
  {d:1,o:"1.9",sh:"bash",task:"Add execute permission for the owner of backup.sh only (symbolic).",ans:"chmod u+x backup.sh",ok:["^chmod\\s+u\\+x\\s+backup\\.sh$"],why:"u = owner, g = group, o = others, a = all."},

  {d:1,o:"1.9",sh:"bash",task:"Search /var/log/auth.log for lines containing: Failed password",ans:"grep \"Failed password\" /var/log/auth.log",ok:["^(sudo\\s+)?grep\\s+(-i\\s+)?([\"'])failed password\\3\\s+/var/log/auth\\.log$"],why:"Quote patterns that contain spaces. -i ignores case; -r searches directories."},
  {d:1,o:"1.9",sh:"bash",task:"Find every file ending in .log under /var.",ans:"find /var -name \"*.log\"",ok:["^(sudo\\s+)?find\\s+/var\\s+-i?name\\s+([\"']?)\\*\\.log\\2$"],why:"Quote the wildcard so the shell doesn't expand it first."},
  {d:1,o:"1.9",sh:"bash",task:"Show free space on every mounted file system in human-readable units.",ans:"df -h",ok:["^df\\s+-h$"],why:"df = disk free. du shows usage per file or directory."},

  {d:1,o:"1.2",q:"A new 4 TB data drive only lets you create a 2 TB partition in Disk Management. What fixes this?",c:["Format it FAT32","Initialize the disk as GPT","Create an extended partition","Enable Secure Boot"],a:1,why:"MBR is limited to 2 TB partitions. GPT removes that limit.",key:"Initialize or convert the disk to GPT instead of MBR (MBR tops out at 2 TB).",kw:[["gpt","guid"]]},
  {d:1,o:"1.2",q:"The Windows 11 upgrade check fails on a 2017 desktop that has enough RAM and storage. Which two hardware requirements should you check first?",c:["TPM 2.0 and Secure Boot-capable UEFI","A discrete GPU and 32 GB RAM","An NVMe SSD and Wi-Fi 6","An ECC RAM and dual CPUs"],a:0,why:"Windows 11 requires TPM 2.0 and UEFI with Secure Boot capability. Check with tpm.msc and System Information.",key:"Check for TPM 2.0 (tpm.msc) and UEFI firmware with Secure Boot.",kw:[["tpm"]]},
  {d:1,o:"1.4",q:"A user says an app crashed overnight and closed without a message. Where do you look to see what happened?",c:["Event Viewer, Application log","Disk Cleanup","Certificate Manager","System Configuration"],a:0,why:"Event Viewer (eventvwr.msc) records application errors with time stamps and fault details.",key:"Check Event Viewer (eventvwr.msc), Application log, around the time of the crash.",kw:[["event viewer","eventvwr","event log"]]},
  {d:1,o:"1.4",q:"A laptop takes minutes to settle after login because many apps launch automatically. Where is the quickest place to stop them launching in Windows 11?",c:["Task Manager > Startup apps","Device Manager","Disk Management","Local Users and Groups"],a:0,why:"Task Manager's Startup tab enables and disables startup apps (msconfig sends you there on Windows 10/11).",key:"Disable unneeded entries in Task Manager's Startup apps tab (or Settings > Apps > Startup).",kw:[["startup"]]},
  {d:1,o:"1.4",q:"An admin wants to log CPU use on a file server for a week and get an alert whenever it stays above 90%. Which tool should they use?",c:["Resource Monitor","Performance Monitor","Task Manager","System Information"],a:1,why:"Performance Monitor (perfmon.msc) supports long-term data collector sets and alerts. Resource Monitor and Task Manager show only real-time data.",key:"Performance Monitor (perfmon.msc) with a data collector set and an alert.",kw:[["perfmon","performance monitor"]]},
  {d:1,o:"1.5",q:"An admin just changed a GPO. A user needs the new setting now, without waiting for the next refresh. What do you run on the user's PC?",c:["gpresult /r","gpupdate /force","sfc /scannow","net use"],a:1,why:"gpupdate /force reapplies all policy settings immediately.",key:"Run gpupdate /force.",kw:[["gpupdate"]]},
  {d:1,o:"1.5",q:"You need to confirm which Group Policy Objects actually applied to a user who isn't getting a mapped drive. Which command shows this?",c:["gpupdate /force","whoami /all","gpresult /r","netstat -b"],a:2,why:"gpresult shows the Resultant Set of Policy: applied and filtered GPOs.",key:"Run gpresult /r (Resultant Set of Policy).",kw:[["gpresult"]]},
  {d:1,o:"1.7",q:"A PC shows the IP address 169.254.33.7 and can't reach the Internet. What is the most likely cause?",c:["DNS server is down","The PC couldn't reach a DHCP server, so it used APIPA","The gateway is misconfigured","The subnet mask is wrong"],a:1,why:"169.254.x.x is an APIPA self-assigned address: no DHCP answer was received.",key:"No DHCP server answered, so Windows self-assigned an APIPA (169.254.x.x) address. Check the DHCP server, cabling or VLAN.",kw:[["dhcp"]]},
  {d:1,o:"1.7",q:"A traveling employee connects to hotel Wi-Fi. What Windows setting keeps the laptop hidden from other guests and turns off file sharing?",c:["Metered connection","Public network profile","Proxy settings","WWAN"],a:1,why:"The Public profile turns off network discovery and sharing.",key:"Set the network profile to Public.",kw:[["public"]]},
  {d:1,o:"1.7",q:"A user tethers to a phone with a small data plan, and OneDrive and Windows Update eat through it. Which setting helps?",c:["Set the connection as metered","Switch the profile to Private","Disable IPv6","Add a static IP address"],a:0,why:"A metered connection limits background data use by Windows Update and sync clients.",key:"Mark the connection as metered.",kw:[["metered"]]},
  {d:1,o:"1.8",q:"A Mac user installed an app by dragging it from a .dmg into Applications. How do they uninstall it?",c:["Run the .pkg again","Drag the .app to the Trash","Delete it in Disk Utility","Use Force Quit"],a:1,why:"An .app bundle holds the whole application, so moving it to the Trash removes it. Some apps ship their own uninstaller.",key:"Move the .app bundle from /Applications to the Trash (or run the vendor's uninstaller if it has one).",kw:[["trash","bin"]]},
  {d:1,o:"1.8",q:"A Mac user wants automatic hourly backups to an external drive, with the oldest backups pruned when the disk fills up. What should they use?",c:["iCloud Drive","Time Machine","FileVault","Disk Utility"],a:1,why:"Time Machine keeps hourly backups for 24 hours, daily for a month, then weekly, and deletes the oldest when full.",key:"Time Machine.",kw:[["time machine"]]},
  {d:1,o:"1.9",q:"After a reboot, a Linux server's second data disk isn't mounted at /data. Which file controls mounts at boot?",c:["/etc/hosts","/etc/fstab","/etc/shadow","/etc/resolv.conf"],a:1,why:"/etc/fstab lists the file systems mounted at startup.",key:"/etc/fstab: add or fix the entry for the disk.",kw:[["fstab"]]},
  {d:1,o:"1.9",q:"Running ./deploy.sh returns 'Permission denied' for the file's owner. What fixes it?",c:["chown root deploy.sh","chmod u+x deploy.sh","sudo apt install deploy","fsck deploy.sh"],a:1,why:"The file is missing execute permission. chmod u+x (or 744/755) adds it.",key:"Add execute permission: chmod u+x deploy.sh (or chmod 755).",kw:[["chmod"]]},
  {d:1,o:"1.10",q:"An engineering app only runs while a small USB device is plugged in. What is this device?",c:["A TPM","An external hardware token (license dongle)","A smart card reader","A USB Wi-Fi adapter"],a:1,why:"Some high-cost software enforces licensing with an external hardware token.",key:"An external hardware token, a USB license dongle that authorizes the application.",kw:[["token","dongle","licen"]]},
  {d:1,o:"1.10",q:"On 64-bit Windows, where does a 32-bit application install by default?",c:["C:\\Program Files","C:\\Program Files (x86)","C:\\Windows\\System32","C:\\Users\\Public"],a:1,why:"32-bit apps go in Program Files (x86); 64-bit apps go in Program Files.",key:"C:\\Program Files (x86).",kw:[["x86"]]},
  {d:1,o:"1.11",q:"When HR creates a new hire in on-prem Active Directory, the account should appear automatically in Microsoft 365. Which concept is this?",c:["Licensing assignment","Identity synchronization","Folder redirection","Zero-touch deployment"],a:1,why:"Directory/identity synchronization copies changes from one directory to others, such as AD to Entra ID.",key:"Identity (directory) synchronization, e.g. AD synced to Microsoft Entra ID.",kw:[["sync"]]},
  // ===== Domain 2 =====
  {d:2,o:"2.1",q:"People keep following employees through a badge door without swiping. Which physical control stops this best?",c:["Bollards","An access control vestibule","A magnetometer","Brighter lighting"],a:1,why:"A vestibule lets one door open at a time, so people pass through one by one.",key:"An access control vestibule (mantrap) where only one door opens at a time; security guards are a secondary option.",kw:[["vestibule","mantrap","guard"]]},
  {d:2,o:"2.5",q:"An employee holds the secure door for someone carrying pastry boxes who has no badge. What is this called?",c:["Tailgating","Piggybacking","Shoulder surfing","Impersonation"],a:1,why:"Piggybacking means the authorized person consents. Tailgating happens without their knowledge.",key:"Piggybacking: the authorized person knowingly let them in. Tailgating would be without consent.",kw:[["piggyback"]]},
  {d:2,o:"2.5",q:"The CFO gets a personalized email that appears to come from the CEO and asks for an urgent wire transfer. What attack is this?",c:["Vishing","Whaling","Smishing","Evil twin"],a:1,why:"Whaling is spear phishing aimed at an executive. It's also a business email compromise pattern.",key:"Whaling (spear phishing an executive), a form of business email compromise.",kw:[["whal","bec","business email"]]},
  {d:2,o:"2.5",q:"Several employees receive texts saying 'Your package is held, pay the fee here' with a link. What is this?",c:["Smishing","Vishing","QR code phishing","Whaling"],a:0,why:"SMS phishing is smishing.",key:"Smishing (SMS phishing).",kw:[["smish","sms"]]},
  {d:2,o:"2.5",q:"At a café, a Wi-Fi network with the café's exact name appears with a stronger signal, and users who join it get a fake login page. What is it?",c:["Evil twin","Zero-day","DDoS","Dictionary attack"],a:0,why:"An evil twin copies a legitimate SSID to capture traffic and credentials.",key:"An evil twin rogue access point. Use a VPN and HTTPS.",kw:[["evil twin","rogue"]]},
  {d:2,o:"2.5",q:"A web form's logs show input like ' OR '1'='1 in the username field. What attack is being tried, and what prevents it?",c:["XSS, prevented by disabling cookies","SQL injection, prevented by input validation and parameterized queries","Brute force, prevented by account lockout","On-path, prevented by HTTPS"],a:1,why:"That string changes the SQL query logic. Validate input and parameterize queries.",key:"SQL injection. Prevent it by validating input and using parameterized queries.",kw:[["sql"]]},
  {d:2,o:"2.4",q:"EDR flags malicious PowerShell running only in memory. No malicious file exists on disk. What type of malware is this?",c:["Boot sector virus","Fileless malware","Trojan","Ransomware"],a:1,why:"Fileless malware runs in memory through legitimate tools and avoids file-based scanning.",key:"Fileless malware.",kw:[["fileless"]]},
  {d:2,o:"2.4",q:"A PC's CPU sits near 100% while idle and the fans run loud. A process connects to a mining pool. What is it?",c:["Keylogger","Cryptominer","Spyware","Rootkit"],a:1,why:"Cryptominers use the victim's CPU/GPU to mine cryptocurrency.",key:"Cryptominer (cryptojacking).",kw:[["crypto","mining","miner"]]},
  {d:2,o:"2.6",q:"Following CompTIA's malware removal procedure, what is the FIRST step?",c:["Quarantine the infected system","Investigate and verify malware symptoms","Disable System Restore","Update anti-malware software"],a:1,why:"Order: investigate and verify, quarantine, disable System Restore (Home), remediate (update, scan/remove, reimage if needed), schedule scans/updates, enable System Restore and create a restore point, educate the user.",key:"Investigate and verify the malware symptoms.",kw:[["investigat","verify","identify"]]},
  {d:2,o:"2.6",q:"You've confirmed malware on a Windows 11 Home PC and quarantined it from the network. What comes next?",c:["Educate the end user","Disable System Restore","Reimage the PC","Schedule scans"],a:1,why:"Disable System Restore next, so infected restore points can't bring the malware back.",key:"Disable System Restore (and delete its restore points) before remediating.",kw:[["system restore","restore point","system protection"]]},
  {d:2,o:"2.3",q:"Which Wi-Fi security protocol replaces the pre-shared key handshake with SAE to resist offline password guessing?",c:["WPA","WPA2","WPA3","WEP"],a:2,why:"WPA3 uses SAE (Simultaneous Authentication of Equals).",key:"WPA3 (SAE).",kw:[["wpa3"]]},
  {d:2,o:"2.3",q:"A network team wants device-admin logins on its Cisco switches with separate authentication, authorization and accounting and a fully encrypted payload. Which protocol fits?",c:["RADIUS","TACACS+","Kerberos","SAML"],a:1,why:"TACACS+ runs over TCP 49, encrypts the whole body and separates AAA. RADIUS encrypts only the password.",key:"TACACS+.",kw:[["tacacs"]]},
  {d:2,o:"2.3",q:"Domain users log in once and open file shares without retyping their password. Which protocol makes this work?",c:["Kerberos","TKIP","RADIUS","TOTP"],a:0,why:"Kerberos tickets provide SSO inside a Windows domain.",key:"Kerberos ticket-based SSO.",kw:[["kerberos"]]},
  {d:2,o:"2.2",q:"A folder has NTFS Modify for Sales and share permission Read for Everyone. What can a Sales user do over the network?",c:["Modify","Read","Full Control","Nothing"],a:1,why:"Over the network, the more restrictive of NTFS and share permissions applies.",key:"Read only. Combined NTFS and share permissions use the most restrictive.",kw:[["read"]]},
  {d:2,o:"2.2",q:"A file is moved to another folder on the same NTFS volume. What happens to its permissions?",c:["It inherits the destination's permissions","It keeps its original permissions","It loses all permissions","It becomes read-only"],a:1,why:"A move within the same volume keeps permissions. A copy, or a move to another volume, inherits the destination's.",key:"It keeps its original permissions, because a move within the same volume doesn't re-inherit.",kw:[["keep","retain","original","same","unchanged"]]},
  {d:2,o:"2.9",q:"You must dispose of 50 SSDs so their data can't be recovered. The facility has a degausser. What should you do?",c:["Degauss them","Quick format them","Physically shred or destroy them and get a certificate of destruction","Delete the partitions"],a:2,why:"Degaussing doesn't affect flash storage. Physical destruction (or a verified secure erase) plus a certificate is the answer.",key:"Physically destroy them (shred, drill, incinerate), ideally through a vendor that gives a certificate of destruction. Degaussing doesn't work on SSDs.",kw:[["shred","destroy","destruction","drill","incinerat","crush"]]},
  {d:2,o:"2.10",q:"On a SOHO router, apps on internal PCs are opening inbound ports on their own. Which setting should you disable?",c:["DHCP","UPnP","SSID broadcast","WPA3"],a:1,why:"UPnP lets internal devices open ports without approval. Disable it and forward only the ports you need.",key:"Disable UPnP and use manual port forwarding only where it's needed.",kw:[["upnp","plug and play"]]},
  {d:2,o:"2.10",q:"A small business wants to host a public web server without exposing its internal LAN. Where should the server go?",c:["On the internal LAN","In a screened subnet (DMZ)","On the guest Wi-Fi","Behind UPnP"],a:1,why:"A screened subnet isolates public-facing servers from the internal network.",key:"In a screened subnet (DMZ).",kw:[["screened","dmz"]]},
  {d:2,o:"2.11",q:"How do you confirm that a downloaded browser installer is exactly what the vendor published?",c:["Check the file size","Compare its SHA-256 hash with the vendor's posted value","Scan it with Disk Cleanup","Open it in private browsing"],a:1,why:"Matching hashes show the file wasn't altered.",key:"Compute the file's hash (e.g. SHA-256) and compare it with the value the vendor publishes.",kw:[["hash","sha","checksum"]]},
  {d:2,o:"2.1",q:"Admins should hold elevated rights only while doing a specific task, using credentials that expire afterward. Which approach does this?",c:["Just-in-time access through PAM","Single sign-on","Group Policy","Least functionality"],a:0,why:"Just-in-time access, part of PAM, issues time-limited elevated credentials from a vault.",key:"Just-in-time access within privileged access management (PAM).",kw:[["just-in-time","just in time","jit","pam","privileged access"]]},
  {d:2,o:"2.1",q:"Outbound emails containing Social Security numbers must be blocked automatically. Which control does this?",c:["DLP","MDM","IAM","EDR"],a:0,why:"Data loss prevention inspects and blocks sensitive data leaving the organization.",key:"Data loss prevention (DLP).",kw:[["dlp","data loss"]]},
  {d:2,o:"2.8",q:"A company phone with customer data was left in a taxi. What protects the data fastest?",c:["Change the user's password","Remote wipe through MDM or the locator service","Disable Bluetooth","Factory reset when it's found"],a:1,why:"A remote wipe erases the device even while it's lost.",key:"Remote wipe the device through MDM or the locator service (after locating it if policy allows).",kw:[["wipe"]]},
  {d:2,o:"2.7",q:"Which change best stops someone with brief physical access from altering a desktop's boot order?",c:["Set a BIOS/UEFI supervisor password","Turn on AutoPlay","Enable the Guest account","Increase screen brightness"],a:0,why:"A supervisor (administrator) password protects firmware settings.",key:"Set a BIOS/UEFI supervisor (administrator) password.",kw:[["bios","uefi","firmware"]]},
  // ===== Domain 3 =====
  {d:3,o:"3.1",q:"After a user installed a second operating system, Windows 10 shows 'BOOTMGR is missing'. What is the best first fix?",c:["Reinstall Windows","Boot to WinRE and run Startup Repair or bootrec /rebuildbcd","Run sfc /scannow from Windows","Replace the hard drive"],a:1,why:"Boot loader/BCD damage is fixed from the Windows Recovery Environment.",key:"Boot into WinRE (installation media or recovery) and run Startup Repair, or bootrec /rebuildbcd (plus /fixmbr and /fixboot if needed).",kw:[["startup repair","bootrec","rebuildbcd","bcd","winre","recovery"]]},
  {d:3,o:"3.1",q:"A PC started blue-screening at boot right after a new graphics driver was installed. What should you do?",c:["Replace the GPU","Boot into Safe Mode and roll back the driver","Run chkdsk /r","Reset the BIOS"],a:1,why:"Safe Mode loads minimal drivers so you can roll back the bad one in Device Manager.",key:"Boot into Safe Mode (or WinRE) and roll back or uninstall the new driver.",kw:[["roll back","rollback","safe mode","uninstall"]]},
  {d:3,o:"3.1",q:"A user says an app has crashed now and then for weeks. Which tool shows a day-by-day history of app failures?",c:["Reliability Monitor","Resource Monitor","Disk Management","Task Scheduler"],a:0,why:"Reliability Monitor plots failures and installs over time.",key:"Reliability Monitor.",kw:[["reliability"]]},
  {d:3,o:"3.1",q:"A PC keeps showing low-memory warnings and you can't add RAM right now. What helps?",c:["Increase virtual memory (the paging file) and close memory-heavy apps","Defragment the SSD","Disable the firewall","Run gpupdate"],a:0,why:"A bigger paging file gives more swap room. Task Manager shows which apps use the most memory.",key:"Close large-memory processes and increase virtual memory (paging file size).",kw:[["virtual memory","paging","page file","pagefile","close"]]},
  {d:3,o:"3.1",q:"A USB webcam on a busy hub reports 'not enough USB controller resources'. What is the likely fix?",c:["Install a new webcam driver","Move the device to a port on a different USB controller (e.g. a USB 2.0 port)","Disable USB selective suspend","Replace the cable with a longer one"],a:1,why:"The controller has run out of endpoints. Spread devices across controllers.",key:"Move the webcam to a port on another USB controller (for example a USB 2.0 port) so that controller has free endpoints.",kw:[["port","controller"]]},
  {d:3,o:"3.1",q:"At a branch office, domain logons take several minutes and the user has a roaming profile. What is the likely cause?",c:["A failing local drive","Logon is using a distant domain controller over a slow WAN link","A bad keyboard driver","The screen saver policy"],a:1,why:"Profile sync, scripts and policies over high-latency links slow logons. Check which DC authenticated.",key:"A slow profile load: logon is going to a remote domain controller over a high-latency link, so roaming profile and policy downloads are slow. Fix local DC/site connectivity.",kw:[["domain controller","dc","latency","wan","network","profile"]]},
  {d:3,o:"3.1",q:"A workstation fails domain authentication. Its clock is 9 minutes behind. What's going on?",c:["Expired certificate","Time drift is breaking Kerberos; enable automatic time sync","DNS cache poisoning","A disabled account"],a:1,why:"Kerberos tolerates only 5 minutes of clock difference by default.",key:"Time drift. Kerberos fails beyond 5 minutes of skew, so re-sync the clock (turn on automatic time / NTP).",kw:[["time","clock","ntp","sync"]]},
  {d:3,o:"3.1",q:"At startup, Windows reports 'One or more services failed to start'. What should you check first?",c:["Event Viewer, plus the service's dependencies and logon account","The monitor cable","The recycle bin","Windows Hello"],a:0,why:"Failed services usually come from bad drivers, missing dependencies or account/permission problems.",key:"Check Event Viewer and services.msc: confirm the service's dependencies, logon account permissions and drivers, then try starting it manually.",kw:[["event","depend","service"]]},
  {d:3,o:"3.3",q:"A developer needs USB debugging on an Android test phone. How is Developer options turned on?",c:["Install Xcode","Tap Build number seven times in Settings > About phone","Root the device","Use Recovery mode"],a:1,why:"Tapping Build number seven times unlocks Developer options. Leave it off on production devices.",key:"Settings > About phone, tap Build number seven times, then turn on USB debugging in Developer options.",kw:[["build number"]]},
  {d:3,o:"3.3",q:"An Android phone shows heavy data use and fast battery drain right after the user installed a game APK from a website. What's the best response?",c:["Clear the browser cache","Treat it as malware: uninstall the sideloaded app, run anti-malware, and factory reset if needed","Turn on airplane mode permanently","Update the keyboard app"],a:1,why:"Sideloaded APKs are a common malware source. High network traffic is a symptom.",key:"Treat it as sideloaded malware: remove the app, run an anti-malware scan, check data-usage reports and factory reset if it persists.",kw:[["malware","uninstall","remove","factory","scan"]]},
  {d:3,o:"3.2",q:"A company-managed iPhone can't install an app from the App Store, but personal phones can. What is the likely cause?",c:["The battery is low","An MDM policy blocks the app","The SIM card is expired","Rotation lock is on"],a:1,why:"MDM can restrict which apps may be installed.",key:"An MDM policy restricts that app. Check it against the organization's allowed list.",kw:[["mdm","policy","polic"]]},
  {d:3,o:"3.2",q:"A tablet won't switch to landscape in any app. What should you check first?",c:["Rotation (orientation) lock","Developer mode","NFC","Storage space"],a:0,why:"Rotation lock stops autorotation. If nothing rotates even with it off, suspect the sensor.",key:"Check whether rotation (orientation) lock is on, then restart the device.",kw:[["rotation","orientation","lock"]]},
  {d:3,o:"3.4",q:"A user's web searches keep landing on an unfamiliar search site. What's the likely cause and the most reliable fix?",c:["DNS outage; wait it out","Browser-redirect malware; scan and clean, and restore from a known-good backup to be sure","A full cache; clear history only","A slow network; switch to Ethernet"],a:1,why:"Redirection is a classic malware sign. Cleaning may not get everything; a known-good restore guarantees removal.",key:"Malware (browser hijacker). Scan and remove it; restoring from a known-good backup or reimaging is the surest fix.",kw:[["malware","hijack","scan","restore","reimage"]]},
  {d:3,o:"3.4",q:"Every HTTPS site shows certificate errors on one PC, and its clock reads January 2009. What's the fix?",c:["Reinstall the browser","Correct the system date and time (and check the CMOS battery)","Turn off certificate checking","Clear the DNS cache"],a:1,why:"Certificate validity depends on the correct date.",key:"Fix the system date and time (sync time; replace the CMOS battery if it keeps resetting).",kw:[["date","time","clock","cmos"]]},
  {d:3,o:"3.4",q:"Pop-ups in the corner of a user's desktop say 'Your PC is infected! Call support now', and they come from a website the user allowed to send notifications. What should you do?",c:["Call the number","Revoke that site's browser notification permission and run a malware scan","Buy the advertised antivirus","Reinstall Windows immediately"],a:1,why:"These are fake desktop alerts sent as browser push notifications.",key:"Don't call. Revoke or disable the site's browser notification permission and scan for malware.",kw:[["notification"]]},
  {d:3,o:"3.4",q:"A PC's antivirus has been turned off, Windows updates fail, and some security sites won't load. What does this point to?",c:["A failing hard drive","A malware infection protecting itself","A bad network cable","An expired license"],a:1,why:"Malware often blocks updates, security sites and AV tools.",key:"A malware infection blocking its own removal. Quarantine it and follow the malware removal steps, or restore/reimage.",kw:[["malware","infect","virus"]]},
  // ===== Domain 4 =====
  {d:4,o:"4.2",q:"A core switch replacement is approved for Saturday. Which document says how to restore service if the new switch fails?",c:["Rollback plan","SLA","AUP","Incident report"],a:0,why:"Every change needs a rollback (backout) plan.",key:"The rollback (backout) plan.",kw:[["rollback","roll back","backout","back out","back-out"]]},
  {d:4,o:"4.2",q:"A patch for an actively exploited, public-facing zero-day must go in today. Which change type is this?",c:["Standard","Normal","Emergency","Freeze"],a:2,why:"Emergency changes are urgent and high risk, with expedited approval.",key:"An emergency change.",kw:[["emergency"]]},
  {d:4,o:"4.3",q:"Restoring needs the last full backup plus ONLY the most recent of the backups taken since. Which backup type is in use?",c:["Incremental","Differential","Synthetic full","Snapshot"],a:1,why:"A differential captures every change since the last full backup.",key:"Differential.",kw:[["differential"]]},
  {d:4,o:"4.3",q:"Which backup type is fastest and smallest each night, but needs the full backup plus every later backup to restore?",c:["Incremental","Differential","Full","GFS"],a:0,why:"An incremental captures changes since the last backup of any type.",key:"Incremental.",kw:[["incremental"]]},
  {d:4,o:"4.3",q:"A small office keeps backups only on a NAS in the same closet as the server. Which rule are they breaking, and what's missing?",c:["GFS: missing monthly tapes","3-2-1: no offsite copy (and only one media type)","Least privilege: too many admins","Order of volatility"],a:1,why:"3-2-1 means 3 copies, 2 media types, 1 offsite.",key:"The 3-2-1 rule: they need an offsite copy (cloud or offsite media) and a second media type, for 3 copies total.",kw:[["offsite","off-site","off site","cloud"]]},
  {d:4,o:"4.4",q:"Before installing a RAM module, what should you do to prevent damage?",c:["Wear an anti-static wrist strap clipped to the chassis, with the system unplugged","Touch the PSU fan","Plug the wrist strap into the electrical ground","Raise the humidity to 90%"],a:0,why:"Equalize charge with the chassis. Never connect yourself to an electrical system's ground.",key:"Unplug the PC and use an ESD wrist strap clipped to the chassis (or at least touch bare chassis metal). Handle the module by its edges.",kw:[["esd","strap","anti-static","antistatic","static","ground"]]},
  {d:4,o:"4.4",q:"A UPS in the server room catches fire. What extinguisher do you use?",c:["Water","Foam","CO2 or another Class C agent","Class A only"],a:2,why:"Electrical fires need non-conductive agents such as CO2, FM-200 or dry chemical.",key:"A CO2 (Class C) or other non-conductive agent such as FM-200 or dry chemical. Never water or foam. Cut power if it's safe.",kw:[["co2","carbon dioxide","class c","fm-200","fm200","dry chem","halon"]]},
  {d:4,o:"4.5",q:"Where do you find the correct way to dispose of a specific toner product and old UPS batteries?",c:["The EULA","The product's Safety Data Sheet (SDS/MSDS) and local regulations","The SLA","The AUP"],a:1,why:"The SDS covers handling, hazards and disposal. Follow local hazardous-waste rules.",key:"The product's Safety Data Sheet (SDS/MSDS), following local environmental regulations (recycle toner, take batteries to hazardous-waste disposal).",kw:[["sds","msds","safety data"]]},
  {d:4,o:"4.6",q:"While repairing a laptop, a tech finds what looks like prohibited content. What should they do first?",c:["Delete it","Stop, keep the evidence as is, and report it through proper channels to start chain of custody","Email it to the manager","Wipe the drive"],a:1,why:"First response: identify, report to the proper channels, preserve the evidence, and document chain of custody.",key:"Stop working, preserve the evidence without altering it, report it through proper channels (management or legal), and begin chain-of-custody documentation.",kw:[["report","chain of custody","preserve","evidence"]]},
  {d:4,o:"4.1",q:"Your ISP contract promises a technician on site within 4 hours of an outage. Which document sets this?",c:["NDA","SLA","SOP","MSDS"],a:1,why:"A service level agreement defines minimum service terms such as response times.",key:"The service level agreement (SLA).",kw:[["sla","service level"]]},
