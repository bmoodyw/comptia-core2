const ERRATA = [
  {sev:"Wrong",pg:"2",obj:"1.1",said:"APFS was \"added to macOS High Sierra (10.12.4)\".",fix:"10.12.4 is macOS Sierra, which only had an experimental APFS through diskutil. APFS shipped as the default in macOS 10.13 High Sierra (Sept 2017), and earlier in iOS 10.3.",src:"https://en.wikipedia.org/wiki/Apple_File_System"},
  {sev:"Wrong",pg:"21",obj:"1.9",said:"Under Linux ping: \"ping -t\" pings until stopped; \"ping -n <count>\" sets the count.",fix:"Those are Windows switches. Linux ping runs until Ctrl+C by default, -c sets the count, and -t sets the TTL.",src:"https://man7.org/linux/man-pages/man8/ping.8.html"},
  {sev:"Outdated",pg:"49",obj:"3.1",said:"BSOD fix: \"Use Last Known Good…\"",fix:"Last Known Good Configuration was removed in Windows 8. On Windows 10/11 use Safe Mode, System Restore, Roll Back Driver or WinRE Startup Repair.",src:""},
  {sev:"Outdated",pg:"49",obj:"3.1",said:"\"Missing NTLDR: the main Windows boot loader is missing\"; \"Recovery Console: bootrec /rebuildbcd\".",fix:"NTLDR and the Recovery Console belong to Windows XP. Windows 10/11 show \"BOOTMGR is missing\", and you run bootrec from the WinRE Command Prompt.",src:""},
  {sev:"Outdated",pg:"5",obj:"1.3",said:"Windows 10 versions listed through \"November 2021 (Version 21H2)\".",fix:"The final Windows 10 release is 22H2 (October 2022).",src:""},
  {sev:"Outdated",pg:"5",obj:"1.3",said:"Windows 10 Home and Pro support ends October 14, 2025.",fix:"That date passed. Consumer Extended Security Updates were later extended, and Microsoft announced in June 2026 that free consumer ESU runs to Oct 12, 2027. Windows 10 is still in the 1.3 objectives.",src:"https://ground.news/article/microsoft-extends-support-for-windows-10-by-an-additional-year-old-pcs-are-still-in-the-game"},
  {sev:"Outdated",pg:"6",obj:"1.3",said:"Windows 11 Home \"can be installed with a local account\".",fix:"Windows 11 Home setup requires a Microsoft account and Internet. In 2025 Microsoft removed the known OOBE bypasses for creating a local account during setup.",src:"https://pureinfotech.com/microsoft-blocks-windows-11-microsoft-account-bypass/"},
  {sev:"Outdated",pg:"43",obj:"2.7",said:"\"Stronger passwords are at least 8 characters\", plus 30/60/90-day expiration.",fix:"NIST SP 800-63B Rev. 4 (Aug 2025) requires at least 15 characters when the password is the only factor, and drops composition rules and forced periodic expiration. Exam questions still use the classic length + complexity + expiration answers, so know both.",src:"https://www.enzoic.com/blog/nist-sp-800-63b-rev4/"},
  {sev:"Imprecise",pg:"44",obj:"2.8",said:"\"iOS: Erase everything after 10 failed attempts.\"",fix:"Only if the Erase Data setting is turned on, or MDM enforces it. By default iOS applies escalating lockout delays.",src:""},
  {sev:"Imprecise",pg:"31",obj:"2.3",said:"WPA3 \"provides encryption even on open networks\".",fix:"Open-network encryption comes from OWE (Wi-Fi Enhanced Open), a companion Wi-Fi Alliance certification. WPA3's own headline feature is SAE replacing the PSK handshake.",src:""},
  {sev:"Imprecise",pg:"31",obj:"2.3",said:"TACACS+ was \"released as an open standard in 1993\".",fix:"Cisco introduced TACACS+ in 1993 as a proprietary extension. It was documented publicly later and only formalized as RFC 8907 in 2020. For the exam: TCP 49, full-payload encryption, separate AAA, common on Cisco gear.",src:"https://www.rfc-editor.org/rfc/rfc8907"},
  {sev:"Imprecise",pg:"4",obj:"1.2",said:"GPT \"requires UEFI BIOS or BIOS-compatibility mode\".",fix:"Booting Windows from a GPT disk requires UEFI. Legacy/CSM mode boots MBR disks. A GPT disk used only for data works either way.",src:""},
  {sev:"Mislabel",pg:"2",obj:"1.1",said:"\"Extended File System (XFS)\".",fix:"\"Extended file system\" is ext/ext4. XFS is a separate journaling file system that came from SGI.",src:""},

 {id:"rat",d:2,o:"2.4",sh:"cmd",user:"Administrator",host:"MKT-09",par:2,title:"Laptop is slow and acting strange",
  ticket:"INC-4163 · Marketing laptop MKT-09 is very slow and the mouse 'moves on its own' sometimes. You're at an elevated prompt.",

   {re:["^netstat\\s+(-a|-an|-na|-ano|-aon|-n|-o|-no|-on)$","^netstat$"],out:`Active Connections\n\n  Proto  Local Address          Foreign Address        State           PID\n  TCP    10.0.0.57:49712        52.112.98.4:443        ESTABLISHED     8812\n  TCP    10.0.0.57:49790        185.220.101.33:4444    ESTABLISHED     5120\n  TCP    10.0.0.57:49801        142.250.72.206:443     ESTABLISHED     9044\n\n(Tip: -b shows the executable name)`,fixed:`Active Connections\n\n  Proto  Local Address          Foreign Address        State\n\n(no connections: the laptop is disconnected from the network)`},

  ],

   {re:["^(sudo\\s+)?du\\s+.*/(var/?\\*?|\\*)$"],out:`1.2G\t/var/lib\n30G\t/var/log\n310M\t/var/cache\n4.0K\t/var/tmp`,fixed:`1.2G\t/var/lib\n430M\t/var/log\n310M\t/var/cache\n4.0K\t/var/tmp`},
   {re:["^(sudo\\s+)?ls\\s+-\\w*l\\w*\\s+/var/log/?$"],out:`-rw-r----- 1 syslog adm    2.1M Oct 22 23:40 auth.log\n-rw-r--r-- 1 invapi invapi  29G Oct 22 23:41 inventory-api.log\ndrwxr-sr-x 3 root   systemd 4.0K Jun  2 10:11 journal\n-rw-r----- 1 syslog adm     18M Oct 22 23:41 syslog`},
   {re:["^(sudo\\s+)?rm\\s+(-f\\s+)?/var/log/inventory-api\\.log$"],out:`(removed)\n\nNote: the API process still holds the deleted file open, so the space isn't released until the service restarts. Check df -h.`},

  fixCmd:{re:["^(sudo\\s+)?truncate\\s+-s\\s*0\\s+/var/log/inventory-api\\.log$","^(sudo\\s+)?(:\\s*)?>\\s*/var/log/inventory-api\\.log$","^(sudo\\s+)?logrotate\\s+(-f\\s+)?.*$"],out:`(log truncated: 29G freed)`},

 {id:"perm",d:1,o:"1.9",sh:"bash",user:"tech",host:"build01",par:3,title:"Deploy script won't run",

ERRATA.push(
  {set:"tia",sev:"Wrong",pg:"32",obj:"1.3",said:"Windows 10 \"released in 2015 and will be supported till 2035\".",fix:"Mainstream consumer support ended Oct 14, 2025 (the deck's own slide 10 says so). Free consumer ESU runs to Oct 12, 2027. Only special LTSC/IoT builds reach the early 2030s.",link:""},
  {set:"tia",sev:"Wrong",pg:"93",obj:"1.9",said:"\"pwd: set or change a password\".",fix:"pwd = print working directory. passwd changes a password.",link:"https://man7.org/linux/man-pages/man1/pwd.1.html"},
  {set:"tia",sev:"Wrong",pg:"93",obj:"1.9",said:"\"find: search for text in files in a directory\".",fix:"find locates files by name, type, size or date (find /var -name \"*.log\"). grep searches the text inside files.",link:""},
  {set:"tia",sev:"Wrong",pg:"96",obj:"1.9",said:"chmod 764 is the same as \"chmod u+rwx,g+rw,a+r\".",fix:"+ only adds bits and a = all users, so that leaves any existing bits in place and gives read to everyone. The exact equivalent is chmod u=rwx,g=rw,o=r.",link:""},
  {set:"tia",sev:"Wrong",pg:"56",obj:"1.4",said:"HKEY_USERS \"stores settings that apply to all users\"; HKEY_CURRENT_CONFIG \"settings for individual devices when multiple of the same type are installed\"; HKEY_LOCAL_MACHINE \"devices installed or removed\".",fix:"HKLM holds machine-wide hardware and software settings (SAM, Security, Software, System). HKU holds each loaded user's profile hive; HKCU is the signed-in user's view of it. HKCC is the current hardware profile, pulled from HKLM\\System.",link:"https://learn.microsoft.com/en-us/windows/win32/sysinfo/registry-hives"},
  {set:"tia",sev:"Wrong",pg:"83",obj:"1.8",said:"Installing apps from a vendor's website \"is NOT enabled by default; must be enabled in System Preferences\".",fix:"Gatekeeper allows signed, notarized apps from identified developers by default. You approve the first launch. Only unsigned apps need an override in Privacy & Security.",link:"https://support.apple.com/guide/security/gatekeeper-and-runtime-protection-sec5599b66df/web"},
  {set:"tia",sev:"Wrong",pg:"154",obj:"2.5",said:"SQL injection compromises a database \"usually through cross-site scripting\".",fix:"They're separate attacks. SQL injection sends SQL through unvalidated input to the database. XSS injects script that runs in other users' browsers.",link:""},
  {set:"tia",sev:"Wrong",pg:"112",obj:"2.1",said:"Equipment locks: \"construction equipment, trailer, and cargo theft prevention\".",fix:"In A+ terms: cable locks for laptops and desktops, and locked server racks and cabinets.",link:""},
  {set:"tia",sev:"Imprecise",pg:"2",obj:"Exam",said:"Passing score \"700 (78%)\".",fix:"700 is on a 100–900 scaled score. CompTIA doesn't publish a fixed percentage, and it varies by exam form.",link:"https://www.comptia.org/en-us/certifications/a/core-2-v15/"},
  {set:"tia",sev:"Imprecise",pg:"7",obj:"1.1",said:"FAT32 \"partitions are limited to 32GB\".",fix:"32 GB is the limit of Windows' built-in format tool. FAT32 itself supports volumes up to about 2 TB (16 TB with large sectors). The 4 GB per-file limit is the real FAT32 limit.",link:""},
  {set:"tia",sev:"Incomplete",pg:"158",obj:"2.6",said:"Malware removal steps: \"Disable System Restore in Windows\" … \"Enable System Restore…in Windows\", with remediation listing only update + scan/remove.",fix:"The 220-1202 objective says Windows Home for both System Restore steps, and remediation also includes Reimage/reinstall.",link:""},
  {set:"tia",sev:"Imprecise",pg:"162",obj:"2.7",said:"\"No one should have an admin account\".",fix:"Least privilege means nobody uses admin rights day to day. Admins keep a separate elevated account (or use just-in-time access) and log in with a standard account.",link:""},
  {set:"tia",sev:"Imprecise",pg:"83",obj:"1.8",said:"\"Must have an Apple ID to setup and download apps\".",fix:"An Apple ID is needed for the App Store and iCloud, not to set up a Mac or install apps downloaded from the web.",link:""},
  {set:"tia",sev:"Imprecise",pg:"81",obj:"1.7",said:"Metered connection \"limits the amount of data that can be sent and received\".",fix:"It tells Windows to cut background data (updates, sync). It doesn't enforce a cap unless you also set a data limit.",link:""},
  {set:"tia",sev:"Outdated",pg:"88",obj:"1.8",said:"Disk Utility First Aid \"can repair permissions\".",fix:"Permission repair was removed in OS X 10.11 El Capitan. First Aid now checks and repairs the file system.",link:""},
  {set:"tia",sev:"Outdated",pg:"94",obj:"1.9",said:"Package managers: apt-get and YUM.",fix:"220-1202 lists apt and dnf. dnf replaced yum on Fedora/RHEL, and apt is the modern front end to apt-get.",link:""},
  {set:"tia",sev:"Outdated",pg:"160",obj:"2.7",said:"Password length \"8–10 min\" and \"expire every 60–90 days\".",fix:"NIST SP 800-63B Rev. 4 (2025): at least 15 characters when the password is the only factor, and no forced periodic expiration. Know both the classic exam answer and current practice.",link:"https://www.enzoic.com/blog/nist-sp-800-63b-rev4/"},
  {set:"tia",sev:"Outdated",pg:"85, 235",obj:"1.8 / 4.5",said:"\"System Preferences\" and \"Material safety data sheet (MSDS)\".",fix:"macOS 13+ calls it System Settings. US OSHA uses Safety Data Sheet (SDS).",link:""},
  {set:"tia",sev:"Typo",pg:"10, 98",obj:"1.1 / 1.10",said:"\"Windows 7 EOL was 1/14/202\"; \"32 bit processors can handle large amounts of RAM vs. 32-bit\".",fix:"Windows 7 EOL was 1/14/2020. The second line means 64-bit processors handle more RAM than 32-bit.",link:""},
  {set:"tia",sev:"Off-objective",pg:"8, 87, 254",obj:"1.1 / 1.8 / 4.9",said:"HFS+, ext3, CDFS/UDF, Remote Disc, Microsoft Remote Assistance (MSRA).",fix:"These were on older A+ objectives but aren't in the 220-1202 lists. Low priority.",link:""},
  {set:"tia",sev:"Gap",pg:"—",obj:"1.1",said:"File systems section skips ReFS and XFS.",fix:"Both are in 220-1202 objective 1.1. They're covered in the Flashcards tab.",link:""},
  {set:"tia",sev:"Gap",pg:"93",obj:"1.9",said:"Linux commands slide omits su, sudo, dnf, fsck, mount, curl, traceroute and du.",fix:"All of these are listed in 1.9 and covered in Flashcards and Command practice.",link:""},
  {set:"tia",sev:"Gap",pg:"97→105",obj:"1.11",said:"No section for objective 1.11 (cloud productivity tools).",fix:"Know email systems, storage and sync, collaboration tools, identity synchronization and licensing assignment.",link:""},
  {set:"tia",sev:"Gap",pg:"105–155",obj:"2.1 / 2.4 / 2.5",said:"Missing newer 1202 security terms.",fix:"2.1: zero trust, SSO, SAML, just-in-time access, PAM, IAM, DLP, directory services. 2.4: stalkerware, fileless malware, PUP, EDR/MDR/XDR, email security gateway. 2.5: QR code phishing, business email compromise, supply chain attacks. All are in Flashcards.",link:""},
  {set:"tia",sev:"Gap",pg:"253–255",obj:"4.9",said:"Remote access section omits SPICE and WinRM.",fix:"Both are new in 220-1202 4.9 (the deck lists MSRA, which isn't).",link:""},
  {set:"tia",sev:"Gap",pg:"257–301",obj:"4.10",said:"The AI section is mostly general AI theory (ML types, NLP, prompting).",fix:"The 4.10 objective tests application integration, appropriate use, plagiarism, bias, hallucinations, accuracy, and public vs. private AI (data security, data source, data privacy). The deck covers bias, hallucinations and privacy, but not the rest.",link:""}
);

<script>
(() => {
"use strict";

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LET = "ABCDEFGH";
const store = {

  set(k, v) { try { localStorage.setItem("c2:" + k, JSON.stringify(v)); } catch {} }
};

/* ---------- stats ---------- */
let stats = store.get("stats", { items: {}, exams: [] });
function record(key, d, o, ok, kind) {
  const it = stats.items[key] || (stats.items[key] = { d, o, k: kind, r: 0, w: 0 });
  ok ? it.r++ : it.w++;
  store.set("stats", stats);
}

/* ---------- domains ---------- */
let active = new Set(store.get("domains", [1, 2, 3, 4]));
const inDom = x => active.has(x.d);
function tagHTML(x) { return `<span class="tag"><span class="dd d${x.d}">${x.d}.0 ${esc(DOMAINS[x.d].short)}</span>Obj ${esc(x.o)}</span>`; }
function buildDomainBar() {

  for (const d of [1, 2, 3, 4]) {
    const b = document.createElement("button");

    b.setAttribute("aria-pressed", active.has(d));
    b.innerHTML = `<i style="background:var(--d${d})"></i>${d}.0 <span class="fn">${esc(DOMAINS[d].name)}</span><span class="sn">${esc(DOMAINS[d].short)}</span>`;
    b.onclick = () => {
      if (active.has(d) && active.size === 1) return;
      active.has(d) ? active.delete(d) : active.add(d);

}

/* ---------- AI (sample capability) ---------- */

}

/* ---------- tabs ---------- */
const TABS = ["cards", "code", "pbq", "scen", "exam", "fixes", "stats"];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("tab", "cards");
function setTab(t) {
  tab = t; store.set("tab", t);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  TABS.forEach(x => { $("#view-" + x).hidden = x !== t; });

}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ================= FLASHCARDS ================= */
const fc = { mode: store.get("fcmode", "mc"), deck: [], i: 0, r: 0, n: 0, answered: false, match: null };
function fcDeck() { fc.deck = shuffle(CARDS.filter(inDom)); fc.i = 0; fc.r = 0; fc.n = 0; fc.answered = false; fc.match = null; }
const normT = s => String(s).toLowerCase().replace(/[‘’“”]/g, "'").replace(/[\s._\-–—()'"/\\]+/g, "").replace(/^(the|an?)(?=\w)/, "");
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
function termMatches(card, input) {
  const g = normT(input); if (!g) return false;
  return [card.t, ...(card.alt || [])].some(x => { const t = normT(x); return t === g || (t.length >= 7 && lev(t, g) <= 1); });
}
function renderCards() {
  const v = $("#view-cards");
  if (!fc.deck.length) fcDeck();
  const modeBtn = (m, l) => `<button type="button" id="fcm-${m}" aria-pressed="${fc.mode === m}" data-m="${m}">${l}</button>`;
  v.innerHTML = `<div class="bar"><span class="lbl">Mode</span><span class="seg">${modeBtn("mc", "Multiple choice")}${modeBtn("type", "Type it")}${modeBtn("match", "Match")}</span>
    <span class="score" id="fcscore"></span></div><div class="panel" id="fcpanel" style="margin-top:12px"></div>`;
  v.querySelectorAll(".seg button").forEach(b => b.onclick = () => { fc.mode = b.dataset.m; store.set("fcmode", fc.mode); fcDeck(); renderCards(); });
  if (fc.mode === "match") return renderMatch();
  if (fc.i >= fc.deck.length) {
    $("#fcpanel").innerHTML = `<div class="empty"><h2>Deck done: ${fc.r}/${fc.n}</h2><p>${fc.n ? Math.round(100 * fc.r / fc.n) : 0}% this round.</p><button class="btn" id="fcagain">Shuffle again</button></div>`;
    $("#fcagain").onclick = () => { fcDeck(); renderCards(); };
    return;
  }
  $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`;
  fc.mode === "mc" ? renderMC() : renderType();
}
function nextCard() { fc.i++; fc.answered = false; renderCards(); }
function renderMC() {
  const c = fc.deck[fc.i], p = $("#fcpanel");
  let pool = CARDS.filter(x => x.t !== c.t && x.d === c.d && x.def !== c.def);
  if (pool.length < 3) pool = CARDS.filter(x => x.t !== c.t);
  const opts = shuffle([c, ...shuffle(pool).slice(0, 3)]);
  p.innerHTML = `${tagHTML(c)}<div class="prompt term">${esc(c.t)}</div><p class="note" style="margin:-8px 0 12px">Pick the matching definition (keys 1–4).</p>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}" type="button"><span class="bub">${LET[i]}</span><span>${esc(o.def)}</span></button>`).join("")}</div><div id="fcfb"></div>`;
  const btns = [...p.querySelectorAll(".opt")];
  const pick = i => {
    if (fc.answered) return; fc.answered = true;
    const ok = opts[i] === c; fc.n++; if (ok) fc.r++;
    record("c:" + c.t, c.d, c.o, ok, "card");
    btns.forEach((b, j) => { b.disabled = true; if (opts[j] === c) b.classList.add("ok"); else if (j === i) b.classList.add("no"); });
    $("#fcfb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b class="v">${ok ? "Correct" : "Not this one"}</b>${ok ? "" : `You picked the definition of <span class="mono">${esc(opts[i].t)}</span>.`}</div><div class="row"><button class="btn" id="fcnext">Next card →</button></div>`;
    $("#fcnext").onclick = nextCard; $("#fcnext").focus();
    $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`;
  };
  btns.forEach((b, i) => b.onclick = () => pick(i));
  fc.keyHandler = e => { if (tab === "cards" && fc.mode === "mc" && !fc.answered && /^[1-4]$/.test(e.key) && !e.target.matches("input,textarea")) pick(+e.key - 1); };
}
function renderType() {
  const c = fc.deck[fc.i], p = $("#fcpanel");
  p.innerHTML = `${tagHTML(c)}<div class="prompt">${esc(c.def)}</div>
    <label class="lbl" for="fcin">Type the term, tool or command</label>
    <input class="txt mono" id="fcin" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:6px">
    <div class="row"><button class="btn" id="fccheck">Check</button><button class="btn ghost" id="fcskip">I don't know</button></div><div id="fcfb"></div>`;
  const inp = $("#fcin"); inp.focus();
  const grade = give => {
    if (fc.answered) return; fc.answered = true;
    const ok = !give && termMatches(c, inp.value); fc.n++; if (ok) fc.r++;
    record("c:" + c.t, c.d, c.o, ok, "card");
    inp.disabled = true; $("#fccheck").disabled = true; $("#fcskip").disabled = true;
    const alts = (c.alt || []).length ? ` <span class="note">(also accepted: ${c.alt.map(esc).join(", ")})</span>` : "";
    $("#fcfb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b class="v">${ok ? "Correct" : "Answer"}</b><span class="mono">${esc(c.t)}</span>${alts}</div>
      <div class="row"><button class="btn" id="fcnext">Next card →</button>${!ok && !give && inp.value.trim() ? `<button class="btn ghost" id="fcover">I was right, count it</button>` : ""}</div>`;
    $("#fcnext").onclick = nextCard; $("#fcnext").focus();
    const ov = $("#fcover");
    if (ov) ov.onclick = () => { fc.r++; const it = stats.items["c:" + c.t]; it.w--; it.r++; store.set("stats", stats); ov.remove(); $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`; };
    $("#fcscore").textContent = `${fc.r}/${fc.n} · card ${fc.i + 1} of ${fc.deck.length}`;
  };
  $("#fccheck").onclick = () => grade(false);
  $("#fcskip").onclick = () => grade(true);
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); grade(false); } };
}
function newMatchSet() {
  const pool = CARDS.filter(inDom), pick = [], defs = new Set();
  for (const c of shuffle(pool)) { if (!defs.has(c.def) && !pick.some(p => p.t === c.t)) { pick.push(c); defs.add(c.def); } if (pick.length === 5) break; }
  fc.match = { set: pick, terms: shuffle(pick), defs: shuffle(pick), done: new Set(), sel: null, miss: 0 };
}
function renderMatch() {
  if (!fc.match) newMatchSet();
  const m = fc.match, p = $("#fcpanel");
  $("#fcscore").textContent = `${m.done.size}/${m.set.length} matched · ${m.miss} miss${m.miss === 1 ? "" : "es"}`;
  p.innerHTML = `<p class="note" style="margin:0 0 12px">Select a term, then its definition. Each set has 5 pairs.</p>
    <div class="match"><div class="col">${m.terms.map(c => `<button type="button" class="mi t${m.done.has(c.t) ? " done" : ""}" data-t="${esc(c.t)}" data-side="t" ${m.done.has(c.t) ? "disabled" : ""}>${esc(c.t)}</button>`).join("")}</div>
    <div class="col">${m.defs.map(c => `<button type="button" class="mi${m.done.has(c.t) ? " done" : ""}" data-t="${esc(c.t)}" data-side="d" ${m.done.has(c.t) ? "disabled" : ""}>${esc(c.def)}</button>`).join("")}</div></div>
    <div id="mfb"></div>`;
  if (m.done.size === m.set.length) {
    $("#mfb").innerHTML = `<div class="fb ${m.miss ? "part" : "good"}"><b class="v">Set complete</b>${m.miss ? m.miss + " mismatch" + (m.miss > 1 ? "es" : "") + " along the way." : "No mismatches."}</div><div class="row"><button class="btn" id="mnext">New set →</button></div>`;
    $("#mnext").onclick = () => { fc.match = null; renderCards(); }; $("#mnext").focus();
    return;
  }
  p.querySelectorAll(".mi:not(.done)").forEach(b => {
    if (m.sel && m.sel.side === b.dataset.side && m.sel.t === b.dataset.t) b.classList.add("sel");
    b.onclick = () => {
      const side = b.dataset.side, t = b.dataset.t;
      if (!m.sel || m.sel.side === side) { m.sel = { side, t }; renderMatch(); return; }
      const card = m.set.find(c => c.t === t);
      if (m.sel.t === t) { m.done.add(t); record("c:" + t, card.d, card.o, true, "card"); m.sel = null; renderMatch(); }
      else {
        m.miss++; const wrong = m.set.find(c => c.t === m.sel.t);
        record("c:" + wrong.t, wrong.d, wrong.o, false, "card");
        b.classList.add("miss"); const prev = m.sel; m.sel = null;
        setTimeout(() => { renderMatch(); }, 320); void prev;
      }
    };
  });
}

/* ================= COMMAND PRACTICE ================= */
const cp = { sh: store.get("cpsh", "all"), list: [], i: 0, r: 0, n: 0, answered: false };
const PROMPT = { cmd: "C:\\Users\\tech>", bash: "tech@ubuntu:~$", ps: "PS C:\\Users\\tech>" };
const SHN = { cmd: "Windows Command Prompt", bash: "Linux bash", ps: "PowerShell" };
function cpList() {
  let items = [];
  if (cp.sh !== "read") items = CMDS.map((x, k) => ({ ...x, kind: "cmd", key: "k:" + k })).filter(x => cp.sh === "all" || x.sh === cp.sh);
  if (cp.sh === "all" || cp.sh === "read") items = items.concat(SCRIPTS.map((x, k) => ({ ...x, kind: "read", key: "s:" + k })));
  cp.list = shuffle(items.filter(inDom)); cp.i = 0; cp.r = 0; cp.n = 0; cp.answered = false;
}
const normC = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, " ").trim();
function cmdOK(x, input) { const s = normC(input); return x.ok.some(r => new RegExp(r, "i").test(s)); }
function renderCode() {
  const v = $("#view-code");
  if (!cp.list.length && cp.i === 0) cpList();
  const sb = (k, l) => `<button type="button" id="cps-${k}" aria-pressed="${cp.sh === k}" data-k="${k}">${l}</button>`;
  v.innerHTML = `<div class="bar"><span class="lbl">Shell</span><span class="seg">${sb("all", "All")}${sb("cmd", "CMD")}${sb("bash", "Linux")}${sb("ps", "PowerShell")}${sb("read", "Read a script")}</span><span class="score" id="cpscore"></span></div><div class="panel" id="cppanel" style="margin-top:12px"></div>`;
  v.querySelectorAll(".seg button").forEach(b => b.onclick = () => { cp.sh = b.dataset.k; store.set("cpsh", cp.sh); cpList(); renderCode(); });
  const p = $("#cppanel");
  if (!cp.list.length) { p.innerHTML = `<div class="empty">No exercises for this shell in the selected domains. Command practice is mostly Domain 1.0 (objectives 1.5 and 1.9) and 4.0 (4.8 scripting).</div>`; return; }
  if (cp.i >= cp.list.length) {
    p.innerHTML = `<div class="empty"><h2>Set done: ${cp.r}/${cp.n}</h2><button class="btn" id="cpagain">Shuffle again</button></div>`;
    $("#cpagain").onclick = () => { cpList(); renderCode(); }; return;
  }
  $("#cpscore").textContent = `${cp.r}/${cp.n} · ${cp.i + 1} of ${cp.list.length}`;
  const x = cp.list[cp.i];
  x.kind === "cmd" ? renderCmd(x, p) : renderRead(x, p);
}
function cpNext() { cp.i++; cp.answered = false; renderCode(); }
function renderCmd(x, p) {
  p.innerHTML = `${tagHTML(x)} <span class="tag">· ${SHN[x.sh]}</span>
    <div class="prompt">${esc(x.task)}</div>
    <div class="term" id="term"><div class="dim">${x.sh === "bash" ? "# " : x.sh === "ps" ? "# " : "REM "}${esc(x.task)}</div>
    <div class="line"><span class="ps">${esc(PROMPT[x.sh])}</span><input id="cpin" aria-label="Command" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div id="termout"></div></div>
    <div class="row"><button class="btn" id="cpcheck">Run check ⏎</button><button class="btn ghost" id="cpshow">Show answer</button></div><div id="cpfb"></div>`;
  const inp = $("#cpin"); inp.focus();
  const grade = reveal => {
    if (cp.answered) return; cp.answered = true;
    const ok = !reveal && cmdOK(x, inp.value); cp.n++; if (ok) cp.r++;
    record(x.key, x.d, x.o, ok, "cmd");
    inp.disabled = true; $("#cpcheck").disabled = true; $("#cpshow").disabled = true;
    $("#termout").innerHTML = `<pre class="${ok ? "hi" : "dim"}">${ok ? "✓ accepted" : reveal ? "answer:" : "✗ not quite. Expected:"}</pre><pre>${esc(PROMPT[x.sh])} ${esc(x.ans)}</pre>`;
    $("#cpfb").innerHTML = `<div class="fb ${ok ? "good" : "bad"}"><b class="v">${ok ? "Correct" : "Reference answer"}</b>${esc(x.why)}</div><div class="row"><button class="btn" id="cpnext">Next →</button></div>`;
    $("#cpnext").onclick = cpNext; $("#cpnext").focus();
    $("#cpscore").textContent = `${cp.r}/${cp.n} · ${cp.i + 1} of ${cp.list.length}`;
  };
  $("#cpcheck").onclick = () => grade(false);
  $("#cpshow").onclick = () => grade(true);
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); grade(false); } };
}
function renderRead(x, p) {
  p.innerHTML = `${tagHTML(x)} <span class="tag">· Read a script</span>
    <div class="term" style="margin-top:12px"><div class="dim">${x.lang === "?" ? "# unknown file" : "# script" + esc(x.lang)}</div><pre>${esc(x.code)}</pre></div>
    <div class="prompt">${esc(x.q)}</div>
    <div class="opts">${x.c.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="bub">${LET[i]}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="cpfb"></div>`;

    $("#cpnext").onclick = cpNext; $("#cpnext").focus();
    $("#cpscore").textContent = `${cp.r}/${cp.n} · ${cp.i + 1} of ${cp.list.length}`;
  });
}

/* ================= MOCK EXAM ================= */
const ex = { phase: "setup", len: store.get("exlen", 30), mode: store.get("exmode", "mc"), timed: store.get("extimed", true), qs: [], ans: [], flags: new Set(), cur: 0, end: 0, tick: null, graded: [], busy: false, ctl: null };
function pickExam(N) {
  const doms = [...active], pools = {};
  doms.forEach(d => pools[d] = shuffle(EXAM.map((q, k) => ({ ...q, k })).filter(q => q.d === d)));
  const tot = doms.reduce((s, d) => s + DOMAINS[d].w, 0);
  const want = {}; let assigned = 0;
  doms.forEach(d => { want[d] = Math.min(pools[d].length, Math.floor(N * DOMAINS[d].w / tot)); assigned += want[d]; });
  const order = doms.slice().sort((a, b) => (N * DOMAINS[b].w / tot % 1) - (N * DOMAINS[a].w / tot % 1));
  let guard = 0;
  while (assigned < N && guard++ < 200) { let added = false; for (const d of order) { if (assigned >= N) break; if (want[d] < pools[d].length) { want[d]++; assigned++; added = true; } } if (!added) break; }
  return shuffle(doms.flatMap(d => pools[d].slice(0, want[d])));
}
function renderExam() {
  clearInterval(ex.tick);
  const v = $("#view-exam");
  if (ex.phase === "setup") return examSetup(v);
  if (ex.phase === "run") return ex.mode === "mc" ? examMC(v) : examTyped(v);
  return examResults(v);
}
function examSetup(v) {

  if (!lens.includes(ex.len)) ex.len = lens[Math.min(1, lens.length - 1)];
  const sb = (k, val, l, cur) => `<button type="button" id="${k}-${val}" data-${k}="${val}" aria-pressed="${cur === val}">${l}</button>`;
  v.innerHTML = `<div class="panel setup">
    <h2>Mock exam</h2>
    <p class="note" style="margin:0">Questions are drawn to match the official domain weights (28 / 28 / 23 / 21) across the domains selected above. The bank has ${poolN} scenario questions for this selection.</p>
    <div class="bar"><span class="lbl">Answer mode</span><span class="seg">${sb("mode", "mc", "Multiple choice", ex.mode)}${sb("mode", "typed", "Typed answers (AI graded)", ex.mode)}</span></div>
    <div class="bar"><span class="lbl">Length</span><span class="seg">${lens.map(n => sb("len", String(n), n === 90 ? "90 (full)" : String(n), String(ex.len))).join("")}</span></div>
    <div class="bar" ${ex.mode === "typed" ? "hidden" : ""}><span class="lbl">Timer</span><span class="seg">${sb("timed", "on", "1 min / question", ex.timed ? "on" : "off")}${sb("timed", "off", "Untimed", ex.timed ? "on" : "off")}</span></div>

function localGrade(q, a) {
  const s = a.toLowerCase();

  const hit = q.kw.filter(g => g.some(w => s.includes(w.toLowerCase()))).length;
  const score = Math.round(100 * hit / q.kw.length);
  const verdict = score === 100 ? "correct" : score > 0 ? "partial" : "incorrect";
  return { verdict, score, by: "local", missing: [],

}

Question: ${q.q}
Reference answer: ${q.key}
Explanation: ${q.why}
Student answer: """${a.slice(0, 1500)}"""

Grade strictly but fairly. Accept synonyms, equivalent commands and any alternative CompTIA would also accept. Wrong technical details (wrong command, wrong order, wrong protocol) cost points even when the core idea is right. Do not reward vague answers. If the student answer is blank or off-topic, it is incorrect.

  let q = list.find(x => x.id === pq.id);
  if (!q) { q = list[0]; pbqInit(q); }
  v.innerHTML = `<select class="txt pickm" id="pbqsel" aria-label="Choose a lab">${list.map(x => `<option value="${x.id}"${x.id === q.id ? " selected" : ""}>${x.d}.0 · ${esc(x.title)}${best[x.id] != null ? " (" + best[x.id] + "%)" : ""}</option>`).join("")}</select><div class="pbqpick">${list.map(x => `<button type="button" class="chip" id="pbq-${x.id}" aria-pressed="${x.id === q.id}"><i style="background:var(--d${x.d})"></i>${esc(x.title)}${best[x.id] != null ? ` <span class="mono note">${best[x.id]}%</span>` : ""}</button>`).join("")}</div>
    <div class="panel"><div class="bar">${tagHTML(q)}<span class="tag">· Performance-based</span></div>
      <h2 style="margin:10px 0 6px">${esc(q.title)}</h2><p class="brief">${esc(q.brief)}</p>
      <div class="win"><div class="wintitle"><span>${esc(q.win)}</span><span class="wbtns"><i></i><i></i><i></i></span></div><div class="winbody" id="pbqbody"></div></div>
      <div class="row"><button class="btn" id="pbqsub" ${pq.graded ? "disabled" : ""}>Submit</button><button class="btn ghost" id="pbqreset">Reset</button>${pq.graded ? `<button class="btn ghost" id="pbqnext">Next PBQ →</button>` : ""}</div>
      <div id="pbqres"></div></div>`;
  list.forEach(x => { $("#pbq-" + x.id).onclick = () => { pbqInit(x); renderPBQ(); }; });
  $("#pbqsel").onchange = e => { pbqInit(list.find(x => x.id === e.target.value)); renderPBQ(); };
  const body = $("#pbqbody");
  body.innerHTML = q.fields.map(f => {
    const ok = pq.graded ? fieldOK(f, pq.vals[f.id]) : null;
    const mark = ok === null ? "" : `<span class="fmark ${ok ? "y" : "n"}" aria-label="${ok ? "correct" : "incorrect"}">${ok ? "✓" : "✗"}</span>`;
    const why = pq.graded ? `<div class="fwhy ${ok ? "y" : "n"}">${ok ? "" : `<b>Answer:</b> ${esc(Array.isArray(f.ans) ? (f.type === "order" ? "see order above" : f.ans.join(", ") || "none") : f.ans)}. `}${esc(f.why)}</div>` : "";
    const fid = `pf-${q.id}-${f.id}`;
    let ctl = "";
    if (f.type === "select") ctl = `<select id="${fid}" ${pq.graded ? "disabled" : ""}><option value="">Select…</option>${f.opts.map(o => `<option${pq.vals[f.id] === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.type === "text") ctl = `<input id="${fid}" class="${f.mono ? "mono" : ""}" value="${esc(pq.vals[f.id])}" autocomplete="off" autocapitalize="off" spellcheck="false" ${pq.graded ? "disabled" : ""}>`;
    else if (f.type === "check") ctl = `<span class="checks">${f.opts.map((o, i) => `<label><input type="checkbox" id="${fid}-${i}" value="${esc(o)}" ${pq.vals[f.id].includes(o) ? "checked" : ""} ${pq.graded ? "disabled" : ""}> ${esc(o)}</label>`).join("")}</span>`;
    else if (f.type === "order") {
      return `<ol class="order" id="${fid}">${pq.vals[f.id].map((s, i) => {
        const good = pq.graded ? s === f.ans[i] : null;
        return `<li class="${good === null ? "" : good ? "y" : "n"}"><span class="on">${i + 1}</span><span class="ot">${esc(s)}${good === false ? `<span class="note"> → belongs at #${f.ans.indexOf(s) + 1}</span>` : ""}</span><span class="ob"><button type="button" data-mv="${i}" data-d="-1" aria-label="Move up" ${i === 0 || pq.graded ? "disabled" : ""}>▲</button><button type="button" data-mv="${i}" data-d="1" aria-label="Move down" ${i === pq.vals[f.id].length - 1 || pq.graded ? "disabled" : ""}>▼</button></span></li>`;
      }).join("")}</ol>${pq.graded ? `<div class="fwhy">${esc(f.why)}</div>` : ""}`;
    }
    return `<div class="frow"><label for="${fid}${f.type === "check" ? "-0" : ""}">${esc(f.label)}</label><div class="fctl">${ctl}${mark}</div>${why}</div>`;
  }).join("");
  q.fields.forEach(f => {
    const fid = `pf-${q.id}-${f.id}`;
    if (f.type === "select") $("#" + fid).onchange = e => { pq.vals[f.id] = e.target.value; };
    else if (f.type === "text") $("#" + fid).oninput = e => { pq.vals[f.id] = e.target.value; };
    else if (f.type === "check") f.opts.forEach((o, i) => { $(`#${fid}-${i}`).onchange = e => { const s = new Set(pq.vals[f.id]); e.target.checked ? s.add(o) : s.delete(o); pq.vals[f.id] = f.opts.filter(x => s.has(x)); }; });
    else if (f.type === "order") body.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
      const i = +b.dataset.mv, j = i + +b.dataset.d, a = pq.vals[f.id];[a[i], a[j]] = [a[j], a[i]];
      renderPBQ(); const nb = $(`#${fid} [data-mv="${j}"][data-d="${b.dataset.d}"]`) || $(`#${fid} [data-mv="${j}"]`); if (nb) nb.focus();
    });
  });
  $("#pbqreset").onclick = () => { pbqInit(q); renderPBQ(); };
  if ($("#pbqnext")) $("#pbqnext").onclick = () => { const nx = list[(list.indexOf(q) + 1) % list.length]; pbqInit(nx); renderPBQ(); window.scrollTo({ top: 0 }); };
  if (pq.graded) {
    let pts = 0, tot = 0;
    q.fields.forEach(f => { if (f.type === "order") { tot += f.ans.length; pts += pq.vals[f.id].filter((x, i) => x === f.ans[i]).length; } else { tot++; if (fieldOK(f, pq.vals[f.id])) pts++; } });
    const pct = Math.round(100 * pts / tot);
    $("#pbqres").innerHTML = `<div class="fb ${pct === 100 ? "good" : pct >= 70 ? "part" : "bad"}"><b class="v">${pct}% · ${pts}/${tot} correct</b>${pct === 100 ? "Clean run." : "Fix the items marked ✗ and use Reset to try again."}</div>`;
  }
  $("#pbqsub").onclick = () => {
    const blank = q.fields.some(f => f.type !== "order" && f.type !== "check" && !String(pq.vals[f.id]).trim());
    if (blank && !pq.confirmBlank) { pq.confirmBlank = true; $("#pbqres").innerHTML = `<div class="fb part">Some fields are empty. Press Submit again to grade anyway.</div>`; return; }
    pq.confirmBlank = false; pq.graded = true;
    let pts = 0, tot = 0;
    q.fields.forEach(f => { if (f.type === "order") { tot += f.ans.length; pts += pq.vals[f.id].filter((x, i) => x === f.ans[i]).length; } else { tot++; if (fieldOK(f, pq.vals[f.id])) pts++; } });
    const pct = Math.round(100 * pts / tot);
    record("p:" + q.id, q.d, q.o, pct === 100, "lab");
    const b = store.get("pbqbest", {}); b[q.id] = Math.max(b[q.id] || 0, pct); store.set("pbqbest", b);
    renderPBQ();
  };
}

/* ================= TERMINAL SCENARIOS ================= */
const sc = { id: null, st: null };
function scList() { return SCENS.filter(inDom); }
function scInit(s) { sc.id = s.id; sc.st = { lines: [], hist: [], hi: 0, n: 0, fixed: false, fixBy: null, diag: null, fix: null, verified: false, hints: 0, stage: "explore", done: false }; }
const promptFor = s => s.sh === "cmd" ? `C:\\Users\\${s.user}>` : `${s.user}@${s.host}:~$`;
function scRun(s, raw) {
  const st = sc.st, c = normC(raw);
  st.lines.push({ p: promptFor(s), c: raw });
  if (!c) return;
  st.n++; st.hist.push(raw); st.hi = st.hist.length;
  if (/^(cls|clear)$/i.test(c)) { st.lines = []; return; }
  let out = null;
  if (s.fixCmd && s.fixCmd.re.some(r => new RegExp(r, "i").test(c))) { st.fixed = true; st.fixBy = st.fixBy || "cmd"; out = s.fixCmd.out; }
  if (out === null) for (const e of s.cmds) if (e.re.some(r => new RegExp(r, "i").test(c))) { const o = st.fixed && e.fixed != null ? e.fixed : e.out; out = typeof o === "function" ? o(c) : o; break; }
  if (out === null) {
    if (/^hostname$/i.test(c)) out = s.host;
    else if (/^whoami$/i.test(c)) out = s.sh === "cmd" ? `corp\\${s.user.toLowerCase()}` : s.user;
    else if (/^(help|\?|hint)$/i.test(c)) out = "Stuck? Use the Hint button. Every ticket starts with gathering information.";
    else if (/^(exit|logout)$/i.test(c)) out = "Use 'Diagnose & fix' to close the ticket.";
    else if (/(\s[/-]\?|^man\s+\S+|\s--help)$/i.test(c)) out = "(Help text skipped in this simulation. Try the command with real arguments.)";
    else if (s.sh === "cmd" && /^(ping|ipconfig|nslookup|tracert|pathping|netstat|net|gpresult|gpupdate|whoami|sfc|chkdsk|type|more|tasklist)\b/i.test(c)) out = "(That command runs, but its output doesn't help with this ticket. Try another angle.)";
    else if (s.sh === "bash" && /^(ls|cat|df|du|dig|ping|ip|ps|top|grep|find|sudo|chmod|chown|tail|head|curl|traceroute)\b/i.test(c)) out = "(That command runs, but its output doesn't help with this ticket. Try another angle.)";
    else out = NOTFOUND[s.sh](c);
  }
  if (out) st.lines.push({ o: out });
  if (st.fixed && s.verify && !st.verified && st.diag !== null && s.verify.re.some(r => new RegExp(r, "i").test(c))) { st.verified = true; }
  else if (st.fixed && s.verify && !st.verified && s.verify.re.some(r => new RegExp(r, "i").test(c))) { st.preVerified = true; }
}
function scFinish(s) {
  const st = sc.st; if (st.done) return; st.done = true;
  const ok = st.diag === s.diag.a && (st.fixBy === "cmd" || st.fix === s.fix.a);
  record("t:" + s.id, s.d, s.o, ok, "lab");
  const b = store.get("scbest", {}); b[s.id] = Math.max(b[s.id] || 0, ok ? 1 : 0); store.set("scbest", b);
}
function renderScen() {
  const v = $("#view-scen"), list = scList(), best = store.get("scbest", {});
  if (!list.length) { v.innerHTML = `<div class="panel empty">No troubleshooting tickets in the selected domains. They cover 1.0 and 2.0.</div>`; return; }
  let s = list.find(x => x.id === sc.id);
  if (!s) { s = list[0]; scInit(s); }
  const st = sc.st;
  v.innerHTML = `<select class="txt pickm" id="scsel" aria-label="Choose a ticket">${list.map(x => `<option value="${x.id}"${x.id === s.id ? " selected" : ""}>${x.d}.0 · ${esc(x.title)}${best[x.id] ? " ✓" : ""}</option>`).join("")}</select><div class="pbqpick">${list.map(x => `<button type="button" class="chip" id="sc-${x.id}" aria-pressed="${x.id === s.id}"><i style="background:var(--d${x.d})"></i>${esc(x.title)}${best[x.id] ? ` <span class="mono note">✓</span>` : ""}</button>`).join("")}</div>
    <div class="panel"><div class="bar">${tagHTML(s)}<span class="tag">· ${s.sh === "cmd" ? "Windows Command Prompt" : "Linux bash"} on ${esc(s.host)}</span><span class="score">${st.n} command${st.n === 1 ? "" : "s"} · par ${s.par}</span></div>
      <div class="ticket"><span class="lbl">Ticket</span><p>${esc(s.ticket)}</p></div>
      <div class="term tall" id="scterm" aria-live="polite">${st.lines.length ? "" : `<div class="dim">${s.sh === "cmd" ? "Microsoft Windows [Version 10.0.26100.2033]\n(c) Microsoft Corporation. All rights reserved." : "Ubuntu 24.04.1 LTS " + esc(s.host) + " tty1"}</div>`}${st.lines.map(l => l.o != null ? `<pre>${esc(l.o)}</pre>` : `<pre><span class="ps">${esc(l.p)}</span> ${esc(l.c)}</pre>`).join("")}
        <div class="line"><span class="ps">${esc(promptFor(s))}</span><input id="scin" aria-label="Command" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
      <div class="row"><button class="btn ghost" id="schint" ${st.hints >= s.hints.length ? "disabled" : ""}>Hint (${s.hints.length - st.hints} left)</button>${st.stage === "explore" ? `<button class="btn" id="scdiag">Diagnose &amp; fix →</button>` : ""}<button class="btn ghost" id="screset">Restart ticket</button></div>
      <div id="schints">${s.hints.slice(0, st.hints).map((h, i) => `<div class="fb"><b class="v">Hint ${i + 1}</b><span class="mono">${esc(h)}</span></div>`).join("")}</div>
      <div id="scflow"></div></div>`;
  const term = $("#scterm"); term.scrollTop = term.scrollHeight;
  list.forEach(x => { $("#sc-" + x.id).onclick = () => { scInit(x); renderScen(); }; });
  $("#scsel").onchange = e => { scInit(list.find(x => x.id === e.target.value)); renderScen(); };
  const inp = $("#scin");
  if (!st.done) inp.focus({ preventScroll: true });
  inp.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); scRun(s, inp.value); renderScen(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (st.hi > 0) { st.hi--; inp.value = st.hist[st.hi]; } }
    else if (e.key === "ArrowDown") { e.preventDefault(); if (st.hi < st.hist.length) { st.hi++; inp.value = st.hist[st.hi] || ""; } }
  };
  term.onclick = e => { if (e.target === term || e.target.tagName === "PRE") inp.focus(); };
  $("#schint").onclick = () => { st.hints = Math.min(s.hints.length, st.hints + 1); renderScen(); };
  $("#screset").onclick = () => { scInit(s); renderScen(); };
  if ($("#scdiag")) $("#scdiag").onclick = () => { st.stage = "diag"; renderScen(); $("#scflow").scrollIntoView({ block: "nearest" }); };
  const flow = $("#scflow");
  if (st.stage === "explore") return;
  const mc = (key, item, picked) => `<div class="prompt" style="font-size:1.05rem;margin:16px 0 10px">${esc(item.q)}</div><div class="opts">${item.c.map((o, i) => {
    const cls = picked === null ? "" : i === item.a ? " ok" : i === picked ? " no" : "";
    return `<button class="opt${cls}" type="button" data-${key}="${i}" ${picked !== null ? "disabled" : ""}><span class="bub">${LET[i]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
    ${picked !== null ? `<div class="fb ${picked === item.a ? "good" : "bad"}"><b class="v">${picked === item.a ? "Correct" : "Not quite"}</b>${esc(item.why)}</div>` : ""}`;
  let html = mc("dg", s.diag, st.diag);
  if (st.diag !== null) {
    if (st.fixBy === "cmd") html += `<div class="fb good"><b class="v">Fix already applied from the terminal</b>You ran the fix yourself. ${esc(s.fix.why)}</div>`;
    else html += mc("fx", s.fix, st.fix);
  }
  const fixDone = st.diag !== null && (st.fixBy === "cmd" || st.fix !== null);
  if (fixDone && s.verify && !st.verified && st.preVerified && st.fixBy === "cmd") st.verified = true;
  if (fixDone && s.verify && !st.verified) html += `<div class="fb part"><b class="v">Verify full system functionality</b>${esc(s.verify.hint)} Type it in the terminal above.</div>`;
  if (fixDone && (!s.verify || st.verified)) {
    scFinish(s);
    const dOK = st.diag === s.diag.a, fOK = st.fixBy === "cmd" || st.fix === s.fix.a;
    html += `<div class="tbl" style="margin-top:14px"><table><tbody>
      <tr><td>Root cause</td><td class="num">${dOK ? "✓" : "✗"}</td></tr>
      <tr><td>Fix</td><td class="num">${fOK ? "✓" : "✗"}${st.fixBy === "cmd" ? " (ran it yourself)" : ""}</td></tr>
      <tr><td>Verified from the terminal</td><td class="num">${s.verify ? "✓" : "n/a"}</td></tr>
      <tr><td>Commands used</td><td class="num">${st.n} (par ${s.par})${st.n <= s.par ? " · efficient" : ""}</td></tr>
      <tr><td>Hints used</td><td class="num">${st.hints}</td></tr></tbody></table></div>
      <div class="row"><button class="btn" id="scnext">Next ticket →</button></div>`;
  }
  flow.innerHTML = html;
  flow.querySelectorAll("[data-dg]").forEach(b => b.onclick = () => { st.diag = +b.dataset.dg; if (st.fixed && st.preVerified) st.verified = true; renderScen(); $("#scflow").scrollIntoView({ block: "nearest" }); });
  flow.querySelectorAll("[data-fx]").forEach(b => b.onclick = () => { st.fix = +b.dataset.fx; st.fixed = true; st.fixBy = "mc"; renderScen(); $("#scflow").scrollIntoView({ block: "nearest" }); });
  if ($("#scnext")) $("#scnext").onclick = () => { const nx = list[(list.indexOf(s) + 1) % list.length]; scInit(nx); renderScen(); window.scrollTo({ top: 0 }); };
}

/* ---------- boot ---------- */
function resetViews() { fc.deck = []; cp.list = []; cp.i = 0; if (ex.phase === "setup") {} }
function render() {
  if (tab === "cards") renderCards();
  else if (tab === "code") renderCode();
  else if (tab === "exam") renderExam();
  else if (tab === "pbq") renderPBQ();
  else if (tab === "scen") renderScen();
  else if (tab === "fixes") renderFixes();
  else renderStats();
}
document.addEventListener("keydown", e => { if (fc.keyHandler) fc.keyHandler(e); });
$("#fixcount").textContent = ERRATA.length;
buildDomainBar();
setTab(tab);
})();

</script>
